<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='3' y='5' width='24' height='22' rx='4' fill='%2315202b'/%3E%3Crect x='7' y='14' width='5' height='6' rx='1' fill='%23f6b4ae'/%3E%3Crect x='13' y='14' width='5' height='6' rx='1' fill='%23a3cdf3'/%3E%3Crect x='19' y='14' width='5' height='6' rx='1' fill='%23b7dd9a'/%3E%3C/svg%3E">
<title>Haematology Rota</title>
<meta name="description" content="Haematology department rota: who is where at GUH, RGH and NHH, leave requests and authorisation, EDT/SDT and rules.">
<meta name="robots" content="noindex, nofollow">
<script>
// Applies the saved theme before the page draws (dark by default).
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('haem-rota-theme') || 'dark'; } catch (e) { /* storage blocked */ }
  if (t !== 'light' && t !== 'blue') t = 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* Layout: one working surface. Dark header with navigation and the person switcher, then a full-width tool area.
   Site colours follow the department's Excel: GUH red, RGH blue, NHH green, leave yellow. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef2f6; --line: #dbe2ea; --line-strong: #c3ccd7;
  --fg: #15202b; --muted: #4a5868; --faint: #6b7787;
  --accent: #1f4fa8; --accent-fg: #ffffff; --accent-soft: #e6eefb;
  --head-bg: #15202b; --head-fg: #ffffff; --head-muted: #b8c4d2; --head-chip: #2b3a4d;
  --ok-bg: #e7f4ea; --ok-fg: #1d5a2a; --ok-line: #bcdcc4;
  --warn-bg: #fff1dc; --warn-fg: #6e3700; --warn-line: #f0c896;
  --bad-bg: #a3261b; --bad-fg: #ffffff; --bad-soft: #fbe3e0; --bad-text: #a3261b;
  --na-bg: #f1f3f6; --na-fg: #6b7787;
  --guh-bg: #f6b4ae; --guh-fg: #5e0f09; --rgh-bg: #a3cdf3; --rgh-fg: #08345e; --nhh-bg: #b7dd9a; --nhh-fg: #1f430d;
  --lab-bg: #f7d7d4; --lab-fg: #5e0f09;
  --leave-bg: #ffe36e; --leave-fg: #443300; --sick-bg: #ffe36e; --sick-fg: #443300;
  --call-bg: #ffe36e; --call-fg: #443300; --off-bg: #ffffff; --off-fg: #5f6b7a;
  --gone-a: #3a4452; --gone-b: #5f6b7a; --weekend: #2b3440; --weekend-fg: #d5dee8;
  --no-al: #a3261b; --avoid: #5b3a8c;
  --shadow: 0 8px 28px rgba(21, 32, 43, 0.18);
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --surface-2: #1e2935; --line: #2c3946; --line-strong: #3b4a5a;
  --fg: #e8edf2; --muted: #a9b6c4; --faint: #8b98a7;
  --accent: #7ea8f0; --accent-fg: #0b1626; --accent-soft: #1d2d47;
  --head-bg: #0a0f14; --head-fg: #ffffff; --head-muted: #9fb0c2; --head-chip: #223041;
  --ok-bg: #173323; --ok-fg: #a8dfb5; --ok-line: #2b5a3a;
  --warn-bg: #3a2810; --warn-fg: #ffd39c; --warn-line: #6b4a1c;
  --bad-bg: #d9483a; --bad-fg: #ffffff; --bad-soft: #3d1a17; --bad-text: #ff9b8f;
  --na-bg: #1e2935; --na-fg: #8b98a7;
  --guh-bg: #e79c95; --guh-fg: #3d0703; --rgh-bg: #8dbde8; --rgh-fg: #04213d; --nhh-bg: #a3cf85; --nhh-fg: #142c07;
  --lab-bg: #d9b3af; --lab-fg: #3d0703;
  --leave-bg: #e8cc55; --leave-fg: #2b2000; --sick-bg: #e8cc55; --sick-fg: #2b2000;
  --call-bg: #e8cc55; --call-fg: #2b2000; --off-bg: #222d39; --off-fg: #b9c4d0;
  --gone-a: #2b333d; --gone-b: #46515e; --weekend: #0b1016; --weekend-fg: #9fb0c2;
  --no-al: #d9483a; --avoid: #9a76d4;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
/* Blue theme: navy chrome, soft blue page */
:root[data-theme="blue"] {
  --bg: #e8f0fb; --surface: #ffffff; --surface-2: #dde8f7; --line: #c9d8ee; --line-strong: #a9c0e2;
  --fg: #0c2340; --muted: #3d5677; --faint: #5c7393;
  --accent: #005eb8; --accent-fg: #ffffff; --accent-soft: #dbe9fa;
  --head-bg: #003087; --head-fg: #ffffff; --head-muted: #c4d6f2; --head-chip: #0b4aa8;
  --weekend: #1d3a66; --weekend-fg: #dbe7f7;
  --material: rgba(0, 48, 135, 0.86); --sheet-material: rgba(255, 255, 255, 0.95);
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.app-head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand strong { display: block; font-size: 1rem; }
.brand span { display: block; font-size: 0.75rem; color: var(--head-muted); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; }
.nav button { background: transparent; border: 0; color: var(--head-muted); padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; min-height: 40px; }
.nav button:hover { color: var(--head-fg); background: var(--head-chip); }
.nav button[aria-current="page"] { background: var(--head-chip); color: var(--head-fg); font-weight: 600; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: #e8833a; color: #15202b; font-size: 0.75rem; font-weight: 700; text-align: center; }
.who { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--head-muted); }
.who select { background: var(--head-chip); color: var(--head-fg); border: 1px solid #3b4a5d; border-radius: 6px; padding: 6px 8px; min-height: 38px; max-width: 220px; }
.proto-bar { background: var(--warn-bg); color: var(--warn-fg); border-bottom: 1px solid var(--warn-line); padding: 6px 16px; font-size: 0.8rem; }

main { padding-inline: 16px; padding-block: 18px 60px; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head p { margin-top: 4px; max-width: 75ch; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-weight: 500; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.good { background: var(--ok-fg); color: var(--surface); border-color: var(--ok-fg); font-weight: 600; }
.btn.danger { color: var(--bad-text); border-color: var(--bad-text); background: var(--surface); }
.btn.danger.solid { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.icon { width: 40px; padding: 0; font-size: 1.1rem; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
input[type="text"], input[type="date"], input[type="search"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; min-height: 40px; background: var(--surface); color: var(--fg); }
textarea { padding: 8px 10px; resize: vertical; }
input[type="number"] { width: 80px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > .main { flex: 999 1 560px; min-width: 0; }
.split > .side { flex: 1 1 320px; min-width: 0; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.notice.ok { background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-line); }
.notice.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.notice.bad { background: var(--bad-soft); color: var(--bad-text); border: 1px solid var(--bad-text); }
.notice.info { background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.pill.pending { background: var(--warn-bg); color: var(--warn-fg); }
.pill.authorised { background: var(--ok-bg); color: var(--ok-fg); }
.pill.declined { background: var(--bad-soft); color: var(--bad-text); }
.pill.cancelled { background: var(--na-bg); color: var(--na-fg); }

/* roster */
.table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 72vh; }
table.roster { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 0.78rem; }
.roster th, .roster td { padding: 3px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.roster thead th { position: sticky; top: 0; background: var(--surface); z-index: 3; font-weight: 600; padding: 8px 4px; border-bottom: 2px solid var(--line-strong); }
.roster thead tr.groups th { top: 0; z-index: 4; font-size: 0.72rem; color: var(--muted); background: var(--surface-2); border-bottom: 0; padding: 5px; }
.roster thead tr.names th { top: 27px; }
.roster .col-date { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 4px 8px; min-width: 96px; }
.roster thead .col-date { z-index: 5; }
.roster th.doc { min-width: 92px; max-width: 120px; }
.roster th.doc .grade { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 600; }
.roster th.doc .dates { display: block; font-size: 0.66rem; color: var(--faint); font-weight: 400; }
.roster .gap-col { width: 8px; padding: 0; background: var(--surface-2); }
.roster tr.weekend td, .roster tr.weekend .col-date { background: var(--weekend); color: var(--weekend-fg); }
.roster tr.today .col-date { box-shadow: inset 4px 0 0 var(--accent); }
.roster .cons { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 34px; padding: 2px 4px; border-radius: 5px; font-weight: 600; line-height: 1.1; font-size: 0.72rem; border: 1px solid transparent; width: 100%; }
button.cell { cursor: pointer; font-family: inherit; }
button.cell:hover { outline: 2px solid var(--accent); outline-offset: 0; }
.k-site.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.k-site.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.k-site.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.k-lab { background: var(--lab-bg); color: var(--lab-fg); }
.k-leave { background: var(--leave-bg); color: var(--leave-fg); }
.k-sick { background: var(--sick-bg); color: var(--sick-fg); }
.k-oncall { background: var(--call-bg); color: var(--call-fg); }
.k-off { background: var(--off-bg); color: var(--off-fg); border-color: var(--line); }
.k-bh { background: var(--na-bg); color: var(--na-fg); }
.k-other { background: var(--call-bg); color: var(--call-fg); }
.k-none { background: transparent; color: var(--faint); }
.k-gone { background: repeating-linear-gradient(45deg, var(--gone-a) 0 6px, var(--gone-b) 6px 12px); color: #ffffff; }
.k-half { color: var(--fg); }
.k-half.s-GUH { background: linear-gradient(90deg, var(--guh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-RGH { background: linear-gradient(90deg, var(--rgh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-NHH { background: linear-gradient(90deg, var(--nhh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-none { background: var(--leave-bg); color: var(--leave-fg); }
.cell.pending { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255, 227, 110, 0.85) 6px 12px); border: 1px dashed var(--warn-fg); }
.cell .mark { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--surface); }
.cell .mark.override { background: var(--accent); }
.cell .mark.conflict { background: var(--bad-bg); }
.dim .cell { opacity: 0.14; filter: grayscale(0.85); }
.roster.hi-on td:not(.dim) .cell:not(.k-none) { box-shadow: 0 0 0 2px var(--fg); }
.wl.dim { opacity: 0.3; }
.cover-cell { white-space: nowrap; }
.cv { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 3px 5px; border-radius: 4px; margin: 1px; border: 1px solid transparent; }
.cv.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
.cv.gap { background: var(--bad-bg); color: var(--bad-fg); }
.cv.exception { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.cv.risk { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 5px, var(--surface) 5px 10px); color: var(--bad-text); border: 1px dashed var(--bad-text); }
.cv.na { background: var(--na-bg); color: var(--na-fg); }
.restr { display: inline-block; font-size: 0.62rem; font-weight: 700; color: #ffffff; padding: 1px 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
.restr.NO-AL { background: var(--no-al); }
.restr.AVOID { background: var(--avoid); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--muted); align-items: center; }
.legend .sw { display: inline-block; width: 18px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

/* day view */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daybtn { flex: none; min-width: 64px; min-height: 60px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
.daybtn[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.daybtn .d { font-size: 0.72rem; color: var(--muted); }
.daybtn .n { font-size: 1rem; font-weight: 700; }
.daybtn .f { font-size: 0.72rem; font-weight: 700; }
.f.ok { color: var(--ok-fg); } .f.exception, .f.risk { color: var(--warn-fg); } .f.gap { color: var(--bad-text); }
.site-card { padding: 0; overflow: hidden; gap: 0; }
.site-card .site-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.site-head.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.site-head.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.site-head.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.site-card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.person { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.gbadge { flex: none; min-width: 46px; text-align: center; font-size: 0.7rem; font-weight: 700; padding: 4px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.gbadge.mg { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* lists */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; color: var(--fg); }
.list-item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.plain th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line-strong); }
.plain td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.scroll-x { overflow-x: auto; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border: 2px solid var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 3px; }
.drop { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; counter-reset: step; }
.steps li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.steps li::before { counter-increment: step; content: counter(step); width: 28px; height: 28px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-mono); }
.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 10px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

/* editor sheet and toasts */
.sheet { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; z-index: 40; display: flex; flex-direction: column; gap: 10px; }
.toasts { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100% - 32px); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 0.9rem; }
.toast.error { background: var(--bad-bg); color: var(--bad-fg); }
@media (max-width: 640px) { h1 { font-size: 1.3rem; } }
/* v2 additions */
.theme-switch { display: inline-flex; background: var(--head-chip); border-radius: 10px; padding: 3px; gap: 2px; }
.theme-switch button { border: 0; background: transparent; color: var(--head-muted); min-height: 32px; padding: 0 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
.theme-switch button[aria-pressed="true"] { background: var(--head-fg); color: var(--head-bg); }
details.filters > summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--muted); padding: 4px 0; }
details.filters[open] > summary { margin-bottom: 8px; }
.who .btn { background: var(--head-chip); color: var(--head-fg); border-color: #3b4a5d; }
.small-btn { min-height: 34px; padding: 0 10px; font-size: 0.82rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
.proto-bar .linkish { color: inherit; font-weight: 700; }
.proto-bar { display: flex; flex-direction: column; gap: 2px; }
.proto-bar[hidden] { display: none; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.warn-text { color: var(--warn-fg); font-weight: 600; }
.pill.hold { background: var(--accent-soft); color: var(--accent); }
.restr.BH { background: var(--faint); }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
tr.past td { opacity: 0.6; }
.tag { align-self: flex-start; display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: var(--muted); margin-top: 6px; }
.tag.blue { background: var(--accent-soft); color: var(--accent); }
.rule-sec { display: grid; grid-template-columns: minmax(0, 240px) 1fr; gap: 16px; }
.rule-sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; max-width: 80ch; }
@media (max-width: 700px) { .rule-sec { grid-template-columns: 1fr; gap: 6px; } }
/* EDT embossed into the cell */
.emb { display: inline-block; margin-top: 2px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.02em; padding: 1px 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.75); color: #15202b; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.25), 0 1px 0 rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.25); }
.emb.leave { background: var(--leave-bg); color: var(--leave-fg); }
.k-edt.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.k-edt.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.k-edt.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.k-edt.s-LAB, .k-edt.s-none { background: var(--lab-bg); color: var(--lab-fg); }
.k-half.s-LAB { background: linear-gradient(90deg, var(--lab-bg) 50%, var(--leave-bg) 50%); }
.cell .req { font-size: 0.6rem; font-weight: 600; }
.sw.pending { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255, 227, 110, 0.95) 3px 6px); border: 1px dashed var(--warn-fg); }
.sw.k-edt { background: var(--surface-2); }
/* changeover bands */
.roster tr.band td { position: sticky; left: 0; background: var(--accent); color: var(--accent-fg); text-align: left; font-size: 0.78rem; font-weight: 600; padding: 5px 10px; }
.band-label { display: inline-block; background: var(--accent-fg); color: var(--accent); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
.band-card { background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; }
.table-wrap { max-height: calc(100vh - 250px); min-height: 320px; }
.roster th.doc { min-width: 84px; }
@media (max-width: 1100px) { .roster th.doc { min-width: 74px; } .cell { font-size: 0.68rem; } }
/* list view */
.day-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 10px; }
.day-list .band-card { grid-column: 1 / -1; }
.day-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.day-card.today { border: 2px solid var(--accent); }
.day-card.wk { background: var(--surface-2); }
.day-card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: baseline; }
.wl { font-size: 0.9rem; line-height: 1.45; }
.wl-site { display: inline-block; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-right: 2px; }
.wl-site.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.wl-site.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.wl-site.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.wl-site.k-edt { background: var(--surface-2); border: 1px solid var(--line-strong); }
.wl-site.pending { background: var(--warn-bg); color: var(--warn-fg); }
/* leave form */
.qform { gap: 0; padding: 8px 16px; }
.q { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.qn { width: 28px; height: 28px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-mono); font-size: 0.85rem; }
.qb { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ql { font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
.ql .hint { font-weight: 400; color: var(--muted); font-size: 0.82rem; }
.qb select, .qb input[type="email"], .qb input[type="date"] { max-width: 360px; width: 100%; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts .opt { padding: 8px 12px; align-items: center; }
.qform > .row { padding: 14px 0; }
/* authoriser */
.kv { grid-template-columns: minmax(120px, max-content) 1fr; }
table.check tr.bad td { background: var(--bad-soft); }
table.check tr.warn td { background: var(--warn-bg); }
.decide { border-top: 1px solid var(--line); padding-top: 12px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { padding: 8px 10px; border-radius: 8px; }
.checks li.ok { background: var(--ok-bg); color: var(--ok-fg); }
.checks li.bad { background: var(--bad-soft); color: var(--bad-text); }
.edt-opt { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; }
.edt-opt.ok { background: var(--ok-bg); color: var(--ok-fg); }
.edt-opt.bad { background: var(--bad-soft); color: var(--bad-text); }
.sheet { max-height: calc(100vh - 32px); overflow: auto; }
table.people input[type="date"] { width: 140px; }
/* dialogs */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, 0.5); z-index: 60; }
.dialog { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
.dialog input, .dialog select, .dialog textarea { width: 100%; }
@media (max-width: 760px) {
  .app-head { position: static; }
  .nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .nav button { white-space: nowrap; }
  .toolbar { gap: 8px; }
  .q { grid-template-columns: 28px 1fr; gap: 8px; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 6px; }
}



/* working counts */
.avail { display: inline-block; font-size: 0.72rem; font-weight: 500; white-space: nowrap; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); vertical-align: middle; }
.avail b { font-weight: 700; font-variant-numeric: tabular-nums; }
.roster td.avail-cell { white-space: nowrap; }
/* show more / earlier */
.more-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px; position: sticky; left: 0; }
.table-wrap > .more-row:first-child { border-bottom: 1px solid var(--line); }
.field.inline input { min-height: 40px; }
/* round 5: columns that continue across changeovers, list and by-site views, balances, master sheet */
.roster th.doc .next { display: block; font-size: 0.64rem; color: var(--accent); font-weight: 600; }
.tbc { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 0 4px; border-radius: 3px; background: var(--warn-bg); color: var(--warn-fg); border: 1px dashed var(--warn-fg); vertical-align: middle; }
.roster tr.band th, .roster tr.band td { background: var(--accent); color: var(--accent-fg); border-bottom: 0; font-size: 0.72rem; position: static; }
.roster tr.band th.col-date { position: sticky; left: 0; z-index: 2; font-weight: 700; line-height: 1.2; }
.roster tr.band td.band-cell { font-weight: 700; text-align: center; }
.roster tr.band td.band-cell span { display: block; font-weight: 500; opacity: 0.85; font-size: 0.66rem; }
.roster tr.band td.band-note { font-size: 0.66rem; text-align: left; white-space: normal; max-width: 130px; min-width: 0; line-height: 1.25; }
.wl-block { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid var(--line); }
.wl-block .wl-site { text-align: center; padding: 2px 6px; }
.wl-block.dim, .site-col.dim { opacity: 0.25; filter: grayscale(0.8); }
.wl b, .site-sec b { font-weight: 700; }
.wl-site.k-oncall { background: var(--call-bg); color: var(--call-fg); }
.day-list.one-col { grid-template-columns: 1fr; }
.site-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.site-col { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.site-col h4 { margin: 0; padding: 7px 10px; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.site-col h4 span { font-size: 0.7rem; font-weight: 500; opacity: 0.85; }
.site-col h4.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.site-col h4.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.site-col h4.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.site-col h4.k-oncall { background: var(--call-bg); color: var(--call-fg); }
.site-sec { padding: 6px 10px; font-size: 0.88rem; }
.site-sec + .site-sec { border-top: 1px solid var(--line); }
.site-sec ul { margin: 2px 0 0; padding-left: 18px; }
.site-sec li { line-height: 1.45; }
.bal-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.bal { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.bal-n { font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.bal-t { font-weight: 600; }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; max-height: 220px; overflow: auto; padding: 2px; }
.pick-list .opt { padding: 6px 8px; }
table.master td { padding: 5px 6px; }
table.master select { min-width: 92px; }
table.master tr.sec th { background: var(--surface-2); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; }
table.master tr.follows td:first-child { padding-left: 18px; }
.follow { color: var(--accent); font-weight: 700; margin-right: 4px; }
details.month { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
details.month + details.month { margin-top: 6px; }
details.month summary { cursor: pointer; padding: 4px 0; }
.cons-row { padding: 3px 0; }
.who { gap: 10px; flex-wrap: wrap; }
@media (max-width: 760px) { .wl-block { grid-template-columns: 1fr; gap: 2px; } .wl-block .wl-site { justify-self: start; } }

/* chart colours: one blue, two steps (validated), on a neutral track */
:root { --viz-1: #2a78d6; --viz-2: #86b6ef; --viz-track: #e6e4df; }
:root[data-theme="dark"] { --viz-1: #3987e5; --viz-2: #184f95; --viz-track: #383835; }
/* ---------- round 6: mobile polish, quiet theme button, changeover rows, legibility ---------- */
.icon-btn { width: 32px; height: 32px; min-height: 0; border-radius: 16px; border: 0; background: transparent; color: var(--head-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; opacity: 0.75; transition: opacity 120ms ease, background-color 120ms ease, transform 100ms ease-out; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { opacity: 1; background: var(--head-chip); }
.icon-btn:active { transform: scale(0.92); }
.who { margin-left: auto; gap: 6px; }
.who .btn.quiet { background: transparent; border-color: transparent; color: var(--head-fg); font-weight: 600; }
.who .btn.quiet:hover { background: var(--head-chip); }
.who-name { font-size: 0.8rem; color: var(--head-muted); }
.who .short { display: none; }
.theme-switch { display: none; }
.tabbar { display: none; }
.ico { width: 22px; height: 22px; }
/* legible text on every coloured cell, in every theme */
.cell { font-weight: 700; letter-spacing: 0.01em; -webkit-text-fill-color: currentColor; }
.k-site.s-GUH, .k-edt.s-GUH { color: #3b0502; }
.k-site.s-RGH, .k-edt.s-RGH { color: #03213f; }
.k-site.s-NHH, .k-edt.s-NHH { color: #142d05; }
.k-lab, .k-edt.s-LAB { color: #3b0502; }
.k-leave, .k-sick, .k-oncall, .k-other, .k-half.s-none { color: #2b2000; }
.k-half { color: #15202b; }
:root[data-theme="dark"] { --guh-bg: #f0a59e; --rgh-bg: #9cc8f2; --nhh-bg: #b2d998; --lab-bg: #e6c1bd; --leave-bg: #f2d45e; --call-bg: #f2d45e; --sick-bg: #f2d45e; }
.restr.PROG { background: var(--accent); }
/* changeover: the column headers repeat with the new names */
.roster tr.co-row th, .roster tr.co-row td { background: var(--accent-soft); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); }
.roster tr.co-row th.col-date { position: sticky; left: 0; z-index: 2; font-size: 0.72rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
.roster tr.co-row th.doc { font-size: 0.78rem; font-weight: 600; color: var(--muted); padding: 6px 4px; }
.roster tr.co-row th.doc.changed { color: var(--fg); background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 6px; }
.roster tr.co-row th.doc.vacant { color: var(--bad-text); font-style: italic; }
.roster tr.co-row td.co-note { font-size: 0.68rem; color: var(--accent); font-weight: 600; white-space: normal; max-width: 130px; text-align: left; }
/* More sheet */
.more-list { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.more-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 600; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
.more-item:last-child { border-bottom: 0; }
.more-item .chev { margin-left: auto; color: var(--faint); font-size: 1.2rem; }
.more-item:active { background: var(--line); }
.theme-seg { justify-content: center; }
.donut-wrap { display: flex; align-items: center; gap: 14px; }
.donut { width: 112px; height: 112px; flex: none; }
.donut text { fill: var(--fg); font-family: var(--font-body); }
.donut .big { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.donut .sub { font-size: 9px; fill: var(--muted); }
.legend-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
.legend-list .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.mini-wrap { max-height: none; }
.al-grid + .bal, .stack > .bal { max-width: 420px; }
.al-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.al-tile { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.al-tile[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.al-tile .ring { flex: none; }
.al-t { display: flex; flex-direction: column; min-width: 0; }
.al-t strong:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ring-n { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.sw-inline { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
.roster.mini td.mine .cell { outline: 3px solid var(--fg); outline-offset: -1px; }
.roster.mini td.cover .cell { outline: 3px dashed var(--ok-fg); outline-offset: -1px; }
.roster.mini th.doc.mine { box-shadow: inset 0 -3px 0 var(--fg); }
.roster.mini th.doc.cover { box-shadow: inset 0 -3px 0 var(--ok-fg); }
.legend-sw { display: inline-block; width: 14px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend-sw.mine { outline: 3px solid var(--fg); outline-offset: -3px; }
.legend-sw.cover { outline: 3px dashed var(--ok-fg); outline-offset: -3px; }
.roster.mini td.dim .cell { opacity: 0.35; }
.roster.mini tr.req-day th.col-date { box-shadow: inset 4px 0 0 var(--warn-fg); }
@media (max-width: 760px) {
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .app-head { position: sticky; top: 0; padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
  .app-head .nav { display: none; }
  .brand-mark { width: 26px; height: 26px; }
  .brand strong { font-size: 0.95rem; }
  .brand span { display: none; }
  .who .long, .who-name { display: none; }
  .who .short { display: inline; }
  .proto-bar { font-size: 0.72rem; padding: 4px 12px; }
  main { padding-inline: 12px; padding-block: 12px 24px; gap: 12px; }
  h1 { font-size: 1.45rem; }
  .page-head p { font-size: 0.85rem; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.06) inset, 0 -8px 20px -16px rgba(0, 0, 0, 0.6); }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: 0; color: var(--head-muted); font: inherit; font-size: 0.66rem; font-weight: 600; padding: 4px 2px; position: relative; cursor: pointer; transition: color 120ms ease, transform 100ms ease-out; }
  .tabbar button[aria-current="page"] { color: var(--head-fg); }
  .tabbar button[aria-current="page"] .ico { stroke-width: 2.3; }
  .tabbar button:active { transform: scale(0.92); }
  .tabbar .badge { position: absolute; top: 0; left: calc(50% + 6px); margin: 0; }
  .toasts { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .sheet { bottom: 0; }
  /* compact grid on phones */
  .table-wrap { max-height: calc(100vh - 220px); border-radius: 10px; }
  .roster { font-size: 0.7rem; }
  .roster .col-date { min-width: 74px; padding: 3px 6px; }
  .roster th.doc { min-width: 62px; max-width: 80px; padding: 6px 2px; }
  .roster th.doc .dates, .roster th.doc .next { font-size: 0.58rem; }
  table.roster { width: min-content; min-width: 100%; }
  .roster td { padding: 2px; }
  .roster .cell { word-break: break-word; hyphens: auto; }
  .roster th.doc .next { display: none; }
  .roster .cons { display: none; }
  .roster .col-date { min-width: 66px; white-space: nowrap; }
  .cell { min-height: 30px; font-size: 0.62rem; padding: 1px 2px; border-radius: 5px; }
  .cv { font-size: 0.6rem; padding: 2px 3px; }
  .avail { font-size: 0.6rem; padding: 1px 4px; }
  .page-head .row { width: 100%; }
  .page-head .row .btn { flex: 1; }
}
/* ---------- Apple-style feel (see .claude/skills/apple-design) ----------
   Instant press feedback, translucent chrome, size-specific type, sheets that
   materialise and can be dragged away, and gentler fallbacks for reduced motion,
   reduced transparency and high contrast. */
:root { --spring: cubic-bezier(0.2, 0.9, 0.25, 1); --material: rgba(21, 32, 43, 0.82); --sheet-material: rgba(255, 255, 255, 0.95); }
:root[data-theme="dark"] { --material: rgba(10, 15, 20, 0.78); --sheet-material: rgba(23, 32, 42, 0.95); }
body { font-size: 0.9375rem; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1 { font-size: 1.75rem; line-height: 1.1; letter-spacing: -0.022em; font-weight: 700; }
h2 { font-size: 1.15rem; line-height: 1.2; letter-spacing: -0.012em; }
h3 { letter-spacing: -0.005em; }
.label, .roster thead tr.groups th { letter-spacing: 0.06em; }
.small, .roster { letter-spacing: 0.005em; }
/* translucent header: content scrolls underneath, no hard divider */
.app-head { background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 6px 16px -12px rgba(0, 0, 0, 0.6); }
.nav button { transition: background-color 120ms ease, color 120ms ease, transform 100ms ease-out; }
/* feedback on press, instantly */
.btn, .chip, .linkish, .list-item, .daybtn, .tabs button, button.cell, .opt { touch-action: manipulation; transition: transform 100ms ease-out, background-color 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease; }
.btn:active, .chip:active, .nav button:active, .daybtn:active, .opt:active { transform: scale(0.96); }
button.cell:active, .list-item:active { transform: scale(0.97); }
.btn { border-radius: 10px; }
.btn.primary, .btn.good { box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, 0 1px 2px rgba(0, 0, 0, 0.12); }
@media (hover: hover) { .btn:hover { border-color: var(--accent); } .chip:hover { border-color: var(--fg); } }
@media (hover: none) { button.cell:hover { outline: none; } }
.chip[aria-pressed="true"] { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); }
.tabs button { border-bottom-width: 3px; transition: color 150ms ease, border-color 200ms var(--spring); }
.card { box-shadow: 0 1px 2px rgba(21, 32, 43, 0.04), 0 4px 14px -10px rgba(21, 32, 43, 0.18); }
.day-card, .table-wrap, .toolbar { box-shadow: 0 1px 2px rgba(21, 32, 43, 0.04); }
.cell { border-radius: 6px; }
/* sheets and dialogs: a material that arrives, and can be dragged away on phones */
.sheet, .dialog { background: var(--sheet-material); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.08); will-change: transform, opacity; }
.dialog { inset: 0; margin: auto; height: max-content; transform: none; border-radius: 18px; }
.sheet { border-radius: 18px; transform-origin: 100% 100%; }
.scrim { background: rgba(10, 15, 20, 0.42); }
.grabber { display: none; width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: -6px auto 4px; flex: none; }
@keyframes materialise { from { opacity: 0; transform: scale(0.94); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: none; } }

  .scrim.enter { animation: scrim-in 220ms ease-out both; }
  .toast { animation: toast-in 380ms var(--spring) both; }
}
.toast { border-radius: 14px; background: var(--material); color: #fff; -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }

@media (max-width: 760px) {

  .grabber { display: block; touch-action: none; cursor: grab; }
  .sheet-head { touch-action: none; }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: no-preference) { .sheet.enter, .dialog.enter { animation: sheet-up 380ms var(--spring) both; } }
}
/* accessibility fallbacks */

  .sheet.enter, .dialog.enter, .toast, .scrim.enter { animation: fade-in 160ms ease-out both; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
}
@media (prefers-reduced-transparency: reduce) {

  .sheet, .dialog { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }

}

<body>
<header class="app-head">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="5" width="24" height="22" rx="4" fill="none" stroke="#8fb6f0" stroke-width="2"></rect><path d="M3 12h24M10 2.5v5M20 2.5v5" stroke="#8fb6f0" stroke-width="2" fill="none"></path><rect x="7" y="16" width="5" height="4" rx="1" fill="#f6b4ae"></rect><rect x="13" y="16" width="5" height="4" rx="1" fill="#a3cdf3"></rect><rect x="19" y="16" width="5" height="4" rx="1" fill="#b7dd9a"></rect></svg>
    <div><strong>Haematology Rota</strong><span>GUH · RGH · NHH</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="who" id="who"></div>
</header>
<div class="proto-bar" id="bar" role="note" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="sheet-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* Minimal .xlsx reader and writer with no dependencies.
 * Writer: stored (uncompressed) zip, shared styles (fills, fonts, borders, date format).
 * Reader: handles deflate via DecompressionStream, shared and inline strings, date-formatted cells.
 * Works in browsers and in Node 18+ (for tests and build scripts). */
(function (root) {
  'use strict';

  // ---------- zip ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const enc = (s) => new TextEncoder().encode(s);
  const dec = (b) => new TextDecoder('utf-8').decode(b);

  function zip(files) {
    // files: [{name, data: Uint8Array}] -> Uint8Array (method 0, stored)
    const parts = [];
    const central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc(f.name);
      const crc = crc32(f.data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); // UTF-8 names
      local.setUint16(8, 0, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, f.data.length, true);
      local.setUint32(22, f.data.length, true);
      local.setUint16(26, name.length, true);
      parts.push(new Uint8Array(local.buffer), name, f.data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, f.data.length, true);
      cd.setUint32(24, f.data.length, true);
      cd.setUint16(28, name.length, true);
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), name);
      offset += 30 + name.length + f.data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
    let p = 0;
    for (const a of all) { out.set(a, p); p += a.length; }
    return out;
  }

  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('This file is not a valid .xlsx (zip) file.');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Damaged .xlsx file (central directory).');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lofs = dv.getUint32(p + 42, true);
      const name = dec(bytes.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(lofs + 26, true);
      const lelen = dv.getUint16(lofs + 28, true);
      const start = lofs + 30 + lnlen + lelen;
      const raw = bytes.subarray(start, start + csize);
      if (method === 0) out[name] = raw;
      else if (method === 8) out[name] = await inflateRaw(raw);
      else throw new Error('Unsupported compression in .xlsx file.');
      p += 46 + nlen + elen + clen;
    }
    return out;
  }

  // ---------- helpers ----------
  const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const xmlUnesc = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');
  function colName(i) { // 0 -> A
    let s = '';
    i += 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function colIndex(ref) {
    const m = /^([A-Z]+)/.exec(ref);
    let n = 0;
    for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
  function isoToSerial(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return (Date.UTC(y, m - 1, d) - EXCEL_EPOCH) / 86400000;
  }
  function serialToIso(n) {
    const d = new Date(EXCEL_EPOCH + Math.round(n) * 86400000);
    return d.toISOString().slice(0, 10);
  }

  // ---------- writer ----------
  // sheet: {name, rows: [[cell]], widths: [n], freeze: {row, col}, heights: {rowIndex: pt}}
  // cell: null | string | number | {v, date: true, style: {...}}
  // style: {fill: 'RRGGBB', bold, color: 'RRGGBB', size, center, wrap, border}
  function write(sheets) {
    const styleKeys = new Map(); // json -> index
    const fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
    const fonts = ['<font><sz val="10"/><name val="Calibri"/></font>'];
    const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>',
      '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>'];
    const xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    const fillIdx = new Map(); const fontIdx = new Map();
    function styleIndex(style, isDate) {
      if (!style && !isDate) return 0;
      const s = style || {};
      const key = JSON.stringify([s, !!isDate]);
      if (styleKeys.has(key)) return styleKeys.get(key);
      let fillId = 0;
      if (s.fill) {
        if (!fillIdx.has(s.fill)) { fillIdx.set(s.fill, fills.length); fills.push(`<fill><patternFill patternType="solid"><fgColor rgb="FF${s.fill}"/><bgColor indexed="64"/></patternFill></fill>`); }
        fillId = fillIdx.get(s.fill);
      }
      let fontId = 0;
      if (s.bold || s.color || s.size) {
        const fk = [s.bold, s.color, s.size].join('|');
        if (!fontIdx.has(fk)) {
          fontIdx.set(fk, fonts.length);
          fonts.push(`<font>${s.bold ? '<b/>' : ''}<sz val="${s.size || 10}"/>${s.color ? `<color rgb="FF${s.color}"/>` : ''}<name val="Calibri"/></font>`);
        }
        fontId = fontIdx.get(fk);
      }
      const borderId = s.border ? 1 : 0;
      const align = s.center || s.wrap ? `<alignment${s.center ? ' horizontal="center" vertical="center"' : ''}${s.wrap ? ' wrapText="1"' : ''}/>` : '';
      const numFmt = isDate ? 164 : 0;
      xfs.push(`<xf numFmtId="${numFmt}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0"${fillId ? ' applyFill="1"' : ''}${fontId ? ' applyFont="1"' : ''}${borderId ? ' applyBorder="1"' : ''}${isDate ? ' applyNumberFormat="1"' : ''}${align ? ' applyAlignment="1">' + align + '</xf>' : '/>'}`);
      styleKeys.set(key, xfs.length - 1);
      return xfs.length - 1;
    }

    const sheetXml = sheets.map((sh) => {
      const rowsXml = sh.rows.map((row, r) => {
        const cells = (row || []).map((cell, c) => {
          if (cell === null || cell === undefined || cell === '') return '';
          const obj = typeof cell === 'object' ? cell : { v: cell };
          const ref = colName(c) + (r + 1);
          const s = styleIndex(obj.style, obj.date);
          const sAttr = s ? ` s="${s}"` : '';
          if (obj.v === null || obj.v === undefined || obj.v === '') return `<c r="${ref}"${sAttr}/>`;
          if (obj.date) return `<c r="${ref}"${sAttr}><v>${isoToSerial(obj.v)}</v></c>`;
          if (typeof obj.v === 'number') return `<c r="${ref}"${sAttr}><v>${obj.v}</v></c>`;
          return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(obj.v)}</t></is></c>`;
        }).join('');
        const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
        return `<row r="${r + 1}"${ht}>${cells}</row>`;
      }).join('');
      const cols = sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
      let pane = '';
      if (sh.freeze) {
        const { row = 0, col = 0 } = sh.freeze;
        const tl = colName(col) + (row + 1);
        pane = `<sheetViews><sheetView workbookViewId="0"><pane${col ? ` xSplit="${col}"` : ''}${row ? ` ySplit="${row}"` : ''} topLeftCell="${tl}" activePane="${row && col ? 'bottomRight' : row ? 'bottomLeft' : 'topRight'}" state="frozen"/></sheetView></sheetViews>`;
      }
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rowsXml}</sheetData></worksheet>`;
    });

    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
    const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;

    const files = [
      { name: '[Content_Types].xml', data: enc(types) },
      { name: '_rels/.rels', data: enc(rels) },
      { name: 'xl/workbook.xml', data: enc(workbook) },
      { name: 'xl/_rels/workbook.xml.rels', data: enc(wbRels) },
      { name: 'xl/styles.xml', data: enc(styles) }
    ].concat(sheetXml.map((x, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: enc(x) })));
    return zip(files);
  }

  // ---------- reader ----------
  const DATE_FMT_IDS = new Set([14, 15, 16, 17, 22, 27, 30, 36, 45, 46, 47, 50, 57]);
  function textOf(fragment) {
    // concatenates every <t>…</t> inside a fragment
    let out = '';
    const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>|<t(?:\s[^>]*)?\/>/g;
    let m;
    while ((m = re.exec(fragment))) out += m[1] ? xmlUnesc(m[1]) : '';
    return out;
  }
  async function read(buf) {
    const files = await unzip(buf);
    const get = (n) => (files[n] ? dec(files[n]) : null);
    const wb = get('xl/workbook.xml');
    if (!wb) throw new Error('This file has no workbook inside. Is it an .xlsx file?');
    const rels = get('xl/_rels/workbook.xml.rels') || '';
    const relMap = {};
    rels.replace(/<Relationship\b[^>]*>/g, (tag) => {
      const id = /Id="([^"]+)"/.exec(tag); const t = /Target="([^"]+)"/.exec(tag);
      if (id && t) relMap[id[1]] = t[1].replace(/^\/?xl\//, '').replace(/^\//, '');
      return '';
    });
    const shared = [];
    const ss = get('xl/sharedStrings.xml');
    if (ss) { const re = /<si>([\s\S]*?)<\/si>/g; let m; while ((m = re.exec(ss))) shared.push(textOf(m[1])); }
    // date styles
    const dateXf = [];
    const st = get('xl/styles.xml');
    if (st) {
      const custom = {};
      st.replace(/<numFmt\b[^>]*>/g, (tag) => {
        const id = /numFmtId="(\d+)"/.exec(tag); const code = /formatCode="([^"]*)"/.exec(tag);
        if (id && code) custom[+id[1]] = xmlUnesc(code[1]);
        return '';
      });
      const xfBlock = /<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/.exec(st);
      if (xfBlock) {
        const re = /<xf\b[^>]*?(?:\/>|>[\s\S]*?<\/xf>)/g; let m;
        while ((m = re.exec(xfBlock[1]))) {
          const id = +((/numFmtId="(\d+)"/.exec(m[0]) || [0, 0])[1]);
          const code = custom[id] || '';
          dateXf.push(DATE_FMT_IDS.has(id) || (/[dy]/i.test(code.replace(/"[^"]*"/g, '')) && !/^\[?h/i.test(code)));
        }
      }
    }
    const sheets = [];
    const sre = /<sheet\b[^>]*>/g; let sm;
    while ((sm = sre.exec(wb))) {
      const name = xmlUnesc((/name="([^"]*)"/.exec(sm[0]) || [0, ''])[1]);
      const rid = (/r:id="([^"]+)"/.exec(sm[0]) || [0, ''])[1];
      const path = 'xl/' + (relMap[rid] || '');
      const xml = get(path);
      if (!xml) continue;
      const rows = [];
      const rre = /<row\b([^>]*)>([\s\S]*?)<\/row>|<row\b([^>]*)\/>/g; let rm;
      while ((rm = rre.exec(xml))) {
        const rAttr = /\br="(\d+)"/.exec(rm[1] || rm[3] || '');
        const rIdx = rAttr ? +rAttr[1] - 1 : rows.length;
        const row = [];
        const cre = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
        let auto = 0;
        while ((cm = cre.exec(rm[2] || ''))) {
          const attrs = cm[1];
          const ref = /\br="([A-Z]+\d+)"/.exec(attrs);
          const c = ref ? colIndex(ref[1]) : auto;
          auto = c + 1;

    { id: 'res-GUH', group: 'res', short: 'GUH', label: 'Resident at GUH', codes: ['GUH'], days: ALL_WEEKDAYS, min: 'minResGUH' },
    { id: 'res-RGH', group: 'res', short: 'RGH', label: 'Resident at RGH', codes: RGH_CODES, days: ALL_WEEKDAYS, min: 'minResRGH' },
    { id: 'res-NHH', group: 'res', short: 'NHH', label: 'Resident at NHH', codes: NHH_CODES, days: TUE_FRI, min: 'minResNHH' },

  // ---------- state helpers ----------
  const isBankHoliday = (state, iso) => ((state.settings && state.settings.bankHolidays) || BANK_HOLIDAYS).includes(iso);
  const isWorkday = (state, iso) => !isWeekend(iso) && !isBankHoliday(state, iso);
  const inPost = (doc, iso) => (!doc.start || iso >= doc.start) && (!doc.end || iso <= doc.end);
  const doctorById = (state, id) => state.doctors.find((d) => d.id === id);
  const covers = (req, iso) => iso >= req.start && iso <= req.end && !(req.excludedDates || []).includes(iso);
  const groupLabel = (g) => (g === 'mg' ? 'Senior doctor' : 'Resident');

  function planCode(doc, iso) {
    if (!doc.plan) return '';

  const edtOn = (state, doctorId, iso) => (state.edt || []).find((e) => e.doctorId === doctorId && e.date === iso) || null;

  // Works out what one doctor is doing on one date, including who counts as cover each session.
  function resolveCell(state, doc, iso) {

    const reqs = state.requests.filter((r) => r.doctorId === doc.id && covers(r, iso) &&

    const cell = resolveCell(state, doc, iso);

    if (cell.kind === 'sick') return { ok: false, why: 'unavailable' };
    if (cell.kind === 'oncall') return { ok: false, why: `on call (${cell.code.toLowerCase()})` };
    if (cell.kind === 'half') return { ok: false, why: 'on leave for half the day' };
    if (cell.pending && cell.pending.id !== ignoreRequestId && cell.pending.part === 'FULL') return { ok: false, why: 'has asked for leave that day' };

  }

  // Which named cover applies on a date: day-unit cover where the requester is at RGH/NHH, GUH cover at GUH.
  function coverRoleFor(state, doc, iso) {
    const cell = resolveCell(state, doc, iso);
    const site = siteOf(coverCode(cell));
    if (site === 'GUH') return { role: 'guh', code: coverCode(cell), cell };
    if (site === 'RGH' || site === 'NHH') return { role: 'dayunit', code: coverCode(cell), cell };
    return { role: null, code: '', cell };
  }

  // The staffing check for a leave request (shown to the requester and flagged to authorisers).
  // input: {doctorId, start, end, part, dayUnitCoverId, guhCoverId, requestId}

    const doc = doctorById(state, input.doctorId);

    if (!doc || !isIso(input.start) || !isIso(input.end) || input.end < input.start) return out;

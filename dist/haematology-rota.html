<title>Haematology Rota</title>
<meta name="description" content="Prototype rota for the haematology department: roster, day-by-site view, leave requests and authorisation, imports and Excel export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one working surface. Dark header with navigation and the person switcher, then a full-width tool area.
   Site colours follow the department's Excel: GUH red, RGH blue, NHH green, leave yellow. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef2f6; --line: #dbe2ea; --line-strong: #c3ccd7;
  --fg: #15202b; --muted: #4a5868; --faint: #6b7787;
  --accent: #1f4fa8; --accent-fg: #ffffff; --accent-soft: #e6eefb;
  --head-bg: #15202b; --head-fg: #ffffff; --head-muted: #b8c4d2; --head-chip: #2b3a4d;
  --ok-bg: #e7f4ea; --ok-fg: #1d5a2a; --ok-line: #bcdcc4;
  --warn-bg: #fff1dc; --warn-fg: #6e3700; --warn-line: #f0c896;
  --bad-bg: #a3261b; --bad-fg: #ffffff; --bad-soft: #fbe3e0; --bad-text: #a3261b;
  --na-bg: #f1f3f6; --na-fg: #6b7787;
  --guh-bg: #f6b4ae; --guh-fg: #5e0f09; --rgh-bg: #a3cdf3; --rgh-fg: #08345e; --nhh-bg: #b7dd9a; --nhh-fg: #1f430d;
  --lab-bg: #f7d7d4; --lab-fg: #5e0f09;
  --leave-bg: #ffe36e; --leave-fg: #443300; --sick-bg: #f4c7c3; --sick-fg: #6b130b;
  --call-bg: #e4dcf4; --call-fg: #36245e; --off-bg: #ffffff; --off-fg: #5f6b7a;
  --gone-a: #3a4452; --gone-b: #5f6b7a; --weekend: #2b3440; --weekend-fg: #d5dee8;
  --no-al: #a3261b; --avoid: #5b3a8c;
  --shadow: 0 8px 28px rgba(21, 32, 43, 0.18);
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --surface-2: #1e2935; --line: #2c3946; --line-strong: #3b4a5a;
    --fg: #e8edf2; --muted: #a9b6c4; --faint: #8b98a7;
    --accent: #7ea8f0; --accent-fg: #0b1626; --accent-soft: #1d2d47;
    --head-bg: #0a0f14; --head-fg: #ffffff; --head-muted: #9fb0c2; --head-chip: #223041;
    --ok-bg: #173323; --ok-fg: #a8dfb5; --ok-line: #2b5a3a;
    --warn-bg: #3a2810; --warn-fg: #ffd39c; --warn-line: #6b4a1c;
    --bad-bg: #d9483a; --bad-fg: #ffffff; --bad-soft: #3d1a17; --bad-text: #ff9b8f;
    --na-bg: #1e2935; --na-fg: #8b98a7;
    --guh-bg: #e79c95; --guh-fg: #3d0703; --rgh-bg: #8dbde8; --rgh-fg: #04213d; --nhh-bg: #a3cf85; --nhh-fg: #142c07;
    --lab-bg: #d9b3af; --lab-fg: #3d0703;
    --leave-bg: #e8cc55; --leave-fg: #2b2000; --sick-bg: #dca7a2; --sick-fg: #3d0703;
    --call-bg: #c9bce6; --call-fg: #22173d; --off-bg: #222d39; --off-fg: #b9c4d0;
    --gone-a: #2b333d; --gone-b: #46515e; --weekend: #0b1016; --weekend-fg: #9fb0c2;
    --no-al: #d9483a; --avoid: #9a76d4;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --surface-2: #1e2935; --line: #2c3946; --line-strong: #3b4a5a;
  --fg: #e8edf2; --muted: #a9b6c4; --faint: #8b98a7;
  --accent: #7ea8f0; --accent-fg: #0b1626; --accent-soft: #1d2d47;
  --head-bg: #0a0f14; --head-fg: #ffffff; --head-muted: #9fb0c2; --head-chip: #223041;
  --ok-bg: #173323; --ok-fg: #a8dfb5; --ok-line: #2b5a3a;
  --warn-bg: #3a2810; --warn-fg: #ffd39c; --warn-line: #6b4a1c;
  --bad-bg: #d9483a; --bad-fg: #ffffff; --bad-soft: #3d1a17; --bad-text: #ff9b8f;
  --na-bg: #1e2935; --na-fg: #8b98a7;
  --guh-bg: #e79c95; --guh-fg: #3d0703; --rgh-bg: #8dbde8; --rgh-fg: #04213d; --nhh-bg: #a3cf85; --nhh-fg: #142c07;
  --lab-bg: #d9b3af; --lab-fg: #3d0703;
  --leave-bg: #e8cc55; --leave-fg: #2b2000; --sick-bg: #dca7a2; --sick-fg: #3d0703;
  --call-bg: #c9bce6; --call-fg: #22173d; --off-bg: #222d39; --off-fg: #b9c4d0;
  --gone-a: #2b333d; --gone-b: #46515e; --weekend: #0b1016; --weekend-fg: #9fb0c2;
  --no-al: #d9483a; --avoid: #9a76d4;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.app-head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand strong { display: block; font-size: 1rem; }
.brand span { display: block; font-size: 0.75rem; color: var(--head-muted); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; }
.nav button { background: transparent; border: 0; color: var(--head-muted); padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; min-height: 40px; }
.nav button:hover { color: var(--head-fg); background: var(--head-chip); }
.nav button[aria-current="page"] { background: var(--head-chip); color: var(--head-fg); font-weight: 600; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: #e8833a; color: #15202b; font-size: 0.75rem; font-weight: 700; text-align: center; }
.who { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--head-muted); }
.who select { background: var(--head-chip); color: var(--head-fg); border: 1px solid #3b4a5d; border-radius: 6px; padding: 6px 8px; min-height: 38px; max-width: 220px; }
.proto-bar { background: var(--warn-bg); color: var(--warn-fg); border-bottom: 1px solid var(--warn-line); padding: 6px 16px; font-size: 0.8rem; }

main { padding-inline: 16px; padding-block: 18px 60px; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head p { margin-top: 4px; max-width: 75ch; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-weight: 500; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.good { background: var(--ok-fg); color: var(--surface); border-color: var(--ok-fg); font-weight: 600; }
.btn.danger { color: var(--bad-text); border-color: var(--bad-text); background: var(--surface); }
.btn.danger.solid { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.icon { width: 40px; padding: 0; font-size: 1.1rem; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
input[type="text"], input[type="date"], input[type="search"], input[type="number"], input[type="email"], select, textarea {
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; min-height: 40px; background: var(--surface); color: var(--fg); }
textarea { padding: 8px 10px; resize: vertical; }
input[type="number"] { width: 80px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > .main { flex: 999 1 560px; min-width: 0; }
.split > .side { flex: 1 1 320px; min-width: 0; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.notice.ok { background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-line); }
.notice.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.notice.bad { background: var(--bad-soft); color: var(--bad-text); border: 1px solid var(--bad-text); }
.notice.info { background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.pill.pending { background: var(--warn-bg); color: var(--warn-fg); }
.pill.authorised { background: var(--ok-bg); color: var(--ok-fg); }
.pill.declined { background: var(--bad-soft); color: var(--bad-text); }
.pill.cancelled { background: var(--na-bg); color: var(--na-fg); }

/* roster */
.table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 72vh; }
table.roster { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 0.78rem; }
.roster th, .roster td { padding: 3px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.roster thead th { position: sticky; top: 0; background: var(--surface); z-index: 3; font-weight: 600; padding: 8px 4px; border-bottom: 2px solid var(--line-strong); }
.roster thead tr.groups th { top: 0; z-index: 4; font-size: 0.72rem; color: var(--muted); background: var(--surface-2); border-bottom: 0; padding: 5px; }
.roster thead tr.names th { top: 27px; }
.roster .col-date { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 4px 8px; min-width: 96px; }
.roster thead .col-date { z-index: 5; }
.roster th.doc { min-width: 92px; max-width: 120px; }
.roster th.doc .grade { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 600; }
.roster th.doc .dates { display: block; font-size: 0.66rem; color: var(--faint); font-weight: 400; }
.roster .gap-col { width: 8px; padding: 0; background: var(--surface-2); }
.roster tr.weekend td, .roster tr.weekend .col-date { background: var(--weekend); color: var(--weekend-fg); }
.roster tr.today .col-date { box-shadow: inset 4px 0 0 var(--accent); }
.roster .cons { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 34px; padding: 2px 4px; border-radius: 5px; font-weight: 600; line-height: 1.1; font-size: 0.72rem; border: 1px solid transparent; width: 100%; }
button.cell { cursor: pointer; font-family: inherit; }
button.cell:hover { outline: 2px solid var(--accent); outline-offset: 0; }
.k-site.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.k-site.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.k-site.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.k-lab { background: var(--lab-bg); color: var(--lab-fg); }
.k-leave { background: var(--leave-bg); color: var(--leave-fg); }
.k-sick { background: var(--sick-bg); color: var(--sick-fg); }
.k-oncall { background: var(--call-bg); color: var(--call-fg); }
.k-off { background: var(--off-bg); color: var(--off-fg); border-color: var(--line); }
.k-bh { background: var(--na-bg); color: var(--na-fg); }
.k-other { background: var(--surface-2); color: var(--fg); border-color: var(--line-strong); }
.k-none { background: transparent; color: var(--faint); }
.k-gone { background: repeating-linear-gradient(45deg, var(--gone-a) 0 6px, var(--gone-b) 6px 12px); color: #ffffff; }
.k-half { color: var(--fg); }
.k-half.s-GUH { background: linear-gradient(90deg, var(--guh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-RGH { background: linear-gradient(90deg, var(--rgh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-NHH { background: linear-gradient(90deg, var(--nhh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-none { background: var(--leave-bg); color: var(--leave-fg); }
.cell.pending { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255, 227, 110, 0.85) 6px 12px); border: 1px dashed var(--warn-fg); }
.cell .mark { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--surface); }
.cell .mark.override { background: var(--accent); }
.cell .mark.conflict { background: var(--bad-bg); }
.dim .cell { opacity: 0.18; }
.cover-cell { white-space: nowrap; }
.cv { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 3px 5px; border-radius: 4px; margin: 1px; border: 1px solid transparent; }
.cv.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
.cv.gap { background: var(--bad-bg); color: var(--bad-fg); }
.cv.exception { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.cv.risk { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 5px, var(--surface) 5px 10px); color: var(--bad-text); border: 1px dashed var(--bad-text); }
.cv.na { background: var(--na-bg); color: var(--na-fg); }
.restr { display: inline-block; font-size: 0.62rem; font-weight: 700; color: #ffffff; padding: 1px 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
.restr.NO-AL { background: var(--no-al); }
.restr.AVOID { background: var(--avoid); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--muted); align-items: center; }
.legend .sw { display: inline-block; width: 18px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

/* day view */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daybtn { flex: none; min-width: 64px; min-height: 60px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
.daybtn[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.daybtn .d { font-size: 0.72rem; color: var(--muted); }
.daybtn .n { font-size: 1rem; font-weight: 700; }
.daybtn .f { font-size: 0.72rem; font-weight: 700; }
.f.ok { color: var(--ok-fg); } .f.exception, .f.risk { color: var(--warn-fg); } .f.gap { color: var(--bad-text); }
.site-card { padding: 0; overflow: hidden; gap: 0; }
.site-card .site-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.site-head.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.site-head.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.site-head.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.site-card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.person { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.gbadge { flex: none; min-width: 46px; text-align: center; font-size: 0.7rem; font-weight: 700; padding: 4px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.gbadge.mg { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* lists */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; color: var(--fg); }
.list-item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.plain th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line-strong); }
.plain td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.scroll-x { overflow-x: auto; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border: 2px solid var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 3px; }
.drop { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; counter-reset: step; }
.steps li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.steps li::before { counter-increment: step; content: counter(step); width: 28px; height: 28px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-mono); }
.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 10px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

/* editor sheet and toasts */
.sheet { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; z-index: 40; display: flex; flex-direction: column; gap: 10px; }
.toasts { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100% - 32px); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 0.9rem; }
.toast.error { background: var(--bad-bg); color: var(--bad-fg); }

<script>
/* Minimal .xlsx reader and writer with no dependencies.
 * Writer: stored (uncompressed) zip, shared styles (fills, fonts, borders, date format).
 * Reader: handles deflate via DecompressionStream, shared and inline strings, date-formatted cells.
 * Works in browsers and in Node 18+ (for tests and build scripts). */
(function (root) {
  'use strict';

  // ---------- zip ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const enc = (s) => new TextEncoder().encode(s);
  const dec = (b) => new TextDecoder('utf-8').decode(b);

  function zip(files) {
    // files: [{name, data: Uint8Array}] -> Uint8Array (method 0, stored)
    const parts = [];
    const central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc(f.name);
      const crc = crc32(f.data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); // UTF-8 names
      local.setUint16(8, 0, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, f.data.length, true);
      local.setUint32(22, f.data.length, true);
      local.setUint16(26, name.length, true);
      parts.push(new Uint8Array(local.buffer), name, f.data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, f.data.length, true);
      cd.setUint32(24, f.data.length, true);
      cd.setUint16(28, name.length, true);
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), name);
      offset += 30 + name.length + f.data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
    let p = 0;
    for (const a of all) { out.set(a, p); p += a.length; }
    return out;
  }

  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('This file is not a valid .xlsx (zip) file.');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Damaged .xlsx file (central directory).');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lofs = dv.getUint32(p + 42, true);
      const name = dec(bytes.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(lofs + 26, true);
      const lelen = dv.getUint16(lofs + 28, true);
      const start = lofs + 30 + lnlen + lelen;
      const raw = bytes.subarray(start, start + csize);
      if (method === 0) out[name] = raw;
      else if (method === 8) out[name] = await inflateRaw(raw);
      else throw new Error('Unsupported compression in .xlsx file.');
      p += 46 + nlen + elen + clen;
    }
    return out;
  }

  // ---------- helpers ----------
  const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const xmlUnesc = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');
  function colName(i) { // 0 -> A
    let s = '';
    i += 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function colIndex(ref) {
    const m = /^([A-Z]+)/.exec(ref);
    let n = 0;
    for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
  function isoToSerial(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return (Date.UTC(y, m - 1, d) - EXCEL_EPOCH) / 86400000;
  }
  function serialToIso(n) {
    const d = new Date(EXCEL_EPOCH + Math.round(n) * 86400000);
    return d.toISOString().slice(0, 10);
  }

  // ---------- writer ----------
  // sheet: {name, rows: [[cell]], widths: [n], freeze: {row, col}, heights: {rowIndex: pt}}
  // cell: null | string | number | {v, date: true, style: {...}}
  // style: {fill: 'RRGGBB', bold, color: 'RRGGBB', size, center, wrap, border}
  function write(sheets) {
    const styleKeys = new Map(); // json -> index
    const fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
    const fonts = ['<font><sz val="10"/><name val="Calibri"/></font>'];
    const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>',
      '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>'];
    const xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    const fillIdx = new Map(); const fontIdx = new Map();
    function styleIndex(style, isDate) {
      if (!style && !isDate) return 0;
      const s = style || {};
      const key = JSON.stringify([s, !!isDate]);
      if (styleKeys.has(key)) return styleKeys.get(key);
      let fillId = 0;
      if (s.fill) {
        if (!fillIdx.has(s.fill)) { fillIdx.set(s.fill, fills.length); fills.push(`<fill><patternFill patternType="solid"><fgColor rgb="FF${s.fill}"/><bgColor indexed="64"/></patternFill></fill>`); }
        fillId = fillIdx.get(s.fill);
      }
      let fontId = 0;
      if (s.bold || s.color || s.size) {
        const fk = [s.bold, s.color, s.size].join('|');
        if (!fontIdx.has(fk)) {
          fontIdx.set(fk, fonts.length);
          fonts.push(`<font>${s.bold ? '<b/>' : ''}<sz val="${s.size || 10}"/>${s.color ? `<color rgb="FF${s.color}"/>` : ''}<name val="Calibri"/></font>`);
        }
        fontId = fontIdx.get(fk);
      }
      const borderId = s.border ? 1 : 0;
      const align = s.center || s.wrap ? `<alignment${s.center ? ' horizontal="center" vertical="center"' : ''}${s.wrap ? ' wrapText="1"' : ''}/>` : '';
      const numFmt = isDate ? 164 : 0;
      xfs.push(`<xf numFmtId="${numFmt}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0"${fillId ? ' applyFill="1"' : ''}${fontId ? ' applyFont="1"' : ''}${borderId ? ' applyBorder="1"' : ''}${isDate ? ' applyNumberFormat="1"' : ''}${align ? ' applyAlignment="1">' + align + '</xf>' : '/>'}`);
      styleKeys.set(key, xfs.length - 1);
      return xfs.length - 1;
    }

    const sheetXml = sheets.map((sh) => {
      const rowsXml = sh.rows.map((row, r) => {
        const cells = (row || []).map((cell, c) => {
          if (cell === null || cell === undefined || cell === '') return '';
          const obj = typeof cell === 'object' ? cell : { v: cell };
          const ref = colName(c) + (r + 1);
          const s = styleIndex(obj.style, obj.date);
          const sAttr = s ? ` s="${s}"` : '';
          if (obj.v === null || obj.v === undefined || obj.v === '') return `<c r="${ref}"${sAttr}/>`;
          if (obj.date) return `<c r="${ref}"${sAttr}><v>${isoToSerial(obj.v)}</v></c>`;
          if (typeof obj.v === 'number') return `<c r="${ref}"${sAttr}><v>${obj.v}</v></c>`;
          return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(obj.v)}</t></is></c>`;
        }).join('');
        const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
        return `<row r="${r + 1}"${ht}>${cells}</row>`;
      }).join('');
      const cols = sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
      let pane = '';
      if (sh.freeze) {
        const { row = 0, col = 0 } = sh.freeze;
        const tl = colName(col) + (row + 1);
        pane = `<sheetViews><sheetView workbookViewId="0"><pane${col ? ` xSplit="${col}"` : ''}${row ? ` ySplit="${row}"` : ''} topLeftCell="${tl}" activePane="${row && col ? 'bottomRight' : row ? 'bottomLeft' : 'topRight'}" state="frozen"/></sheetView></sheetViews>`;
      }
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rowsXml}</sheetData></worksheet>`;
    });

    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
    const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;

    const files = [
      { name: '[Content_Types].xml', data: enc(types) },
      { name: '_rels/.rels', data: enc(rels) },
      { name: 'xl/workbook.xml', data: enc(workbook) },
      { name: 'xl/_rels/workbook.xml.rels', data: enc(wbRels) },
      { name: 'xl/styles.xml', data: enc(styles) }
    ].concat(sheetXml.map((x, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: enc(x) })));
    return zip(files);
  }

  // ---------- reader ----------
  const DATE_FMT_IDS = new Set([14, 15, 16, 17, 22, 27, 30, 36, 45, 46, 47, 50, 57]);
  function textOf(fragment) {
    // concatenates every <t>…</t> inside a fragment
    let out = '';
    const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>|<t(?:\s[^>]*)?\/>/g;
    let m;
    while ((m = re.exec(fragment))) out += m[1] ? xmlUnesc(m[1]) : '';
    return out;
  }
  async function read(buf) {
    const files = await unzip(buf);
    const get = (n) => (files[n] ? dec(files[n]) : null);
    const wb = get('xl/workbook.xml');
    if (!wb) throw new Error('This file has no workbook inside. Is it an .xlsx file?');
    const rels = get('xl/_rels/workbook.xml.rels') || '';
    const relMap = {};
    rels.replace(/<Relationship\b[^>]*>/g, (tag) => {
      const id = /Id="([^"]+)"/.exec(tag); const t = /Target="([^"]+)"/.exec(tag);
      if (id && t) relMap[id[1]] = t[1].replace(/^\/?xl\//, '').replace(/^\//, '');
      return '';
    });
    const shared = [];
    const ss = get('xl/sharedStrings.xml');
    if (ss) { const re = /<si>([\s\S]*?)<\/si>/g; let m; while ((m = re.exec(ss))) shared.push(textOf(m[1])); }
    // date styles
    const dateXf = [];
    const st = get('xl/styles.xml');
    if (st) {
      const custom = {};
      st.replace(/<numFmt\b[^>]*>/g, (tag) => {
        const id = /numFmtId="(\d+)"/.exec(tag); const code = /formatCode="([^"]*)"/.exec(tag);
        if (id && code) custom[+id[1]] = xmlUnesc(code[1]);
        return '';
      });
      const xfBlock = /<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/.exec(st);
      if (xfBlock) {
        const re = /<xf\b[^>]*?(?:\/>|>[\s\S]*?<\/xf>)/g; let m;
        while ((m = re.exec(xfBlock[1]))) {
          const id = +((/numFmtId="(\d+)"/.exec(m[0]) || [0, 0])[1]);
          const code = custom[id] || '';
          dateXf.push(DATE_FMT_IDS.has(id) || (/[dy]/i.test(code.replace(/"[^"]*"/g, '')) && !/^\[?h/i.test(code)));
        }
      }
    }
    const sheets = [];
    const sre = /<sheet\b[^>]*>/g; let sm;
    while ((sm = sre.exec(wb))) {
      const name = xmlUnesc((/name="([^"]*)"/.exec(sm[0]) || [0, ''])[1]);
      const rid = (/r:id="([^"]+)"/.exec(sm[0]) || [0, ''])[1];
      const path = 'xl/' + (relMap[rid] || '');
      const xml = get(path);
      if (!xml) continue;
      const rows = [];
      const rre = /<row\b([^>]*)>([\s\S]*?)<\/row>|<row\b([^>]*)\/>/g; let rm;
      while ((rm = rre.exec(xml))) {
        const rAttr = /\br="(\d+)"/.exec(rm[1] || rm[3] || '');
        const rIdx = rAttr ? +rAttr[1] - 1 : rows.length;
        const row = [];
        const cre = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
        let auto = 0;
        while ((cm = cre.exec(rm[2] || ''))) {
          const attrs = cm[1];
          const ref = /\br="([A-Z]+\d+)"/.exec(attrs);
          const c = ref ? colIndex(ref[1]) : auto;
          auto = c + 1;
          const t = (/\bt="(\w+)"/.exec(attrs) || [0, 'n'])[1];
          const s = +((/\bs="(\d+)"/.exec(attrs) || [0, 0])[1]);
          const body = cm[2] || '';
          const v = /<v>([\s\S]*?)<\/v>/.exec(body);
          let val = null;
          if (t === 's' && v) val = shared[+v[1]] ?? '';
          else if (t === 'inlineStr') val = textOf(body);
          else if (t === 'str' && v) val = xmlUnesc(v[1]);
          else if (t === 'b' && v) val = v[1] === '1';
          else if (v) {
            const n = Number(v[1]);
            val = dateXf[s] && isFinite(n) ? { date: serialToIso(n) } : n;
          }
          row[c] = val;
        }
        rows[rIdx] = row;
      }
      for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
      sheets.push({ name, rows });
    }
    return sheets;
  }

  const api = { write, read, zip, unzip, crc32, isoToSerial, serialToIso, colName };
  root.RotaXlsx = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Haematology rota rules: dates, codes, how a roster cell is worked out, cover checks,
 * leave day counts, balances and cover suggestions. Pure functions over the app state,
 * so they run in the browser and in Node tests. */
(function (root) {
  'use strict';

  // ---------- dates (ISO yyyy-mm-dd, UTC) ----------
  const toDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const toIso = (dt) => dt.toISOString().slice(0, 10);
  const addDays = (iso, n) => { const d = toDate(iso); d.setUTCDate(d.getUTCDate() + n); return toIso(d); };
  const dow = (iso) => (toDate(iso).getUTCDay() + 6) % 7; // 0 = Monday … 6 = Sunday
  const isWeekend = (iso) => dow(iso) >= 5;
  const mondayOf = (iso) => addDays(iso, -dow(iso));
  const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
  function dateRange(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }
  const DOW_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const DOW_LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtShort = (iso) => { const d = toDate(iso); return `${DOW_SHORT[dow(iso)]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
  const fmtLong = (iso) => { const d = toDate(iso); return `${DOW_LONG[dow(iso)]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
  const fmtUk = (iso) => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

  // England & Wales bank holidays (editable in Settings)
  const BANK_HOLIDAYS = [
    '2026-01-01', '2026-04-03', '2026-04-06', '2026-05-04', '2026-05-25', '2026-08-31', '2026-12-25', '2026-12-28',
    '2027-01-01', '2027-03-26', '2027-03-29', '2027-05-03', '2027-05-31', '2027-08-30', '2027-12-27', '2027-12-28'
  ];

  // ---------- codes ----------
  const SITE_CODES = ['GUH', 'GUH LAB', 'RGH', 'RGH - DAY UNIT', 'RGH MDCU', 'NHH', 'NHH - DAY UNIT', 'OFF', 'TEACHING', 'SpR TRAINING DAY'];
  const ONCALL_CODES = ['LONG DAY', 'NIGHTS', 'TWILIGHT', 'EARLY TWILIGHT', 'WARD COVER', 'W/E SD', 'FLEXIBLE W/C', 'OFF PRE ON-CALL', 'POST NIGHTS'];
  const LEAVE_TYPES = {
    AL: { label: 'Annual leave', code: 'ANNUAL LEAVE', balance: 'al' },
    SL: { label: 'Study leave', code: 'STUDY LEAVE', balance: 'sl' },
    PL: { label: 'Professional / exam leave', code: 'PROFESSIONAL LEAVE' },
    TEACH: { label: 'Teaching (not from study leave)', code: 'TEACHING' },
    COMP: { label: 'Compassionate leave', code: 'COMPASSIONATE LEAVE' },
    TOIL: { label: 'Day off in lieu', code: 'DAY OFF IN LIEU' },
    OTHER: { label: 'Other leave', code: 'OTHER LEAVE' },
    SICK: { label: 'Sickness', code: 'SICK' }
  };
  const LEAVE_CODES = Object.values(LEAVE_TYPES).map((t) => t.code);
  const RGH_CODES = ['RGH', 'RGH - DAY UNIT', 'RGH MDCU'];
  const NHH_CODES = ['NHH', 'NHH - DAY UNIT'];

  const norm = (code) => String(code || '').trim().replace(/\s+/g, ' ').toUpperCase();
  function siteOf(code) {
    const c = norm(code);
    if (c === 'GUH') return 'GUH';
    if (RGH_CODES.includes(c)) return 'RGH';
    if (NHH_CODES.includes(c)) return 'NHH';
    return null;
  }
  function kindOf(code) {
    const c = norm(code);
    if (!c) return 'none';
    if (c === 'NOT IN POST') return 'gone';
    if (c === 'BANK HOLIDAY') return 'bh';
    if (c === 'SICK') return 'sick';
    if (siteOf(c)) return 'site';
    if (c.includes('LAB')) return 'lab';
    if (c === 'OFF') return 'off';
    if (ONCALL_CODES.includes(c)) return 'oncall';
    if (LEAVE_CODES.includes(c) || c === 'SPR TRAINING DAY') return 'leave';
    return 'other';
  }
  // Canonical spelling for codes typed in imports ("rgh-day unit" -> "RGH - DAY UNIT")
  function canonicalCode(raw) {
    let c = norm(raw).replace(/^(RGH|NHH|GUH)\s*-\s*/, '$1 - ').replace(/\s+-\s*|\s*-\s+/g, ' - ');
    const aliases = {
      'RGH DAY UNIT': 'RGH - DAY UNIT', 'RGH DU': 'RGH - DAY UNIT', 'NHH DAY UNIT': 'NHH - DAY UNIT', 'NHH DU': 'NHH - DAY UNIT',
      'RGH - MDCU': 'RGH MDCU', 'GUH - LAB': 'GUH LAB', 'NIGHT': 'NIGHTS', 'LD': 'LONG DAY', 'N': 'NIGHTS',
      'W/E SD': 'W/E SD', 'WE SD': 'W/E SD', 'OFF PRE-ON-CALL': 'OFF PRE ON-CALL', 'OFF PRE ON CALL': 'OFF PRE ON-CALL', 'OFF - PRE ON-CALL': 'OFF PRE ON-CALL',
      'POST NIGHT': 'POST NIGHTS', 'POST-NIGHTS': 'POST NIGHTS', 'SPR TRAINING': 'SpR TRAINING DAY', 'SPR TRAINING DAY': 'SpR TRAINING DAY',
      'AL': 'ANNUAL LEAVE', 'SL': 'STUDY LEAVE', 'SICK LEAVE': 'SICK'
    };
    if (aliases[c]) c = aliases[c];
    return c === 'SPR TRAINING DAY' ? 'SpR TRAINING DAY' : c;
  }

  // ---------- cover rules ----------
  const ALL_WEEKDAYS = [0, 1, 2, 3, 4];
  const TUE_FRI = [1, 2, 3, 4];
  const COVER_RULES = [
    { id: 'res-GUH', group: 'res', short: 'GUH', label: 'Resident at GUH', codes: ['GUH'], days: ALL_WEEKDAYS },
    { id: 'res-RGH', group: 'res', short: 'RGH', label: 'Resident at RGH', codes: RGH_CODES, days: ALL_WEEKDAYS },
    { id: 'res-NHH', group: 'res', short: 'NHH', label: 'Resident at NHH', codes: NHH_CODES, days: TUE_FRI },
    { id: 'mg-GUH', group: 'mg', short: 'GUH', label: 'Middle grade on GUH ward', codes: ['GUH'], days: ALL_WEEKDAYS },
    { id: 'mg-RGH', group: 'mg', short: 'RGH DU', label: 'RGH day unit', codes: RGH_CODES, days: ALL_WEEKDAYS, fallbackGroup: 'res' },
    { id: 'mg-NHH', group: 'mg', short: 'NHH DU', label: 'NHH day unit', codes: NHH_CODES, days: TUE_FRI, fallbackGroup: 'res' }
  ];
  const STATUS_RANK = { na: 0, ok: 0, risk: 1, exception: 2, gap: 3 };

  // ---------- state helpers ----------
  const isBankHoliday = (state, iso) => (state.settings.bankHolidays || BANK_HOLIDAYS).includes(iso);
  const inPost = (doc, iso) => (!doc.start || iso >= doc.start) && (!doc.end || iso <= doc.end);
  const doctorById = (state, id) => state.doctors.find((d) => d.id === id);
  const covers = (req, iso) => iso >= req.start && iso <= req.end;

  function planCode(doc, iso) {
    if (!doc.plan) return '';
    const i = dow(iso);
    if (i > 4) return '';
    let week = doc.plan.A || [];
    if (doc.plan.B && doc.plan.B.some(Boolean)) {
      const anchor = mondayOf(doc.plan.anchor || doc.start || iso);
      const n = Math.floor(daysBetween(anchor, mondayOf(iso)) / 7);
      if (Math.abs(n) % 2 === 1) week = doc.plan.B;
    }
    return week[i] || '';
  }

  function leaveLabelFor(req) { return (LEAVE_TYPES[req.type] || LEAVE_TYPES.OTHER).code; }

  // Works out what one doctor is doing on one date.
  function resolveCell(state, doc, iso) {
    if (!inPost(doc, iso)) return { code: 'NOT IN POST', kind: 'gone', source: 'gone' };
    const reqs = state.requests.filter((r) => r.doctorId === doc.id && covers(r, iso) && !(r.type !== 'SICK' && (isWeekend(iso) || isBankHoliday(state, iso)) && !(state.oncall[doc.id] || {})[iso]));
    const authorised = reqs.find((r) => r.status === 'authorised');
    const pending = reqs.find((r) => r.status === 'pending') || null;
    const oncall = (state.oncall[doc.id] || {})[iso];
    const override = (state.overrides[doc.id] || {})[iso];

    let base;
    if (override) base = { code: override.code, kind: kindOf(override.code), source: 'override', note: override.reason || '' };
    else if (oncall) base = { code: oncall, kind: kindOf(oncall) === 'other' ? 'oncall' : kindOf(oncall), source: 'oncall', locked: true };
    else if (isWeekend(iso)) base = { code: '', kind: 'none', source: 'weekend' };
    else if (isBankHoliday(state, iso)) base = { code: 'BANK HOLIDAY', kind: 'bh', source: 'bh' };
    else { const p = planCode(doc, iso); base = { code: p, kind: p ? kindOf(p) : 'none', source: p ? 'plan' : 'none' }; }

    if (authorised) {
      const label = leaveLabelFor(authorised);
      if (authorised.part === 'AM' || authorised.part === 'PM') {
        const text = authorised.part === 'PM' ? `${base.code || 'OFF'} AM; PM ${label}` : `AM ${label}; ${base.code || 'OFF'} PM`;
        return Object.assign({}, base, { code: text, kind: 'half', baseCode: base.code, leave: authorised, pending });
      }
      return {
        code: label, kind: authorised.type === 'SICK' ? 'sick' : 'leave', source: 'leave', leave: authorised,
        conflict: oncall ? `Clashes with imported on-call: ${oncall}` : null
      };
    }
    return Object.assign(base, { pending });
  }

  // Code that counts for cover (half days count as present at their base site)
  const coverCode = (cell) => norm(cell.kind === 'half' ? cell.baseCode : cell.code);

  function coverFor(state, iso, opts) {
    opts = opts || {};
    if (isWeekend(iso) || isBankHoliday(state, iso)) return null;
    const absent = new Set(opts.absent || []);
    const moves = opts.moves || {};
    const present = [];
    for (const doc of state.doctors) {
      if (!inPost(doc, iso) || absent.has(doc.id)) continue;
      const cell = resolveCell(state, doc, iso);
      if (opts.pendingAbsent && cell.pending && cell.pending.part === 'FULL' && cell.kind !== 'leave' && cell.kind !== 'sick') continue;
      const code = moves[doc.id] ? norm(moves[doc.id]) : coverCode(cell);
      present.push({ doc, code });
    }
    const d = dow(iso);
    const rules = COVER_RULES.map((rule) => {
      if (!rule.days.includes(d)) return { rule, status: 'na', names: [] };
      const holders = present.filter((p) => p.doc.group === rule.group && rule.codes.includes(p.code));
      if (holders.length) return { rule, status: 'ok', names: holders.map((h) => h.doc.name) };
      if (rule.fallbackGroup) {
        const fb = present.filter((p) => p.doc.group === rule.fallbackGroup && rule.codes.includes(p.code));
        if (fb.length) return { rule, status: 'exception', names: fb.map((h) => h.doc.name) };
      }
      return { rule, status: 'gap', names: [] };
    });
    return { iso, rules };
  }

  // Cover with "at risk" where a pending request would open a gap if authorised.
  function coverWithRisk(state, iso) {
    const actual = coverFor(state, iso);
    if (!actual) return null;
    const ifPending = coverFor(state, iso, { pendingAbsent: true });
    actual.rules.forEach((r, i) => {
      if (r.status === 'ok' && STATUS_RANK[ifPending.rules[i].status] > STATUS_RANK.ok) r.status = 'risk';
    });
    return actual;
  }

  function worstStatus(cover) {
    if (!cover) return 'na';
    return cover.rules.reduce((w, r) => (STATUS_RANK[r.status] > STATUS_RANK[w] ? r.status : w), 'ok');
  }

  // ---------- leave ----------
  function leaveDays(state, start, end, part) {
    if (!start || !end || end < start) return 0;
    const n = dateRange(start, end).filter((d) => !isWeekend(d) && !isBankHoliday(state, d)).length;
    return (part === 'AM' || part === 'PM') && start === end ? n * 0.5 : n;
  }

  function balance(state, doc) {
    const sum = (type, status) => state.requests.filter((r) => r.doctorId === doc.id && r.type === type && r.status === status)
      .reduce((a, r) => a + (r.days || 0), 0);
    const mk = (type, ent) => {
      const used = sum(type, 'authorised'); const pending = sum(type, 'pending');
      return { entitlement: ent || 0, used, pending, left: (ent || 0) - used };
    };
    return { al: mk('AL', doc.alEntitlement), sl: mk('SL', doc.slEntitlement) };
  }

  const restrictedIn = (state, start, end) => (state.settings.restricted || []).filter((r) => r.start <= end && (r.end || r.start) >= start)
    .sort((a, b) => (a.start < b.start ? -1 : 1));

  // Suggest who could cover each working day of a leave request.
  function suggestCover(state, doctorId, start, end, part) {
    const doc = doctorById(state, doctorId);
    if (!doc || !start || !end || end < start || part === 'AM' || part === 'PM') return [];
    const out = [];
    for (const iso of dateRange(start, end)) {
      if (isWeekend(iso) || isBankHoliday(state, iso) || !inPost(doc, iso)) continue;
      const before = coverFor(state, iso);
      const without = coverFor(state, iso, { absent: [doctorId] });
      const broken = without.rules.filter((r, i) => STATUS_RANK[r.status] > STATUS_RANK[before.rules[i].status]);
      const cell = resolveCell(state, doc, iso);
      if (!broken.length) { out.push({ date: iso, needed: false, from: cell.code, broken: [], options: [] }); continue; }
      const options = [];

        const target = b.rule.codes.includes(coverCode(cell)) ? coverCode(cell) : b.rule.codes[0];
        for (const cand of state.doctors) {
          if (cand.id === doctorId || cand.group !== b.rule.group || !inPost(cand, iso)) continue;
          const cc = resolveCell(state, cand, iso);
          if (cc.pending && cc.pending.part === 'FULL') continue;
          let type;
          if (cc.kind === 'off' || (cc.kind === 'none' && cc.source !== 'weekend')) type = 'dayoff';
          else if ((cc.kind === 'site' || cc.kind === 'lab') && !b.rule.codes.includes(coverCode(cc))) type = 'move';
          else continue;
          const after = coverFor(state, iso, { absent: [doctorId], moves: { [cand.id]: target } });
          const newGaps = after.rules.filter((r, i) => r.status === 'gap' && before.rules[i].status !== 'gap');
          if (newGaps.length) continue;
          const exceptions = after.rules.filter((r, i) => r.status === 'exception' && before.rules[i].status !== 'exception').map((r) => r.rule.label);
          const score = exceptions.length * 10 + (type === 'dayoff' ? 5 : 0);
          const text = type === 'dayoff'
            ? `${cand.name} is off that day and works ${target} instead (swaps their day off)`
            : `${cand.name} moves from ${cc.code} to ${target}`;
          options.push({ doctorId: cand.id, name: cand.name, from: cc.code || 'OFF', to: target, type, exceptions, score, text });
        }
      }
      options.sort((a, b) => a.score - b.score || a.name.localeCompare(b.name));
      out.push({ date: iso, needed: true, from: cell.code, broken: broken.map((r) => r.rule.label), options: options.slice(0, 5) });
    }
    return out;
  }

  const api = {
    toDate, toIso, addDays, dow, isWeekend, mondayOf, daysBetween, dateRange, fmtShort, fmtLong, fmtUk, DOW_SHORT, DOW_LONG,
    BANK_HOLIDAYS, SITE_CODES, ONCALL_CODES, LEAVE_TYPES, LEAVE_CODES, COVER_RULES, STATUS_RANK,
    norm, siteOf, kindOf, canonicalCode, isBankHoliday, inPost, doctorById, planCode, resolveCell, coverFor, coverWithRisk,

  root.RotaRules = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

        requireCoord('edit the roster');
        state.overrides[doctorId] = state.overrides[doctorId] || {};
        const before = R.resolveCell(state, R.doctorById(state, doctorId), iso).code || '(blank)';
        if (code) state.overrides[doctorId][iso] = { code: R.canonicalCode(code), reason: reason || '', by: user().name, at: nowIso() };
        else delete state.overrides[doctorId][iso];
        const after = R.resolveCell(state, R.doctorById(state, doctorId), iso).code || '(blank)';
        log('Roster cell changed', `${docName(doctorId)}, ${R.fmtShort(iso)}: ${before} → ${after}${reason ? ` (${reason})` : ''}`);
        emit();
      },

      submitRequest(req) {
        const u = user();
        if (u.role === 'viewer') throw new Error('Viewers cannot request leave.');
        if (u.role === 'doctor' && req.doctorId !== u.doctorId) throw new Error('You can only request leave for yourself.');
        if (!req.start || !req.end || req.end < req.start) throw new Error('Choose a start date and an end date on or after it.');
        const r = {
          id: uid('lr'), doctorId: req.doctorId, type: req.type, start: req.start, end: req.end, part: req.part || 'FULL',
          note: req.note || '', cover: req.cover || [], submittedAt: nowIso(), submittedBy: u.name,
          days: R.leaveDays(state, req.start, req.end, req.part || 'FULL'), status: 'pending'
        };
        const label = R.LEAVE_TYPES[r.type].label;
        if (r.type === 'SICK') {
          Object.assign(r, { status: 'authorised', decidedBy: 'Self-reported', decidedAt: nowIso() });
          notify('coord', `${docName(r.doctorId)} reported sick: ${R.fmtShort(r.start)}${r.end !== r.start ? ' – ' + R.fmtShort(r.end) : ''}.`);
          log('Sickness reported', `${docName(r.doctorId)}: ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}`);
        } else {
          notify('coord', `New ${label.toLowerCase()} request from ${docName(r.doctorId)}: ${R.fmtShort(r.start)}${r.end !== r.start ? ' – ' + R.fmtShort(r.end) : ''}.`);
          log('Leave requested', `${docName(r.doctorId)}: ${label}, ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)} (${r.days} day${r.days === 1 ? '' : 's'})`);
        }
        state.requests.push(r);
        emit();
        return r;
      },

      setRequestCover(id, date, choice) {
        requireCoord('change the cover for a request');
        const r = state.requests.find((x) => x.id === id);
        if (!r || r.status !== 'pending') throw new Error('This request has already been decided.');
        r.cover = (r.cover || []).filter((c) => c.date !== date);
        if (choice) r.cover.push(Object.assign({ date }, choice));
        log('Cover proposal changed', `${docName(r.doctorId)}'s leave, ${R.fmtShort(date)}: ${choice ? choice.text : 'no cover move'}`);
        emit();
      },

      cancelRequest(id) {
        const r = state.requests.find((x) => x.id === id);
        if (!r) return;
        const u = user();
        if (!(isCoord() || (u.doctorId === r.doctorId && r.status === 'pending'))) throw new Error('You can only withdraw your own pending requests.');
        r.status = 'cancelled';
        log('Leave request withdrawn', `${docName(r.doctorId)}: ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}`);
        emit();
      },

      decideRequest(id, decision, reason) {
        requireCoord('authorise or decline leave');
        const r = state.requests.find((x) => x.id === id);
        if (!r || r.status !== 'pending') throw new Error('This request has already been decided.');
        if (decision === 'declined' && !String(reason || '').trim()) throw new Error('Give a reason for declining. It is sent to the doctor.');
        r.status = decision; r.decidedBy = user().name; r.decidedAt = nowIso(); r.reason = reason || '';
        const label = R.LEAVE_TYPES[r.type].label;
        if (decision === 'authorised') {
          for (const c of r.cover || []) {
            state.overrides[c.doctorId] = state.overrides[c.doctorId] || {};
            state.overrides[c.doctorId][c.date] = { code: c.to, reason: `Covering ${docName(r.doctorId)}'s leave`, by: user().name, at: nowIso() };
            notify('u-' + c.doctorId, `You are covering ${c.to} on ${R.fmtShort(c.date)} for ${docName(r.doctorId)}.`);
          }
        }
        notify('u-' + r.doctorId, `Your ${label.toLowerCase()} (${R.fmtShort(r.start)}${r.end !== r.start ? ' – ' + R.fmtShort(r.end) : ''}) was ${decision} by ${user().name}${reason ? ': ' + reason : '.'}`);
        log(decision === 'authorised' ? 'Leave authorised' : 'Leave declined', `${docName(r.doctorId)}: ${label}, ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}${(r.cover || []).length && decision === 'authorised' ? `; cover: ${r.cover.map((c) => `${docName(c.doctorId)} → ${c.to} (${R.fmtUk(c.date)})`).join(', ')}` : ''}${reason ? `; reason: ${reason}` : ''}`);
        emit();
      },

      saveDoctor(d) {
        requireCoord('change the staff list');
        const existing = R.doctorById(state, d.id);
        if (existing) {
          const changes = Object.keys(d).filter((k) => k !== 'plan' && JSON.stringify(existing[k]) !== JSON.stringify(d[k]));
          Object.assign(existing, d);
          const u = state.users.find((x) => x.doctorId === existing.id);
          if (u) u.name = existing.name;
          if (changes.length) log('Doctor updated', `${existing.name}: ${changes.join(', ')}`);
        } else {
          const doc = Object.assign({ id: uid('d'), aliases: [], plan: { A: ['', '', '', '', ''], B: null } }, d);
          state.doctors.push(doc);
          state.users.push({ id: 'u-' + doc.id, name: doc.name, role: 'doctor', doctorId: doc.id });
          log('Doctor added', `${doc.name} (${doc.grade})`);
        }
        emit();
      },

      removeDoctor(id) {
        requireCoord('change the staff list');
        const d = R.doctorById(state, id);
        state.doctors = state.doctors.filter((x) => x.id !== id);
        state.users = state.users.filter((u) => u.doctorId !== id);
        log('Doctor removed', d ? d.name : id);
        emit();
      },

      setPlanDay(doctorId, week, dayIndex, code) {
        requireCoord('change weekly plans');
        const d = R.doctorById(state, doctorId);
        d.plan = d.plan || { A: ['', '', '', '', ''], B: null };
        if (week === 'B' && !d.plan.B) d.plan.B = d.plan.A.slice();
        d.plan[week][dayIndex] = code;
        log('Weekly plan changed', `${d.name}, week ${week} ${R.DOW_SHORT[dayIndex]}: ${code || '(blank)'}`);
        emit();
      },

      toggleWeekB(doctorId, on) {
        requireCoord('change weekly plans');
        const d = R.doctorById(state, doctorId);
        d.plan.B = on ? d.plan.A.slice() : null;
        if (on) d.plan.anchor = d.plan.anchor || d.start;
        log('Weekly plan changed', `${d.name}: alternate week B ${on ? 'turned on' : 'turned off'}`);
        emit();
      },

      applyImport(kind, payload) {
        requireCoord('import files');
        if (kind === 'oncall') {
          const { entries, from, to, fileName } = payload; // entries: [{doctorId, date, code}]
          for (const d of state.doctors) {
            const m = state.oncall[d.id];
            if (!m) continue;
            for (const iso of Object.keys(m)) if (iso >= from && iso <= to) delete m[iso];
          }
          for (const e of entries) (state.oncall[e.doctorId] = state.oncall[e.doctorId] || {})[e.date] = e.code;
          log('On-call rota imported', `${fileName || 'file'}: ${entries.length} shifts, ${R.fmtUk(from)} to ${R.fmtUk(to)} (replaced earlier imports for those dates)`);
        } else if (kind === 'plan') {
          for (const p of payload.plans) {
            const d = R.doctorById(state, p.doctorId);
            d.plan = { A: p.A, B: p.B, anchor: p.from || d.plan && d.plan.anchor || d.start };
          }
          log('Weekly plans imported', `${payload.fileName || 'file'}: ${payload.plans.length} doctors`);
        } else if (kind === 'staff') {
          let added = 0, updated = 0;
          for (const s of payload.staff) {
            const existing = state.doctors.find((d) => d.name.toLowerCase() === s.name.toLowerCase());
            if (existing) { Object.assign(existing, s, { id: existing.id, plan: existing.plan }); updated++; } else {
              const doc = Object.assign({ id: uid('d'), plan: { A: ['', '', '', '', ''], B: null } }, s);
              state.doctors.push(doc);
              state.users.push({ id: 'u-' + doc.id, name: doc.name, role: 'doctor', doctorId: doc.id });
              added++;
            }
          }
          log('Staff list imported', `${payload.fileName || 'file'}: ${added} added, ${updated} updated`);
        }
        for (const [alias, doctorId] of Object.entries(payload.newAliases || {})) {
          const d = R.doctorById(state, doctorId);
          if (d && !d.aliases.includes(alias)) d.aliases.push(alias);
        }
        emit();
      },

      addRestricted(start, end, level, note) {
        requireCoord('set leave restrictions');
        if (!start || (end && end < start)) throw new Error('Choose a start date and an end date on or after it.');
        state.settings.restricted.push({ id: uid('x'), start, end: end || start, level, note: note || '' });
        log('Leave restriction added', `${level}: ${R.fmtUk(start)} to ${R.fmtUk(end || start)}${note ? ' (' + note + ')' : ''}`);
        emit();
      },
      removeRestricted(id) {
        requireCoord('set leave restrictions');
        const x = state.settings.restricted.find((r) => r.id === id);
        state.settings.restricted = state.settings.restricted.filter((r) => r.id !== id);
        if (x) log('Leave restriction removed', `${x.level}: ${R.fmtUk(x.start)} to ${R.fmtUk(x.end)}`);
        emit();
      },
      setConsultant(weekIso, name) {
        requireCoord('set the consultant of the week');
        state.settings.consultantOfWeek[weekIso] = name;
        log('Consultant of the week set', `Week of ${R.fmtUk(weekIso)}: ${name || '(none)'}`);
        emit();
      },
      markNotificationsRead() {
        const u = user();
        state.notifications.forEach((n) => { if (n.to === u.id || (n.to === 'coord' && u.role === 'coordinator')) n.read = true; });
        emit();
      }
    };
    return api;
  }

  // Restriction ranges -> per-date lookup
  function restrictionOn(state, iso) {
    return (state.settings.restricted || []).find((r) => iso >= r.start && iso <= (r.end || r.start)) || null;
  }

  const api = { createStore, demoState, restrictionOn, STORAGE_KEY };
  root.RotaStore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

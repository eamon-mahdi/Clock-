<title>Haematology Rota</title>
<meta name="description" content="Haematology department rota: who is where at GUH, RGH and NHH, leave requests and authorisation, EDT/SDT and rules.">
<meta name="robots" content="noindex, nofollow">

<style>
/* Layout: one working surface. Dark header with navigation and the person switcher, then a full-width tool area.
   Site colours follow the department's Excel: GUH red, RGH blue, NHH green, leave yellow. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef2f6; --line: #dbe2ea; --line-strong: #c3ccd7;
  --fg: #15202b; --muted: #4a5868; --faint: #6b7787;
  --accent: #1f4fa8; --accent-fg: #ffffff; --accent-soft: #e6eefb;
  --head-bg: #15202b; --head-fg: #ffffff; --head-muted: #b8c4d2; --head-chip: #2b3a4d;
  --ok-bg: #e7f4ea; --ok-fg: #1d5a2a; --ok-line: #bcdcc4;
  --warn-bg: #fff1dc; --warn-fg: #6e3700; --warn-line: #f0c896;
  --bad-bg: #a3261b; --bad-fg: #ffffff; --bad-soft: #fbe3e0; --bad-text: #a3261b;
  --na-bg: #f1f3f6; --na-fg: #6b7787;
  --guh-bg: #f6b4ae; --guh-fg: #5e0f09; --rgh-bg: #a3cdf3; --rgh-fg: #08345e; --nhh-bg: #b7dd9a; --nhh-fg: #1f430d;
  --lab-bg: #f7d7d4; --lab-fg: #5e0f09;
  --leave-bg: #ffe36e; --leave-fg: #443300; --sick-bg: #f4c7c3; --sick-fg: #6b130b;
  --call-bg: #e4dcf4; --call-fg: #36245e; --off-bg: #ffffff; --off-fg: #5f6b7a;
  --gone-a: #3a4452; --gone-b: #5f6b7a; --weekend: #2b3440; --weekend-fg: #d5dee8;
  --no-al: #a3261b; --avoid: #5b3a8c;
  --shadow: 0 8px 28px rgba(21, 32, 43, 0.18);
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --surface-2: #1e2935; --line: #2c3946; --line-strong: #3b4a5a;
    --fg: #e8edf2; --muted: #a9b6c4; --faint: #8b98a7;
    --accent: #7ea8f0; --accent-fg: #0b1626; --accent-soft: #1d2d47;
    --head-bg: #0a0f14; --head-fg: #ffffff; --head-muted: #9fb0c2; --head-chip: #223041;
    --ok-bg: #173323; --ok-fg: #a8dfb5; --ok-line: #2b5a3a;
    --warn-bg: #3a2810; --warn-fg: #ffd39c; --warn-line: #6b4a1c;
    --bad-bg: #d9483a; --bad-fg: #ffffff; --bad-soft: #3d1a17; --bad-text: #ff9b8f;
    --na-bg: #1e2935; --na-fg: #8b98a7;
    --guh-bg: #e79c95; --guh-fg: #3d0703; --rgh-bg: #8dbde8; --rgh-fg: #04213d; --nhh-bg: #a3cf85; --nhh-fg: #142c07;
    --lab-bg: #d9b3af; --lab-fg: #3d0703;
    --leave-bg: #e8cc55; --leave-fg: #2b2000; --sick-bg: #dca7a2; --sick-fg: #3d0703;
    --call-bg: #c9bce6; --call-fg: #22173d; --off-bg: #222d39; --off-fg: #b9c4d0;
    --gone-a: #2b333d; --gone-b: #46515e; --weekend: #0b1016; --weekend-fg: #9fb0c2;
    --no-al: #d9483a; --avoid: #9a76d4;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --surface-2: #1e2935; --line: #2c3946; --line-strong: #3b4a5a;
  --fg: #e8edf2; --muted: #a9b6c4; --faint: #8b98a7;
  --accent: #7ea8f0; --accent-fg: #0b1626; --accent-soft: #1d2d47;
  --head-bg: #0a0f14; --head-fg: #ffffff; --head-muted: #9fb0c2; --head-chip: #223041;
  --ok-bg: #173323; --ok-fg: #a8dfb5; --ok-line: #2b5a3a;
  --warn-bg: #3a2810; --warn-fg: #ffd39c; --warn-line: #6b4a1c;
  --bad-bg: #d9483a; --bad-fg: #ffffff; --bad-soft: #3d1a17; --bad-text: #ff9b8f;
  --na-bg: #1e2935; --na-fg: #8b98a7;
  --guh-bg: #e79c95; --guh-fg: #3d0703; --rgh-bg: #8dbde8; --rgh-fg: #04213d; --nhh-bg: #a3cf85; --nhh-fg: #142c07;
  --lab-bg: #d9b3af; --lab-fg: #3d0703;
  --leave-bg: #e8cc55; --leave-fg: #2b2000; --sick-bg: #dca7a2; --sick-fg: #3d0703;
  --call-bg: #c9bce6; --call-fg: #22173d; --off-bg: #222d39; --off-fg: #b9c4d0;
  --gone-a: #2b333d; --gone-b: #46515e; --weekend: #0b1016; --weekend-fg: #9fb0c2;
  --no-al: #d9483a; --avoid: #9a76d4;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.app-head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand strong { display: block; font-size: 1rem; }
.brand span { display: block; font-size: 0.75rem; color: var(--head-muted); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; }
.nav button { background: transparent; border: 0; color: var(--head-muted); padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; min-height: 40px; }
.nav button:hover { color: var(--head-fg); background: var(--head-chip); }
.nav button[aria-current="page"] { background: var(--head-chip); color: var(--head-fg); font-weight: 600; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: #e8833a; color: #15202b; font-size: 0.75rem; font-weight: 700; text-align: center; }
.who { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--head-muted); }
.who select { background: var(--head-chip); color: var(--head-fg); border: 1px solid #3b4a5d; border-radius: 6px; padding: 6px 8px; min-height: 38px; max-width: 220px; }
.proto-bar { background: var(--warn-bg); color: var(--warn-fg); border-bottom: 1px solid var(--warn-line); padding: 6px 16px; font-size: 0.8rem; }

main { padding-inline: 16px; padding-block: 18px 60px; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head p { margin-top: 4px; max-width: 75ch; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-weight: 500; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.good { background: var(--ok-fg); color: var(--surface); border-color: var(--ok-fg); font-weight: 600; }
.btn.danger { color: var(--bad-text); border-color: var(--bad-text); background: var(--surface); }
.btn.danger.solid { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.icon { width: 40px; padding: 0; font-size: 1.1rem; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
input[type="text"], input[type="date"], input[type="search"], input[type="number"], input[type="email"], select, textarea {
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; min-height: 40px; background: var(--surface); color: var(--fg); }
textarea { padding: 8px 10px; resize: vertical; }
input[type="number"] { width: 80px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > .main { flex: 999 1 560px; min-width: 0; }
.split > .side { flex: 1 1 320px; min-width: 0; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.notice.ok { background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-line); }
.notice.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.notice.bad { background: var(--bad-soft); color: var(--bad-text); border: 1px solid var(--bad-text); }
.notice.info { background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.pill.pending { background: var(--warn-bg); color: var(--warn-fg); }
.pill.authorised { background: var(--ok-bg); color: var(--ok-fg); }
.pill.declined { background: var(--bad-soft); color: var(--bad-text); }
.pill.cancelled { background: var(--na-bg); color: var(--na-fg); }

/* roster */
.table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 72vh; }
table.roster { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 0.78rem; }
.roster th, .roster td { padding: 3px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.roster thead th { position: sticky; top: 0; background: var(--surface); z-index: 3; font-weight: 600; padding: 8px 4px; border-bottom: 2px solid var(--line-strong); }
.roster thead tr.groups th { top: 0; z-index: 4; font-size: 0.72rem; color: var(--muted); background: var(--surface-2); border-bottom: 0; padding: 5px; }
.roster thead tr.names th { top: 27px; }
.roster .col-date { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 4px 8px; min-width: 96px; }
.roster thead .col-date { z-index: 5; }
.roster th.doc { min-width: 92px; max-width: 120px; }
.roster th.doc .grade { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 600; }
.roster th.doc .dates { display: block; font-size: 0.66rem; color: var(--faint); font-weight: 400; }
.roster .gap-col { width: 8px; padding: 0; background: var(--surface-2); }
.roster tr.weekend td, .roster tr.weekend .col-date { background: var(--weekend); color: var(--weekend-fg); }
.roster tr.today .col-date { box-shadow: inset 4px 0 0 var(--accent); }
.roster .cons { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 34px; padding: 2px 4px; border-radius: 5px; font-weight: 600; line-height: 1.1; font-size: 0.72rem; border: 1px solid transparent; width: 100%; }
button.cell { cursor: pointer; font-family: inherit; }
button.cell:hover { outline: 2px solid var(--accent); outline-offset: 0; }
.k-site.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.k-site.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.k-site.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.k-lab { background: var(--lab-bg); color: var(--lab-fg); }
.k-leave { background: var(--leave-bg); color: var(--leave-fg); }
.k-sick { background: var(--sick-bg); color: var(--sick-fg); }
.k-oncall { background: var(--call-bg); color: var(--call-fg); }
.k-off { background: var(--off-bg); color: var(--off-fg); border-color: var(--line); }
.k-bh { background: var(--na-bg); color: var(--na-fg); }
.k-other { background: var(--surface-2); color: var(--fg); border-color: var(--line-strong); }
.k-none { background: transparent; color: var(--faint); }
.k-gone { background: repeating-linear-gradient(45deg, var(--gone-a) 0 6px, var(--gone-b) 6px 12px); color: #ffffff; }
.k-half { color: var(--fg); }
.k-half.s-GUH { background: linear-gradient(90deg, var(--guh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-RGH { background: linear-gradient(90deg, var(--rgh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-NHH { background: linear-gradient(90deg, var(--nhh-bg) 50%, var(--leave-bg) 50%); }
.k-half.s-none { background: var(--leave-bg); color: var(--leave-fg); }
.cell.pending { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255, 227, 110, 0.85) 6px 12px); border: 1px dashed var(--warn-fg); }
.cell .mark { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--surface); }
.cell .mark.override { background: var(--accent); }
.cell .mark.conflict { background: var(--bad-bg); }
.dim .cell { opacity: 0.18; }
.cover-cell { white-space: nowrap; }
.cv { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 3px 5px; border-radius: 4px; margin: 1px; border: 1px solid transparent; }
.cv.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
.cv.gap { background: var(--bad-bg); color: var(--bad-fg); }
.cv.exception { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.cv.risk { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 5px, var(--surface) 5px 10px); color: var(--bad-text); border: 1px dashed var(--bad-text); }
.cv.na { background: var(--na-bg); color: var(--na-fg); }
.restr { display: inline-block; font-size: 0.62rem; font-weight: 700; color: #ffffff; padding: 1px 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
.restr.NO-AL { background: var(--no-al); }
.restr.AVOID { background: var(--avoid); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--muted); align-items: center; }
.legend .sw { display: inline-block; width: 18px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

/* day view */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daybtn { flex: none; min-width: 64px; min-height: 60px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
.daybtn[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.daybtn .d { font-size: 0.72rem; color: var(--muted); }
.daybtn .n { font-size: 1rem; font-weight: 700; }
.daybtn .f { font-size: 0.72rem; font-weight: 700; }
.f.ok { color: var(--ok-fg); } .f.exception, .f.risk { color: var(--warn-fg); } .f.gap { color: var(--bad-text); }
.site-card { padding: 0; overflow: hidden; gap: 0; }
.site-card .site-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.site-head.s-GUH { background: var(--guh-bg); color: var(--guh-fg); }
.site-head.s-RGH { background: var(--rgh-bg); color: var(--rgh-fg); }
.site-head.s-NHH { background: var(--nhh-bg); color: var(--nhh-fg); }
.site-card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.person { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.gbadge { flex: none; min-width: 46px; text-align: center; font-size: 0.7rem; font-weight: 700; padding: 4px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.gbadge.mg { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* lists */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; color: var(--fg); }
.list-item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.plain th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line-strong); }
.plain td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.scroll-x { overflow-x: auto; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border: 2px solid var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 3px; }
.drop { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; counter-reset: step; }
.steps li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.steps li::before { counter-increment: step; content: counter(step); width: 28px; height: 28px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-mono); }
.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 10px; }

<header class="app-head">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="5" width="24" height="22" rx="4" fill="none" stroke="#8fb6f0" stroke-width="2"></rect><path d="M3 12h24M10 2.5v5M20 2.5v5" stroke="#8fb6f0" stroke-width="2" fill="none"></path><rect x="7" y="16" width="5" height="4" rx="1" fill="#f6b4ae"></rect><rect x="13" y="16" width="5" height="4" rx="1" fill="#a3cdf3"></rect><rect x="19" y="16" width="5" height="4" rx="1" fill="#b7dd9a"></rect></svg>
    <div><strong>Haematology Rota</strong><span>GUH · RGH · NHH</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="who" id="who"></div>

<div class="proto-bar" id="bar" role="note" hidden></div>
<main id="view" tabindex="-1"></main>
<div id="sheet-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* Minimal .xlsx reader and writer with no dependencies.
 * Writer: stored (uncompressed) zip, shared styles (fills, fonts, borders, date format).
 * Reader: handles deflate via DecompressionStream, shared and inline strings, date-formatted cells.
 * Works in browsers and in Node 18+ (for tests and build scripts). */
(function (root) {
  'use strict';

  // ---------- zip ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const enc = (s) => new TextEncoder().encode(s);
  const dec = (b) => new TextDecoder('utf-8').decode(b);

  function zip(files) {
    // files: [{name, data: Uint8Array}] -> Uint8Array (method 0, stored)
    const parts = [];
    const central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc(f.name);
      const crc = crc32(f.data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); // UTF-8 names
      local.setUint16(8, 0, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, f.data.length, true);
      local.setUint32(22, f.data.length, true);
      local.setUint16(26, name.length, true);
      parts.push(new Uint8Array(local.buffer), name, f.data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, f.data.length, true);
      cd.setUint32(24, f.data.length, true);
      cd.setUint16(28, name.length, true);
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), name);
      offset += 30 + name.length + f.data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
    let p = 0;
    for (const a of all) { out.set(a, p); p += a.length; }
    return out;
  }

  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('This file is not a valid .xlsx (zip) file.');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Damaged .xlsx file (central directory).');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lofs = dv.getUint32(p + 42, true);
      const name = dec(bytes.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(lofs + 26, true);
      const lelen = dv.getUint16(lofs + 28, true);
      const start = lofs + 30 + lnlen + lelen;
      const raw = bytes.subarray(start, start + csize);
      if (method === 0) out[name] = raw;
      else if (method === 8) out[name] = await inflateRaw(raw);
      else throw new Error('Unsupported compression in .xlsx file.');
      p += 46 + nlen + elen + clen;
    }
    return out;
  }

  // ---------- helpers ----------
  const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const xmlUnesc = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');
  function colName(i) { // 0 -> A
    let s = '';
    i += 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function colIndex(ref) {
    const m = /^([A-Z]+)/.exec(ref);
    let n = 0;
    for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
  function isoToSerial(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return (Date.UTC(y, m - 1, d) - EXCEL_EPOCH) / 86400000;
  }
  function serialToIso(n) {
    const d = new Date(EXCEL_EPOCH + Math.round(n) * 86400000);
    return d.toISOString().slice(0, 10);
  }

  // ---------- writer ----------
  // sheet: {name, rows: [[cell]], widths: [n], freeze: {row, col}, heights: {rowIndex: pt}}
  // cell: null | string | number | {v, date: true, style: {...}}
  // style: {fill: 'RRGGBB', bold, color: 'RRGGBB', size, center, wrap, border}
  function write(sheets) {
    const styleKeys = new Map(); // json -> index
    const fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
    const fonts = ['<font><sz val="10"/><name val="Calibri"/></font>'];
    const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>',
      '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>'];
    const xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    const fillIdx = new Map(); const fontIdx = new Map();
    function styleIndex(style, isDate) {
      if (!style && !isDate) return 0;
      const s = style || {};
      const key = JSON.stringify([s, !!isDate]);
      if (styleKeys.has(key)) return styleKeys.get(key);
      let fillId = 0;
      if (s.fill) {
        if (!fillIdx.has(s.fill)) { fillIdx.set(s.fill, fills.length); fills.push(`<fill><patternFill patternType="solid"><fgColor rgb="FF${s.fill}"/><bgColor indexed="64"/></patternFill></fill>`); }
        fillId = fillIdx.get(s.fill);
      }
      let fontId = 0;
      if (s.bold || s.color || s.size) {
        const fk = [s.bold, s.color, s.size].join('|');
        if (!fontIdx.has(fk)) {
          fontIdx.set(fk, fonts.length);
          fonts.push(`<font>${s.bold ? '<b/>' : ''}<sz val="${s.size || 10}"/>${s.color ? `<color rgb="FF${s.color}"/>` : ''}<name val="Calibri"/></font>`);
        }
        fontId = fontIdx.get(fk);
      }
      const borderId = s.border ? 1 : 0;
      const align = s.center || s.wrap ? `<alignment${s.center ? ' horizontal="center" vertical="center"' : ''}${s.wrap ? ' wrapText="1"' : ''}/>` : '';
      const numFmt = isDate ? 164 : 0;
      xfs.push(`<xf numFmtId="${numFmt}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0"${fillId ? ' applyFill="1"' : ''}${fontId ? ' applyFont="1"' : ''}${borderId ? ' applyBorder="1"' : ''}${isDate ? ' applyNumberFormat="1"' : ''}${align ? ' applyAlignment="1">' + align + '</xf>' : '/>'}`);
      styleKeys.set(key, xfs.length - 1);
      return xfs.length - 1;
    }

    const sheetXml = sheets.map((sh) => {
      const rowsXml = sh.rows.map((row, r) => {
        const cells = (row || []).map((cell, c) => {
          if (cell === null || cell === undefined || cell === '') return '';
          const obj = typeof cell === 'object' ? cell : { v: cell };
          const ref = colName(c) + (r + 1);
          const s = styleIndex(obj.style, obj.date);
          const sAttr = s ? ` s="${s}"` : '';
          if (obj.v === null || obj.v === undefined || obj.v === '') return `<c r="${ref}"${sAttr}/>`;
          if (obj.date) return `<c r="${ref}"${sAttr}><v>${isoToSerial(obj.v)}</v></c>`;
          if (typeof obj.v === 'number') return `<c r="${ref}"${sAttr}><v>${obj.v}</v></c>`;
          return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(obj.v)}</t></is></c>`;
        }).join('');
        const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
        return `<row r="${r + 1}"${ht}>${cells}</row>`;
      }).join('');
      const cols = sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
      let pane = '';
      if (sh.freeze) {
        const { row = 0, col = 0 } = sh.freeze;
        const tl = colName(col) + (row + 1);
        pane = `<sheetViews><sheetView workbookViewId="0"><pane${col ? ` xSplit="${col}"` : ''}${row ? ` ySplit="${row}"` : ''} topLeftCell="${tl}" activePane="${row && col ? 'bottomRight' : row ? 'bottomLeft' : 'topRight'}" state="frozen"/></sheetView></sheetViews>`;
      }
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rowsXml}</sheetData></worksheet>`;
    });

    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;

  // Is a named doctor free to cover on a date? ignoreRequestId: the request being checked.

    if (cell.kind === 'sick') return { ok: false, why: 'unavailable' };
    if (cell.kind === 'oncall') return { ok: false, why: `on call (${cell.code.toLowerCase()})` };

    if (cell.pending && cell.pending.id !== ignoreRequestId && cell.pending.part === 'FULL') return { ok: false, why: 'has asked for leave that day' };

  // Check whether an EDT/SDT/SPA session can be booked.
  function edtCheck(state, doctorId, iso, session) {
    const doc = doctorById(state, doctorId);

    const add = (ok, rule, detail) => checks.push({ ok, rule, detail });
    if (!doc || !isIso(iso) || (session !== 'AM' && session !== 'PM')) return { ok: false, checks: [{ ok: false, rule: 'Choose a doctor, date and session', detail: '' }] };
    const sesWord = session === 'AM' ? 'morning' : 'afternoon';
    if (!isWorkday(state, iso)) { add(false, 'Weekday only', 'EDT/SDT is booked on working weekdays.'); return { ok: false, checks }; }
    if (!inPost(doc, iso)) { add(false, 'In post', `${doc.name} is not in post that day.`); return { ok: false, checks }; }
    if (edtOn(state, doctorId, iso)) { add(false, 'One session a day', 'There is already a session booked that day.'); return { ok: false, checks }; }
    const cell = resolveCell(state, doc, iso);
    if (!(cell.kind === 'site' || cell.kind === 'lab')) { add(false, 'Working at a site that day', `${doc.name} is ${cell.code ? cell.code.toLowerCase() : 'not rostered'} that day.`); return { ok: false, checks }; }
    const before = coverFor(state, iso);
    const after = coverFor(state, iso, { absentSession: { [doc.id]: session } });
    const newGaps = after.rules.filter((r, i) => STATUS_RANK[r.status] > STATUS_RANK[before.rules[i].status]);
    if (doc.group === 'res') {
      const atGuh = coverCode(cell) === 'GUH';
      add(atGuh, 'Residents take EDT/SDT at GUH only', atGuh ? `${doc.name} is at GUH that day.` : `${doc.name} is rostered at ${cell.code}. Move them to GUH for the day first (change the roster cell), then book.`);
      const need = ruleNum(state, 'edtOthersAtGUH');
      const others = state.doctors.filter((d) => d.id !== doc.id && d.group === 'res' && inPost(d, iso)).filter((d) => {
        const c = resolveCell(state, d, iso);
        return (session === 'AM' ? c.am : c.pm) === 'GUH';
      });
      add(others.length >= need, `At least ${need} other residents at GUH that ${sesWord}`, others.length ? `${others.map((d) => `${d.name} (${d.grade})`).join(', ')}${others.length < need ? `: ${need - others.length} more needed` : ''}.` : 'Nobody else is at GUH.');
    } else {
      add(true, 'Senior doctors can take EDT at any site', `${doc.name} is at ${cell.code}.`);
    }
    add(!newGaps.length, 'Site cover is kept', newGaps.length ? `That ${sesWord} would leave: ${newGaps.map((r) => r.rule.label.toLowerCase()).join(', ')}.` : 'All posts stay covered.');

    if (/specialty doctor|specialty dr|SAS/i.test(g)) return 29;

        const set = (offset, code) => { const iso = R.addDays(wk, offset); if (R.inPost(d, iso)) (oncall[d.id] = oncall[d.id] || {})[iso] = code; };
        const k = (w + i * 2 + 12) % 6;
        if (k === 0) { [0, 1, 2, 3].forEach((o) => set(o, 'NIGHTS')); set(4, 'POST NIGHTS'); }
        if (k === 3) { set(4, 'OFF PRE ON-CALL'); set(5, 'LONG DAY'); set(6, 'LONG DAY'); }
        if (k === 1) { set(1, 'TWILIGHT'); set(2, 'TWILIGHT'); }
      });
    }
    const consultants = ['Dr Fraser', 'Dr Lin', 'Dr Okoro', 'Dr Grant', 'Dr Shah'];
    const consultantOfWeek = {};
    for (let w = -10; w < 12; w++) consultantOfWeek[R.addDays(mon, w * 7)] = consultants[(w + 20) % consultants.length];
    const settings = Object.assign(baseSettings(), {
      demo: true, consultantOfWeek, authorisers: ['J. Hale', 'S. Price', 'R. Dunn'],
      restricted: [{ id: uid('x'), start: R.addDays(mon, 14), end: R.addDays(mon, 15), level: 'NO AL', note: 'Short-staffed: two doctors on induction' }],
      changeovers: [{ id: uid('c'), date: '2026-12-02', label: 'Foundation 4-month changeover' }, { id: uid('c'), date: '2027-02-03', label: 'IMT 6-month changeover' }]
    });
    const state = { version: 2, settings, doctors, oncall, overrides: {}, requests: [], edt: [], audit: [], notifications: [] };
    const add = (doctorId, type, start, end, part, status, note, extra) => {
      const doc = R.doctorById(state, doctorId);
      const r = Object.assign({ id: uid('lr'), doctorId, email: doc.email, type, start, end, part, note: note || '', status, cover: [], excludedDates: [],
        submittedAt: R.addDays(today, -6) + 'T09:12:00Z', days: R.leaveDays(state, start, end, part) }, extra || {});
      if (status !== 'pending') Object.assign(r, { decidedBy: 'J. Hale', decidedAt: R.addDays(today, -5) + 'T14:30:00Z' });
      state.requests.push(r);
      return r;
    };
    add('m2', 'AL', R.addDays(mon, 9), R.addDays(mon, 11), 'FULL', 'authorised', 'Half term');
    add('r6', 'AL', R.addDays(mon, 17), R.addDays(mon, 17), 'PM', 'authorised', 'Appointment');
    add('r1', 'AL', R.addDays(mon, 43), R.addDays(mon, 46), 'FULL', 'authorised', 'Holiday');
    add('m6', 'SICK', R.addDays(mon, -3), R.addDays(mon, -3), 'FULL', 'authorised', '', { decidedBy: 'Self-reported' });
    const reqs = [
      ['r2', 'AL', R.addDays(mon, 42), R.addDays(mon, 46), 'Family wedding abroad', { dayUnitCoverId: 'r8' }],
      ['m5', 'AL', R.addDays(mon, 45), R.addDays(mon, 45), "Sister's wedding", { guhCoverId: 'm1' }],
      ['r7', 'SL', R.addDays(mon, 52), R.addDays(mon, 52), 'Regional teaching course', { intrepid: true, dayUnitCoverId: 'r5' }]
    ];
    for (const [id, type, s, e, note, extra] of reqs) {
      const r = add(id, type, s, e, 'FULL', 'pending', note, extra);
      const chk = R.staffingCheck(state, { doctorId: id, start: s, end: e, part: 'FULL', dayUnitCoverId: r.dayUnitCoverId, guhCoverId: r.guhCoverId, requestId: r.id });
      r.cover = chk.cover; r.check = { bad: chk.bad, warn: chk.warn };
    }
    const edtDays = [['r5', 9, 'PM'], ['m1', 3, 'PM'], ['m2', 1, 'PM'], ['r1', 10, 'AM']];
    for (const [id, off, ses] of edtDays) {
      const iso = R.addDays(mon, off);
      const chk = R.edtCheck(state, id, iso, ses);
      if (chk.ok) state.edt.push({ id: uid('e'), doctorId: id, date: iso, session: ses, type: chk.type, bookedBy: 'J. Hale' });
    }
    state.audit.push({ at: nowIso(), by: 'System', action: 'Demo data loaded', detail: 'Fictional doctors, weekly plans, on-calls, EDT and leave requests' });
    state.notifications.push({ id: uid('n'), to: 'auth', at: nowIso(), text: '3 leave requests are waiting for a decision.', read: false });
    return state;
  }

  // ---------- helpers shared by server and browser ----------
  const docName = (state, id) => (R.doctorById(state, id) || { name: '?' }).name;
  const rangeText = (a, b) => (a === b ? R.fmtShort(a) : `${R.fmtShort(a)} – ${R.fmtShort(b)}`);
  function log(state, by, action, detail) {
    state.audit.unshift({ at: nowIso(), by, action, detail });
    if (state.audit.length > 3000) state.audit.length = 3000;
  }
  function notify(state, to, text) {
    state.notifications.unshift({ id: uid('n'), to, at: nowIso(), text, read: false });
    if (state.notifications.length > 600) state.notifications.length = 600;
  }
  const emailMatches = (doc, email) => {
    const a = String(email || '').trim().toLowerCase();
    return !!a && (!doc.email || doc.email.trim().toLowerCase() === a);
  };
  const authorEmails = (state) => ((state.settings && state.settings.authoriserEmails) || []).filter(Boolean);

  // A doctor (no password) sends a leave request. Returns {request, check, emails}.
  function submitLeave(state, p) {
    const doc = R.doctorById(state, p.doctorId);
    if (!doc) throw new Error('Choose your name from the list.');
    if (!emailMatches(doc, p.email)) throw new Error(doc.email ? 'That NHS email does not match the staff list for your name. Check it, or ask an authoriser to update it.' : 'Enter your NHS email address.');
    if (!R.FORM_LEAVE_TYPES.includes(p.type)) throw new Error('Choose a leave type.');
    if (!R.isIso(p.start) || !R.isIso(p.end) || p.end < p.start) throw new Error('Choose a start date and an end date on or after it.');
    if (R.daysBetween(p.start, p.end) > 92) throw new Error('A single request can cover up to 3 months. Split longer leave into separate requests.');
    if (p.type === 'SL' && !p.intrepid) throw new Error('Study leave must also be requested through Intrepid (or CODI). Tick the box to confirm.');
    if (p.type === 'OTHER' && !String(p.otherText || '').trim()) throw new Error('Describe the type of leave under "Other".');
    const part = p.start === p.end && (p.part === 'AM' || p.part === 'PM') ? p.part : 'FULL';
    const overlap = state.requests.find((r) => r.doctorId === doc.id && ['pending', 'hold', 'authorised'].includes(r.status) && r.start <= p.end && r.end >= p.start);
    if (overlap) throw new Error(`You already have ${overlap.status === 'authorised' ? 'approved' : 'a pending request for'} leave on ${rangeText(overlap.start, overlap.end)}.`);
    const cleanId = (id) => (id && R.doctorById(state, id) && id !== doc.id ? id : '');
    const r = {
      id: uid('lr'), doctorId: doc.id, email: String(p.email).trim(), type: p.type, otherText: String(p.otherText || '').slice(0, 200),
      start: p.start, end: p.end, part, note: String(p.note || '').slice(0, 1000), intrepid: !!p.intrepid, remainingStated: String(p.remainingStated || '').slice(0, 60),
      dayUnitCoverId: cleanId(p.dayUnitCoverId), guhCoverId: cleanId(p.guhCoverId), excludedDates: [],
      submittedAt: nowIso(), days: R.leaveDays(state, p.start, p.end, part), status: p.type === 'SICK' ? 'authorised' : 'pending', cover: []
    };
    const check = R.staffingCheck(state, { doctorId: doc.id, start: r.start, end: r.end, part, dayUnitCoverId: r.dayUnitCoverId, guhCoverId: r.guhCoverId, requestId: r.id });
    r.cover = check.cover;
    r.check = { bad: check.bad, warn: check.warn };
    const label = R.LEAVE_TYPES[r.type].label;
    const when = rangeText(r.start, r.end);
    const emails = [];
    if (r.type === 'SICK') {
      Object.assign(r, { decidedBy: 'Self-reported', decidedAt: nowIso() });
      notify(state, 'auth', `${doc.name} reported sick: ${when}.${check.bad ? ' Not enough doctors on ' + check.bad + ' day(s).' : ''}`);
      log(state, doc.name, 'Sickness reported', `${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}`);
      authorEmails(state).forEach((to) => emails.push({ to, subject: `Sickness reported: ${doc.name}, ${when}`, text: `${doc.name} (${doc.grade}) has reported sick for ${when}.${check.bad ? `\n\nNot enough doctors on ${check.bad} day(s). Please arrange cover.` : ''}\n\nOpen the rota to review cover.` }));
    } else {
      notify(state, 'auth', `New ${label.toLowerCase()} request from ${doc.name}: ${when}.${check.bad ? ' Not enough doctors on ' + check.bad + ' day(s).' : ''}`);
      log(state, doc.name, 'Leave requested', `${label}, ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)} (${r.days} day${r.days === 1 ? '' : 's'})${check.bad ? `; flagged: not enough doctors on ${check.bad} day(s)` : ''}`);
      authorEmails(state).forEach((to) => emails.push({ to, subject: `${check.bad ? 'Needs a decision (not enough doctors): ' : 'Leave request: '}${doc.name}, ${when}`, text: `${doc.name} (${doc.grade}) asked for ${label.toLowerCase()}: ${when}, ${r.days} working day(s).${check.bad ? `\n\nNot enough doctors on ${check.bad} day(s).` : ''}${check.warn ? `\nWarnings on ${check.warn} day(s).` : ''}\n\nSign in as an authoriser to decide.` }));
      emails.push({ to: r.email, subject: `We've got your leave request: ${when}`, text: `Your ${label.toLowerCase()} request for ${when} has been sent to the rota authorisers. You'll get an email when it's decided. You can check progress under "Check my request".` });
      const covers = new Set(r.cover.map((c) => c.doctorId));
      covers.forEach((id) => { const cd = R.doctorById(state, id); if (cd && cd.email) emails.push({ to: cd.email, subject: `You've been named as cover: ${doc.name}, ${when}`, text: `${doc.name} has named you as cover while on leave (${when}), if the request is approved:\n${r.cover.filter((c) => c.doctorId === id).map((c) => c.text).join('\n')}` }); });
    }
    notify(state, 'd:' + doc.id, r.type === 'SICK' ? `Sickness recorded for ${when}.` : `Request sent: ${label.toLowerCase()} ${when}.`);
    state.requests.push(r);
    return { request: r, check, emails };
  }
  function withdrawLeave(state, id, email) {
    const r = state.requests.find((x) => x.id === id);
    if (!r) throw new Error('Request not found.');
    const doc = R.doctorById(state, r.doctorId);
    if (!emailMatches(doc || {}, email) || String(r.email || '').toLowerCase() !== String(email || '').trim().toLowerCase()) throw new Error('That email does not match the request.');
    if (!['pending', 'hold'].includes(r.status)) throw new Error('Only requests still waiting can be withdrawn.');
    r.status = 'cancelled';
    log(state, doc ? doc.name : '?', 'Leave request withdrawn', `${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}`);
    notify(state, 'auth', `${doc ? doc.name : 'A doctor'} withdrew their request for ${rangeText(r.start, r.end)}.`);
    return r;
  }
  function myRequests(state, doctorId, email) {
    const doc = R.doctorById(state, doctorId);
    if (!doc || !emailMatches(doc, email)) throw new Error('Name and NHS email do not match the staff list.');
    const mail = String(email).trim().toLowerCase();
    return {
      requests: state.requests.filter((r) => r.doctorId === doc.id && (!r.email || r.email.toLowerCase() === mail || doc.email)).sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1)),
      notifications: state.notifications.filter((n) => n.to === 'd:' + doc.id).slice(0, 30)
    };
  }

  // What anyone with the link can see (no emails, notes, reasons, sickness or audit).
  function publicView(state) {
    const s = clone(state);
    s.doctors.forEach((d) => { delete d.email; delete d.alEntitlement; delete d.slEntitlement; delete d.note; });
    s.requests = s.requests.filter((r) => ['pending', 'hold', 'authorised'].includes(r.status)).map((r) => ({
      id: r.id, doctorId: r.doctorId, type: r.type === 'SICK' ? 'UNAVAIL' : (['AL', 'SL'].includes(r.type) ? r.type : 'OTHER'),
      start: r.start, end: r.end, part: r.part, status: r.status, excludedDates: r.excludedDates || [], days: r.days, cover: (r.cover || []).map((c) => ({ date: c.date, doctorId: c.doctorId, to: c.to }))
    }));
    Object.values(s.overrides || {}).forEach((m) => Object.values(m).forEach((o) => { delete o.reason; delete o.by; }));
    s.audit = []; s.notifications = [];
    s.settings.authoriserEmails = [];
    s.public = true;
    return s;
  }

  // ---------- authoriser actions (pure functions on state; return emails to send) ----------
  const ops = {
    setCell(state, by, doctorId, iso, code, reason) {
      const d = R.doctorById(state, doctorId);
      state.overrides[doctorId] = state.overrides[doctorId] || {};
      const before = R.resolveCell(state, d, iso).code || '(blank)';
      if (code) state.overrides[doctorId][iso] = { code: R.canonicalCode(code), reason: reason || '', by, at: nowIso() };
      else delete state.overrides[doctorId][iso];
      log(state, by, 'Roster changed', `${d.name}, ${R.fmtShort(iso)}: ${before} → ${R.resolveCell(state, d, iso).code || '(blank)'}${reason ? ` (${reason})` : ''}`);
      return [];
    },
    // decision: 'approve' | 'approveCovered' | 'hold' | 'decline'
    decide(state, by, id, decision, message, opts) {
      opts = opts || {};
      const r = state.requests.find((x) => x.id === id);
      if (!r || !['pending', 'hold'].includes(r.status)) throw new Error('This request has already been decided.');
      const doc = R.doctorById(state, r.doctorId);
      const check = R.staffingCheck(state, { doctorId: r.doctorId, start: r.start, end: r.end, part: r.part, dayUnitCoverId: r.dayUnitCoverId, guhCoverId: r.guhCoverId, requestId: r.id });
      const badDays = check.days.filter((d) => d.status === 'bad').map((d) => d.date);
      const msg = String(message || '').trim();
      if (decision === 'approve' && badDays.length && !msg) throw new Error('Some days don\'t have enough doctors. Give a reason (e.g. "locum booked") to approve all days.');
      if ((decision === 'decline' || decision === 'hold') && !msg) throw new Error(decision === 'decline' ? 'Give a reason for declining. It is sent to the doctor.' : 'Write the question for the doctor.');
      const label = R.LEAVE_TYPES[r.type].label;
      const when = rangeText(r.start, r.end);
      let subject, text, status;
      if (decision === 'hold') {
        r.status = 'hold'; r.question = msg;
        subject = `Question about your leave request: ${when}`; text = `${by} has a question about your ${label.toLowerCase()} request (${when}):\n\n"${msg}"\n\nPlease reply to the rota authorisers.`;
        status = 'Question sent';
      } else if (decision === 'decline') {
        r.status = 'declined';
        subject = `Leave not approved: ${when}`; text = `Your ${label.toLowerCase()} request (${when}) was not approved by ${by}.\n\nReason: ${msg}`;
        status = 'Leave declined';
      } else {
        if (decision === 'approveCovered') {
          r.excludedDates = badDays;
          if (!R.dateRange(r.start, r.end).some((d) => R.isWorkday(state, d) && !badDays.includes(d))) throw new Error('No days have enough doctors. Decline, hold or approve all with a reason instead.');
        }
        r.status = 'authorised';
        r.days = R.leaveDays(state, r.start, r.end, r.part, r.excludedDates);
        r.cover = check.cover.filter((c) => !(r.excludedDates || []).includes(c.date));
        for (const c of r.cover) {
          state.overrides[c.doctorId] = state.overrides[c.doctorId] || {};
          state.overrides[c.doctorId][c.date] = { code: c.to, reason: `Covering ${doc.name}'s leave`, by, at: nowIso() };
          notify(state, 'd:' + c.doctorId, `You are covering ${c.to} on ${R.fmtShort(c.date)} for ${doc.name}.`);
        }
        const partial = (r.excludedDates || []).length;
        subject = partial ? `Leave partly approved: ${when}` : `Leave approved: ${when}`;
        text = partial
          ? `Your ${label.toLowerCase()} request (${when}) was partly approved by ${by}.\n\nNot approved: ${r.excludedDates.map((d) => R.fmtShort(d)).join(', ')} (not enough doctors).${check.alternatives.length ? `\nDays with cover nearby: ${check.alternatives.map((d) => R.fmtShort(d)).join(', ')}.` : ''}${msg ? `\n\n"${msg}"` : ''}`
          : `Your ${label.toLowerCase()} request (${when}) was approved by ${by}.${msg ? `\n\n"${msg}"` : ''}`;
        status = partial ? 'Leave partly approved' : 'Leave approved';
        if (badDays.length && decision === 'approve') r.overrideReason = msg;
      }
      r.decidedBy = by; r.decidedAt = nowIso(); r.message = msg;
      notify(state, 'd:' + r.doctorId, `${status}: ${label.toLowerCase()} ${when}.${msg ? ' "' + msg + '"' : ''}`);
      log(state, by, status, `${doc.name}: ${label}, ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}${(r.excludedDates || []).length ? `; not approved ${r.excludedDates.map(R.fmtUk).join(', ')}` : ''}${msg ? `; "${msg}"` : ''}`);
      const emails = [];
      const to = r.email || doc.email;
      if (to) emails.push({ to, subject, text });
      if (r.status === 'authorised') new Set(r.cover.map((c) => c.doctorId)).forEach((cid) => { const cd = R.doctorById(state, cid); if (cd && cd.email) emails.push({ to: cd.email, subject: `You're covering for ${doc.name}`, text: r.cover.filter((c) => c.doctorId === cid).map((c) => c.text).join('\n') }); });
      return emails;
    },
    bookEdt(state, by, doctorId, iso, session, reason) {
      const chk = R.edtCheck(state, doctorId, iso, session);
      if (!chk.ok && !String(reason || '').trim()) throw new Error('This session breaks a rule. Give a reason to book it anyway.');
      const doc = R.doctorById(state, doctorId);
      state.edt.push({ id: uid('e'), doctorId, date: iso, session, type: chk.type || R.edtDefault(doc).type, bookedBy: by, reason: reason || '' });
      notify(state, 'd:' + doctorId, `${chk.type || 'EDT'} booked: ${R.fmtShort(iso)} ${session === 'AM' ? 'morning' : 'afternoon'}.`);
      log(state, by, 'EDT/SDT booked', `${doc.name}: ${R.fmtUk(iso)} ${session}${reason ? ` (override: ${reason})` : ''}`);
      return doc.email ? [{ to: doc.email, subject: `${chk.type || 'EDT'} booked: ${R.fmtShort(iso)} ${session}`, text: `${by} booked your ${chk.type || 'EDT'} for ${R.fmtLong(iso)} (${session === 'AM' ? 'morning' : 'afternoon'}).` }] : [];
    },
    removeEdt(state, by, id) {
      const e = state.edt.find((x) => x.id === id);
      state.edt = state.edt.filter((x) => x.id !== id);
      if (e) log(state, by, 'EDT/SDT removed', `${docName(state, e.doctorId)}: ${R.fmtUk(e.date)} ${e.session}`);
      return [];
    },
    saveDoctor(state, by, d) {
      const existing = R.doctorById(state, d.id);
      if (existing) {
        const changes = Object.keys(d).filter((k) => k !== 'id' && JSON.stringify(existing[k]) !== JSON.stringify(d[k]));
        Object.assign(existing, d);
        if (changes.length) log(state, by, 'Doctor updated', `${existing.name}: ${changes.join(', ')}`);
      } else {
        const doc = Object.assign({ id: uid('d'), aliases: [], fte: 1, plan: { A: ['', '', '', '', ''], B: null } }, d);
        if (doc.alEntitlement === undefined || doc.alEntitlement === '') doc.alEntitlement = R.alProRata(doc).days;
        state.doctors.push(doc);
        log(state, by, 'Doctor added', `${doc.name} (${doc.grade})`);
      }
      return [];
    },
    copyDoctor(state, by, fromId, fields) {
      const src = R.doctorById(state, fromId);
      if (!src) throw new Error('Choose a doctor to copy.');
      if (!String(fields.name || '').trim()) throw new Error('Type the new doctor\'s name.');
      const doc = { id: uid('d'), name: fields.name.trim(), grade: fields.grade || src.grade, group: src.group, email: fields.email || '', start: fields.start || '', end: fields.end || '',
        fte: src.fte || 1, aliases: [], plan: clone(src.plan || { A: ['', '', '', '', ''], B: null }), edtHours: src.edtHours, slEntitlement: src.slEntitlement };
      doc.alEntitlement = R.alProRata(doc).days;
      state.doctors.push(doc);
      log(state, by, 'Doctor added (copied)', `${doc.name} copied from ${src.name}: grade, group and weekly plan`);
      return [];
    },
    removeDoctor(state, by, id) {
      const d = R.doctorById(state, id);
      state.doctors = state.doctors.filter((x) => x.id !== id);
      log(state, by, 'Doctor removed', d ? d.name : id);
      return [];
    },
    setPlanDay(state, by, doctorId, week, i, code) {
      const d = R.doctorById(state, doctorId);
      d.plan = d.plan || { A: ['', '', '', '', ''], B: null };
      if (week === 'B' && !d.plan.B) d.plan.B = d.plan.A.slice();
      d.plan[week][i] = code;
      log(state, by, 'Weekly plan changed', `${d.name}, week ${week} ${R.DOW_SHORT[i]}: ${code || '(blank)'}`);
      return [];
    },
    toggleWeekB(state, by, doctorId, on) {
      const d = R.doctorById(state, doctorId);
      d.plan.B = on ? d.plan.A.slice() : null;
      if (on) d.plan.anchor = d.plan.anchor || d.start;
      log(state, by, 'Weekly plan changed', `${d.name}: alternate week B ${on ? 'on' : 'off'}`);
      return [];
    },
    applyImport(state, by, kind, payload) {
      if (kind === 'oncall') {
        const { entries, from, to, fileName } = payload;
        for (const id of Object.keys(state.oncall)) for (const iso of Object.keys(state.oncall[id])) if (iso >= from && iso <= to) delete state.oncall[id][iso];
        for (const e of entries) (state.oncall[e.doctorId] = state.oncall[e.doctorId] || {})[e.date] = e.code;
        log(state, by, 'On-call rota imported', `${fileName || 'file'}: ${entries.length} shifts, ${R.fmtUk(from)} to ${R.fmtUk(to)}`);
      } else if (kind === 'plan') {
        for (const p of payload.plans) { const d = R.doctorById(state, p.doctorId); d.plan = { A: p.A, B: p.B, anchor: p.from || (d.plan && d.plan.anchor) || d.start }; }
        log(state, by, 'Weekly plans imported', `${payload.fileName || 'file'}: ${payload.plans.length} doctors`);
      } else if (kind === 'staff') {
        let added = 0, updated = 0;
        for (const s of payload.staff) {
          const existing = state.doctors.find((d) => d.name.toLowerCase() === s.name.toLowerCase());
          if (existing) { Object.assign(existing, s, { id: existing.id, plan: existing.plan }); updated++; } else {
            const doc = Object.assign({ id: uid('d'), fte: 1, plan: { A: ['', '', '', '', ''], B: null } }, s);
            if (!doc.alEntitlement) doc.alEntitlement = R.alProRata(doc).days;
            state.doctors.push(doc); added++;
          }
        }
        log(state, by, 'Staff list imported', `${payload.fileName || 'file'}: ${added} added, ${updated} updated`);
      }
      for (const [alias, doctorId] of Object.entries(payload.newAliases || {})) {
        const d = R.doctorById(state, doctorId);
        if (d && !(d.aliases || []).includes(alias)) (d.aliases = d.aliases || []).push(alias);
      }
      return [];
    },
    setSetting(state, by, path, value, what) {
      const keys = path.split('.');
      let o = state.settings;
      for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]] = o[keys[i]] || {};
      o[keys[keys.length - 1]] = value;
      log(state, by, 'Settings changed', what || `${path}: ${JSON.stringify(value).slice(0, 120)}`);
      return [];
    },

  function fillFor(cell) {

  // ---------- templates ----------

  function oncallTemplate(todayIso) {

  function planTemplate(state) {

    for (const d of state.doctors) {

    const help = [
      'How to fill in the weekly plan',
      '',
      'One row per doctor with their usual place on each weekday. Use the codes on the "Site codes" sheet.',
      'Alternating weeks: add a second row for the same doctor with Week = B. Week A starts on the "Applies from" date (or the doctor\'s start date).',

      { name: 'Site codes', rows: codes, widths: [20, 50] },
      { name: 'How to fill this in', rows: help.map((t, i) => [i === 0 ? { v: t, style: { bold: true, size: 12 } } : note(t)]), widths: [120] }

  }

  function staffTemplate(state) {
    const rows = [[head('Name'), head('Grade'), head('Group (Resident or Senior doctor)'), head('Email'), head('In post from'), head('In post to'), head('Annual leave days'), head('Study leave days'), head('Other spellings in the on-call sheet (comma separated)')]];

  }

  // ---------- import parsing ----------
  function cellText(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'object' && v.date) return v.date;

  function parseDate(v) {

    if (typeof v === 'object' && v.date) return v.date;

  function parsePlans(state, sheets) {

    const idx = (re) => header.findIndex((x) => re.test(x));

  }

  // ---------- roster export ----------
  function rosterWorkbook(state, from, to) {

      .concat(docs.map((d) => head(`${d.grade}\n${d.name}`)))
      .concat([head('Residents (GUH · RGH · NHH)'), head('Senior doctors (GUH ward · RGH DU · NHH DU)')]);
    const rows = [header];
    for (const iso of R.dateRange(from, to)) {

      const dark = wk ? { fill: FILL.WEEKEND, color: 'FFFFFF' } : {};
      const restr = S.restrictionOn(state, iso);
      const row = [
        { v: iso, date: true, style: Object.assign({}, base, dark, restr && !wk ? { fill: restr.level === 'NO AL' ? 'C00000' : '7030A0', color: 'FFFFFF', bold: true } : {}) },
        { v: R.DOW_LONG[R.dow(iso)], style: Object.assign({}, base, dark) },
        { v: wk ? '' : (state.settings.consultantOfWeek[R.mondayOf(iso)] || ''), style: Object.assign({}, base, dark) },
        { v: restr ? restr.level : '', style: Object.assign({}, base, dark) }

      row.push({ v: txt('mg'), style: Object.assign({}, base, dark, bad('mg') ? { color: 'C00000', bold: true } : {}) });

    }

    for (const r of state.requests.slice().sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1))) {
      const d = R.doctorById(state, r.doctorId);

    return X.write([
      { name: 'Roster', rows, widths: [12, 11, 14, 11].concat(docs.map(() => 15)).concat([30, 40]), freeze: { row: 1, col: 2 }, heights: { 0: 42 } },
      { name: 'Leave log', rows: log, widths: [17, 16, 22, 12, 12, 7, 8, 11, 14, 17, 40, 40], freeze: { row: 1 } },
      { name: 'Change log', rows: audit, widths: [17, 18, 26, 90], freeze: { row: 1 } },
      { name: 'About', rows: [['Exported from the Haematology Rota website. This copy is read-only: make changes in the app and export again.'], [`Dates ${R.fmtUk(from)} to ${R.fmtUk(to)}.`]], widths: [110] }
    ]);
  }

  const api = { oncallTemplate, planTemplate, staffTemplate, parseOncall, parsePlans, parseStaff, matchDoctor, parseDate, rosterWorkbook, FILL };
  root.RotaExcel = api;

})(typeof window !== 'undefined' ? window : globalThis);

<script>

(function () {
  'use strict';

    edt: { doctorId: '', date: '', session: 'AM', reason: '' }, setupTab: 'people', importPreview: null, confirm: null, logQ: '',

  // ---------- helpers ----------
  const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const rangeText = (a, b) => (a === b ? R.fmtShort(a) : `${R.fmtShort(a)} – ${R.fmtShort(b)}`);
  const typeLabel = (r) => (r.type === 'SICK' || r.type === 'UNAVAIL' ? 'Unavailable (sickness)' : r.type === 'OTHER' && r.otherText ? `Other: ${r.otherText}` : (R.LEAVE_TYPES[r.type] || R.LEAVE_TYPES.OTHER).label);

  const statusMark = { ok: '✓', gap: '✕', exception: 'res', risk: '!', na: '–' };
  const reqStatus = { pending: 'Waiting', hold: 'Question asked', authorised: 'Approved', declined: 'Not approved', cancelled: 'Withdrawn' };
  const shortGrade = (d) => (d.group === 'mg' ? d.grade.replace(/^Registrar /, '').replace('Specialty doctor', 'SD').replace('Senior clinical fellow', 'SCF').replace('Specialist grade', 'SG') : d.grade.split(' ')[0]);
  const docsSorted = () => st().doctors.slice().sort((a, b) => (a.group === b.group ? a.name.localeCompare(b.name) : a.group === 'res' ? -1 : 1));
  const docOptions = (sel, filter, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') +
    ['res', 'mg'].map((g) => `<optgroup label="${g === 'res' ? 'Resident doctors' : 'Senior doctors'}">${docsSorted().filter((d) => d.group === g && (!filter || filter(d))).map((d) => `<option value="${d.id}"${d.id === sel ? ' selected' : ''}>${esc(d.name)} (${esc(d.grade)})</option>`).join('')}</optgroup>`).join('');

  function toast(msg, isError) {
    const el = document.createElement('div');

  }
  // Run an authoriser change (on the server when hosted). Returns true when saved.
  async function change(fn, okMsg) {

    } catch (e) { toast(e.message || String(e), true); render(); return false; } finally { ui.busy = false; }
  }
  const op = (name, ...args) => (s, by) => S.ops[name](s, by, ...args);

  function saveFile(filename, bytes) {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));

  // ---------- header ----------
  function navItems() {

  }

      ? `<span>Authoriser: <strong>${esc(store.me)}</strong></span><button type="button" class="btn small-btn" data-act="sign-out">Sign out</button>`

    const bar = [];
    if (store.mode === 'local') bar.push('<strong>Demo mode.</strong> This copy is not connected to the server, so changes stay in this browser. Authoriser sign-in needs no password here.');
    else if (!store.hasPassword) bar.push('<strong>First-time setup:</strong> no authoriser password has been set yet. <button type="button" class="linkish" data-act="open-setup">Set it now</button> before sharing the link.');
    if (st().settings.demo) bar.push(`Showing <strong>example data with fictional doctors</strong>.${isAuth() ? ' To start for real: Set up → Settings → Start fresh.' : ''}`);
    if (store.error) bar.push(`<span style="color:var(--bad-text)">Could not reach the server: ${esc(store.error)}</span>`);
    $('#bar').innerHTML = bar.map((b) => `<div>${b}</div>`).join('');
    $('#bar').hidden = !bar.length;
  }

  // ---------- rota: cells ----------
  function cellSite(cell) {
    if (cell.kind === 'half' || cell.kind === 'edt') return R.siteOf(cell.baseCode) || (R.kindOf(cell.baseCode) === 'lab' ? 'LAB' : 'none');
    return R.siteOf(cell.code);
  }
  function cellCategory(cell) {
    if (cell.kind === 'site' || cell.kind === 'half' || cell.kind === 'edt') return cellSite(cell);
    if (cell.kind === 'leave' || cell.kind === 'sick') return 'leave';
    return cell.kind;
  }
  function describeCell(doc, iso, cell) {
    const parts = [`${doc.name}, ${R.fmtLong(iso)}: ${cell.code || 'nothing rostered'}.`];
    if (cell.source === 'plan') parts.push('From the weekly plan.');
    if (cell.source === 'oncall') parts.push('From the trust on-call rota.');
    if (cell.source === 'override') parts.push(`Changed by an authoriser${cell.note ? ': ' + cell.note : '.'}`);
    if (cell.edt) parts.push(`${cell.edt.type} booked for the ${cell.edt.session === 'AM' ? 'morning' : 'afternoon'}.`);
    if (cell.pending) parts.push('Leave requested, waiting for an authoriser. Not on the rota until approved.');
    if (cell.conflict) parts.push(cell.conflict);
    return parts.join(' ');
  }
  function cellHtml(doc, iso, cell, canEdit) {
    const site = cellSite(cell);
    let label;
    if (cell.kind === 'gone') label = '<span class="small">not in post</span>';
    else if (cell.kind === 'edt') label = `<span>${esc(cell.baseCode)}</span><span class="emb">${esc(cell.edt.type)} ${cell.edt.session}</span>`;
    else if (cell.kind === 'half') label = `<span>${esc(cell.baseCode || 'OFF')}</span><span class="emb leave">${cell.halfOff} leave</span>`;
    else if (cell.kind === 'oncall') label = '⇣ ' + esc(cell.code);
    else if (cell.kind === 'sick') label = 'UNAVAILABLE';
    else label = esc(cell.code);
    if (cell.pending && cell.kind !== 'leave' && cell.kind !== 'sick') label += '<span class="req">leave req.</span>';
    const cls = `cell k-${cell.kind}${site ? ' s-' + site : ''}${cell.pending && cell.kind !== 'leave' && cell.kind !== 'sick' ? ' pending' : ''}`;
    const marks = (cell.source === 'override' ? '<span class="mark override" aria-hidden="true"></span>' : '') + (cell.conflict ? '<span class="mark conflict" aria-hidden="true"></span>' : '');
    const title = esc(describeCell(doc, iso, cell));
    if (canEdit && cell.kind !== 'gone') return `<button type="button" class="${cls}" data-act="edit-cell" data-doc="${doc.id}" data-iso="${iso}" title="${title}" aria-label="${title}">${label}${marks}</button>`;
    return `<span class="${cls}" title="${title}">${label}${marks}</span>`;
  }
  const coverChips = (cover, group) => (cover ? cover.rules.filter((r) => r.rule.group === group)
    .map((r) => `<span class="cv ${r.status}" title="${esc(r.rule.label)}: ${esc(statusWord[r.status])}${r.names.length ? ' (' + esc(r.names.join(', ')) + ')' : ''}">${esc(r.rule.short)} ${statusMark[r.status]}</span>`).join('') : '');

  function rotaRange() {
    if (ui.rotaMode === 'rotation') {
      const rot = st().settings.rotation || {};

  function visibleDoctors(from, to) {

      (!d.start || d.start <= to) && (!d.end || d.end >= R.addDays(from, -28)));
  }

  function renderRota() {
    const { from, to } = rotaRange();
    const dates = R.dateRange(from, to).filter((iso) => !(ui.hideWeekends && R.isWeekend(iso)));

    const changeovers = R.changeoversIn(st(), from, to);
    const counts = { gap: 0, exception: 0, risk: 0 };
    const covers = {};
    for (const iso of dates) {
      covers[iso] = R.coverWithRisk(st(), iso);
      if (covers[iso]) covers[iso].rules.forEach((r) => { if (counts[r.status] !== undefined) counts[r.status]++; });
    }
    const chip = (act, val, cur, label) => `<button type="button" class="chip" data-act="${act}" data-val="${val}" aria-pressed="${cur === val}">${label}</button>`;
    const head = `
    <div class="page-head">
      <div><h1>Rota</h1><p class="muted">${esc(R.fmtLong(from))} to ${esc(R.fmtLong(to))}. ${isAuth() ? 'Click a cell to change it or book EDT/SDT. Every change is logged.' : 'Read-only. Leave shows on the rota only once an authoriser approves it.'}</p></div>
      <div class="row">
        <div class="seg" role="group" aria-label="Range">${chip('rota-mode', 'today', ui.rotaMode, 'From today')}${chip('rota-mode', 'rotation', ui.rotaMode, 'Whole rotation')}</div>
        ${ui.rotaMode === 'today' ? `<button type="button" class="btn icon" data-act="rota-move" data-val="-7" aria-label="Back a week">‹</button>
        <button type="button" class="btn" data-act="rota-today">Today</button>
        <button type="button" class="btn icon" data-act="rota-move" data-val="7" aria-label="Forward a week">›</button>
        <label class="sr-only" for="weeks">Weeks shown</label>
        <select id="weeks" data-act="weeks">${[1, 2, 4, 8].map((w) => `<option value="${w}"${ui.weeks === w ? ' selected' : ''}>${plural(w, 'week')}</option>`).join('')}</select>` : ''}
        <button type="button" class="btn" data-act="export">Download Excel</button>
      </div>
    </div>
    <details class="filters"${ui.filtersOpen === undefined ? (narrow() ? '' : ' open') : ui.filtersOpen ? ' open' : ''}><summary>View and filters${ui.layout === 'list' ? ' · list' : ''}${ui.group !== 'both' ? ' · ' + (ui.group === 'res' ? 'residents' : 'senior doctors') : ''}${ui.hi !== 'all' ? ' · ' + ui.hi : ''}${ui.q ? ' · "' + esc(ui.q) + '"' : ''}</summary>
    <div class="toolbar">

      <div class="group"><span class="label">Highlight</span>${[['all', 'All'], ['GUH', 'GUH'], ['RGH', 'RGH'], ['NHH', 'NHH'], ['leave', 'Leave'], ['oncall', 'On call'], ['edt', 'EDT/SDT']].map(([v, l]) => chip('hi', v, ui.hi, l)).join('')}</div>

  function renderRotaGrid(dates, docs, covers, changeovers) {

        <th class="col-date" scope="row"><span class="tabular">${esc(R.fmtShort(iso))}</span>${restr ? `<span class="restr ${restr.level.replace(' ', '-')}" title="${esc(restr.note || '')}">${esc(restr.level)}</span>` : ''}${bh ? '<span class="restr BH" title="Bank holiday">BH</span>' : ''}</th>
        <td class="cons">${wk ? '' : esc(st().settings.consultantOfWeek[R.mondayOf(iso)] || '')}</td>

  // List view: "GUH: Name (grade), Name (grade)"

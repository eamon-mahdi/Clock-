  // ---------- helpers shared by server and browser ----------
  const docName = (state, id) => (R.doctorById(state, id) || { name: '?' }).name;
  const rangeText = (a, b) => (a === b ? R.fmtShort(a) : `${R.fmtShort(a)} – ${R.fmtShort(b)}`);
  function log(state, by, action, detail) {
    state.audit.unshift({ at: nowIso(), by, action, detail });
    if (state.audit.length > 3000) state.audit.length = 3000;
  }
  function notify(state, to, text) {
    state.notifications.unshift({ id: uid('n'), to, at: nowIso(), text, read: false });
    if (state.notifications.length > 600) state.notifications.length = 600;
  }
  const emailMatches = (doc, email) => {
    const a = String(email || '').trim().toLowerCase();
    return !!a && (!doc.email || doc.email.trim().toLowerCase() === a);
  };
  const authorEmails = (state) => ((state.settings && state.settings.authoriserEmails) || []).filter(Boolean);

  // A doctor (no password) sends a leave request. Returns {request, check, emails}.
  function submitLeave(state, p, opts) {
    const today = (opts && opts.today) || R.toIso(new Date());
    const doc = R.doctorById(state, p.doctorId);
    if (!doc || doc.placeholder) throw new Error('Choose your name from the list.');
    if (!emailMatches(doc, p.email)) throw new Error(doc.email ? 'That NHS email does not match the staff list for your name. Check it, or ask an authoriser to update it.' : 'Enter your NHS email address.');
    if (!R.FORM_LEAVE_TYPES.includes(p.type)) throw new Error('Choose a leave type.');
    if (!R.isIso(p.start) || !R.isIso(p.end) || p.end < p.start) throw new Error('Choose a start date and an end date on or after it.');
    if (R.daysBetween(p.start, p.end) > 92) throw new Error('A single request can cover up to 3 months. Split longer leave into separate requests.');
    if (p.type === 'SL' && !p.intrepid) throw new Error('Study leave must also be requested through Intrepid (or CODI). Tick the box to confirm.');
    if (p.type === 'OTHER' && !String(p.otherText || '').trim()) throw new Error('Describe the type of leave under "Other".');
    const part = p.start === p.end && (p.part === 'AM' || p.part === 'PM') ? p.part : 'FULL';
    const short = p.type === 'AL' && R.shortNotice(state, p.start, today);
    const why = String(p.extenuatingReason || '').trim();
    if (short && (!p.extenuating || why.length < 10)) throw new Error(`Annual leave needs at least ${R.ruleNum(state, 'noticeWeeks')} weeks' notice (trust policy). If there are extenuating circumstances, tick the box and explain them.`);
    const overlap = state.requests.find((r) => r.doctorId === doc.id && ['pending', 'hold', 'authorised'].includes(r.status) && r.start <= p.end && r.end >= p.start);
    if (overlap) throw new Error(`You already have ${overlap.status === 'authorised' ? 'approved' : 'a pending request for'} leave on ${rangeText(overlap.start, overlap.end)}.`);
    const cleanId = (id) => (id && R.doctorById(state, id) && id !== doc.id ? id : '');
    const r = {
      id: uid('lr'), doctorId: doc.id, email: String(p.email).trim(), type: p.type, otherText: String(p.otherText || '').slice(0, 200),
      start: p.start, end: p.end, part, note: String(p.note || '').slice(0, 1000), intrepid: !!p.intrepid, shortNotice: short, extenuatingReason: short ? why.slice(0, 600) : '',
      dayUnitCoverId: cleanId(p.dayUnitCoverId), guhCoverId: cleanId(p.guhCoverId), excludedDates: [],
      submittedAt: nowIso(), days: R.leaveDays(state, p.start, p.end, part), status: p.type === 'SICK' ? 'authorised' : 'pending', cover: []
    };
    const check = R.staffingCheck(state, { doctorId: doc.id, start: r.start, end: r.end, part, dayUnitCoverId: r.dayUnitCoverId, guhCoverId: r.guhCoverId, requestId: r.id });
    r.cover = check.cover;
    r.check = { bad: check.bad, warn: check.warn };
    const label = R.LEAVE_TYPES[r.type].label;
    const when = rangeText(r.start, r.end);
    const emails = [];
    if (r.type === 'SICK') {
      Object.assign(r, { decidedBy: 'Self-reported', decidedAt: nowIso() });
      notify(state, 'auth', `${doc.name} reported sick: ${when}.${check.bad ? ' Not enough doctors on ' + check.bad + ' day(s).' : ''}`);
      log(state, doc.name, 'Sickness reported', `${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}`);
      authorEmails(state).forEach((to) => emails.push({ to, subject: `Sickness reported: ${doc.name}, ${when}`, text: `${doc.name} (${doc.grade}) has reported sick for ${when}.${check.bad ? `\n\nNot enough doctors on ${check.bad} day(s). Please arrange cover.` : ''}\n\nOpen the rota to review cover.` }));
    } else {
      notify(state, 'auth', `New ${label.toLowerCase()} request from ${doc.name}: ${when}.${check.bad ? ' Not enough doctors on ' + check.bad + ' day(s).' : ''}`);
      log(state, doc.name, 'Leave requested', `${label}, ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)} (${r.days} day${r.days === 1 ? '' : 's'})${short ? '; less than the notice period (extenuating circumstances given)' : ''}${check.bad ? `; flagged: not enough doctors on ${check.bad} day(s)` : ''}`);
      authorEmails(state).forEach((to) => emails.push({ to, subject: `${check.bad ? 'Needs a decision (not enough doctors): ' : 'Leave request: '}${doc.name}, ${when}`, text: `${doc.name} (${doc.grade}) asked for ${label.toLowerCase()}: ${when}, ${r.days} working day(s).${short ? `\n\nLess than ${R.ruleNum(state, 'noticeWeeks')} weeks' notice. Extenuating circumstances given: "${why}"` : ''}${check.bad ? `\n\nNot enough doctors on ${check.bad} day(s).` : ''}${check.warn ? `\nWarnings on ${check.warn} day(s).` : ''}\n\nSign in as an authoriser to decide.` }));
      emails.push({ to: r.email, subject: `We've got your leave request: ${when}`, text: `Your ${label.toLowerCase()} request for ${when} has been sent to the rota authorisers. You'll get an email when it's decided. You can check progress under "Check my request".` });
      const covers = new Set(r.cover.map((c) => c.doctorId));
      covers.forEach((id) => { const cd = R.doctorById(state, id); if (cd && cd.email) emails.push({ to: cd.email, subject: `You've been named as cover: ${doc.name}, ${when}`, text: `${doc.name} has named you as cover while on leave (${when}), if the request is approved:\n${r.cover.filter((c) => c.doctorId === id).map((c) => c.text).join('\n')}` }); });
    }
    notify(state, 'd:' + doc.id, r.type === 'SICK' ? `Sickness recorded for ${when}.` : `Request sent: ${label.toLowerCase()} ${when}.`);
    state.requests.push(r);
    return { request: r, check, emails };
  }
  function withdrawLeave(state, id, email) {
    const r = state.requests.find((x) => x.id === id);
    if (!r) throw new Error('Request not found.');
    const doc = R.doctorById(state, r.doctorId);
    if (!emailMatches(doc || {}, email) || String(r.email || '').toLowerCase() !== String(email || '').trim().toLowerCase()) throw new Error('That email does not match the request.');
    if (!['pending', 'hold'].includes(r.status)) throw new Error('Only requests still waiting can be withdrawn.');
    r.status = 'cancelled';
    log(state, doc ? doc.name : '?', 'Leave request withdrawn', `${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}`);
    notify(state, 'auth', `${doc ? doc.name : 'A doctor'} withdrew their request for ${rangeText(r.start, r.end)}.`);
    return r;
  }
  function myRequests(state, doctorId, email) {
    const doc = R.doctorById(state, doctorId);
    if (!doc || !emailMatches(doc, email)) throw new Error('Name and NHS email do not match the staff list.');
    const mail = String(email).trim().toLowerCase();
    const bal = R.balance(state, doc);
    return {
      balance: { al: bal.al, sl: bal.sl, alBasis: R.alProRata(doc).basis, start: doc.start || '', end: doc.end || '' },
      requests: state.requests.filter((r) => r.doctorId === doc.id && (!r.email || r.email.toLowerCase() === mail || doc.email)).sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1)),
      notifications: state.notifications.filter((n) => n.to === 'd:' + doc.id).slice(0, 30)
    };
  }

  // What anyone with the link can see (no emails, notes, reasons, sickness or audit).
  function publicView(state) {
    const s = clone(state);
    s.doctors.forEach((d) => { delete d.email; delete d.alEntitlement; delete d.slEntitlement; delete d.alExtra; delete d.slExtra; delete d.note; });
    s.requests = s.requests.filter((r) => ['pending', 'hold', 'authorised'].includes(r.status)).map((r) => ({
      id: r.id, doctorId: r.doctorId, type: r.type === 'SICK' ? 'UNAVAIL' : (['AL', 'SL'].includes(r.type) ? r.type : 'OTHER'),
      start: r.start, end: r.end, part: r.part, status: r.status, excludedDates: r.excludedDates || [], days: r.days, cover: (r.cover || []).map((c) => ({ date: c.date, doctorId: c.doctorId, to: c.to }))
    }));
    Object.values(s.overrides || {}).forEach((m) => Object.values(m).forEach((o) => { delete o.reason; delete o.by; }));
    s.edt = (s.edt || []).map((e) => ({ id: e.id, doctorId: e.doctorId, date: e.date, session: e.session, type: e.type }));
    s.audit = []; s.notifications = [];
    s.settings.authoriserEmails = [];
    s.public = true;
    return s;
  }

  // ---------- authoriser actions (pure functions on state; return emails to send) ----------
  const ops = {
    setCell(state, by, doctorId, iso, code, reason) {
      const d = R.doctorById(state, doctorId);
      state.overrides[doctorId] = state.overrides[doctorId] || {};
      const before = R.resolveCell(state, d, iso).code || '(blank)';
      if (code) state.overrides[doctorId][iso] = { code: R.canonicalCode(code), reason: reason || '', by, at: nowIso() };
      else delete state.overrides[doctorId][iso];
      log(state, by, 'Roster changed', `${d.name}, ${R.fmtShort(iso)}: ${before} → ${R.resolveCell(state, d, iso).code || '(blank)'}${reason ? ` (${reason})` : ''}`);
      return [];
    },
    // decision: 'approve' | 'approveCovered' | 'approveDays' (opts.days = dates to approve) | 'hold' | 'decline'
    decide(state, by, id, decision, message, opts) {
      opts = opts || {};
      const r = state.requests.find((x) => x.id === id);
      if (!r || !['pending', 'hold'].includes(r.status)) throw new Error('This request has already been decided.');
      const doc = R.doctorById(state, r.doctorId);
      const check = R.staffingCheck(state, { doctorId: r.doctorId, start: r.start, end: r.end, part: r.part, dayUnitCoverId: r.dayUnitCoverId, guhCoverId: r.guhCoverId, requestId: r.id });
      const badDays = check.days.filter((d) => d.status === 'bad').map((d) => d.date);
      const msg = String(message || '').trim();
      const workdays = R.dateRange(r.start, r.end).filter((d) => R.isWorkday(state, d) && R.inPost(doc, d));
      let approveSet = null;
      if (decision === 'approveDays') {
        approveSet = new Set((opts.days || []).filter((d) => workdays.includes(d)));
        if (!approveSet.size) throw new Error('Tick at least one day to approve, or decline the request.');
        if (approveSet.size === workdays.length) decision = 'approve';
      }
      const approvingBad = decision === 'approve' ? badDays : approveSet ? badDays.filter((d) => approveSet.has(d)) : [];
      if (approvingBad.length && !msg) throw new Error(`Not enough doctors on ${approvingBad.map(R.fmtShort).join(', ')}. Give a reason (e.g. "locum booked") to approve ${approvingBad.length === 1 ? 'that day' : 'those days'}, or untick ${approvingBad.length === 1 ? 'it' : 'them'}.`);
      if ((decision === 'decline' || decision === 'hold') && !msg) throw new Error(decision === 'decline' ? 'Give a reason for declining. It is sent to the doctor.' : 'Write the question for the doctor.');
      const label = R.LEAVE_TYPES[r.type].label;
      const when = rangeText(r.start, r.end);
      let subject, text, status;
      if (decision === 'hold') {
        r.status = 'hold'; r.question = msg;
        subject = `Question about your leave request: ${when}`; text = `${by} has a question about your ${label.toLowerCase()} request (${when}):\n\n"${msg}"\n\nPlease reply to the rota authorisers.`;
        status = 'Question sent';
      } else if (decision === 'decline') {
        r.status = 'declined';
        subject = `Leave not approved: ${when}`; text = `Your ${label.toLowerCase()} request (${when}) was not approved by ${by}.\n\nReason: ${msg}`;
        status = 'Leave declined';
      } else {
        if (approveSet) r.excludedDates = workdays.filter((d) => !approveSet.has(d));
        if (decision === 'approveCovered') {
          r.excludedDates = badDays;
          if (!R.dateRange(r.start, r.end).some((d) => R.isWorkday(state, d) && !badDays.includes(d))) throw new Error('No days have enough doctors. Decline, hold or approve all with a reason instead.');
        }
        r.status = 'authorised';
        r.days = R.leaveDays(state, r.start, r.end, r.part, r.excludedDates);
        r.cover = check.cover.filter((c) => !(r.excludedDates || []).includes(c.date));
        for (const c of r.cover) {
          state.overrides[c.doctorId] = state.overrides[c.doctorId] || {};
          state.overrides[c.doctorId][c.date] = { code: c.to, reason: `Covering ${doc.name}'s leave`, by, at: nowIso() };
          notify(state, 'd:' + c.doctorId, `You are covering ${c.to} on ${R.fmtShort(c.date)} for ${doc.name}.`);
        }
        const partial = (r.excludedDates || []).length;
        subject = partial ? `Leave partly approved: ${when}` : `Leave approved: ${when}`;
        text = partial
          ? `Your ${label.toLowerCase()} request (${when}) was partly approved by ${by}.\n\nApproved: ${workdays.filter((d) => !r.excludedDates.includes(d)).map((d) => R.fmtShort(d)).join(', ')}.\nNot approved: ${r.excludedDates.map((d) => R.fmtShort(d)).join(', ')}.${check.alternatives.length ? `\nDays with cover nearby: ${check.alternatives.map((d) => R.fmtShort(d)).join(', ')}.` : ''}${msg ? `\n\n"${msg}"` : ''}`
          : `Your ${label.toLowerCase()} request (${when}) was approved by ${by}.${msg ? `\n\n"${msg}"` : ''}`;
        status = partial ? 'Leave partly approved' : 'Leave approved';
        if (approvingBad.length) r.overrideReason = msg;
      }
      r.decidedBy = by; r.decidedAt = nowIso(); r.message = msg;
      notify(state, 'd:' + r.doctorId, `${status}: ${label.toLowerCase()} ${when}.${msg ? ' "' + msg + '"' : ''}`);
      log(state, by, status, `${doc.name}: ${label}, ${R.fmtUk(r.start)} to ${R.fmtUk(r.end)}${(r.excludedDates || []).length ? `; not approved ${r.excludedDates.map(R.fmtUk).join(', ')}` : ''}${msg ? `; "${msg}"` : ''}`);
      const emails = [];
      const to = r.email || doc.email;
      if (to) emails.push({ to, subject, text });
      if (r.status === 'authorised') new Set(r.cover.map((c) => c.doctorId)).forEach((cid) => { const cd = R.doctorById(state, cid); if (cd && cd.email) emails.push({ to: cd.email, subject: `You're covering for ${doc.name}`, text: r.cover.filter((c) => c.doctorId === cid).map((c) => c.text).join('\n') }); });
      return emails;
    },
    bookEdt(state, by, doctorId, iso, session, reason) {
      const chk = R.edtCheck(state, doctorId, iso, session);
      if (!chk.ok && !String(reason || '').trim()) throw new Error('This session breaks a rule. Give a reason to book it anyway.');
      const doc = R.doctorById(state, doctorId);
      state.edt.push({ id: uid('e'), doctorId, date: iso, session, type: chk.type || R.edtDefault(doc).type, bookedBy: by, reason: reason || '' });
      notify(state, 'd:' + doctorId, `${chk.type || 'EDT'} booked: ${R.fmtShort(iso)} ${session === 'AM' ? 'morning' : 'afternoon'}.`);
      log(state, by, 'EDT/SDT booked', `${doc.name}: ${R.fmtUk(iso)} ${session}${reason ? ` (override: ${reason})` : ''}`);
      return doc.email ? [{ to: doc.email, subject: `${chk.type || 'EDT'} booked: ${R.fmtShort(iso)} ${session}`, text: `${by} booked your ${chk.type || 'EDT'} for ${R.fmtLong(iso)} (${session === 'AM' ? 'morning' : 'afternoon'}).` }] : [];
    },
    removeEdt(state, by, id) {
      const e = state.edt.find((x) => x.id === id);
      state.edt = state.edt.filter((x) => x.id !== id);
      if (e) log(state, by, 'EDT/SDT removed', `${docName(state, e.doctorId)}: ${R.fmtUk(e.date)} ${e.session}`);
      return [];
    },
    saveDoctor(state, by, d) {
      const existing = R.doctorById(state, d.id);
      if (existing) {
        const changes = Object.keys(d).filter((k) => k !== 'id' && JSON.stringify(existing[k]) !== JSON.stringify(d[k]));
        Object.assign(existing, d);
        if (changes.length) log(state, by, 'Doctor updated', `${existing.name}: ${changes.join(', ')}`);
      } else {
        const doc = Object.assign({ id: uid('d'), aliases: [], fte: 1, plan: { A: ['', '', '', '', ''], B: null } }, d);
        if (doc.alEntitlement === undefined || doc.alEntitlement === '') doc.alEntitlement = R.alProRata(doc).days;
        state.doctors.push(doc);
        log(state, by, 'Doctor added', `${doc.name} (${doc.grade})`);
      }
      return [];
    },
    // Put several doctors at one location for a block of dates (only the chosen weekdays, working days, while in post).
    bulkAssign(state, by, ids, from, to, days, code, reason) {
      if (!ids || !ids.length) throw new Error('Tick at least one doctor.');
      if (!R.isIso(from) || !R.isIso(to) || to < from) throw new Error('Choose a start date and an end date on or after it.');
      if (R.daysBetween(from, to) > 400) throw new Error('Choose up to about a year at a time.');
      if (!days || !days.length) throw new Error('Tick at least one weekday.');
      let n = 0;
      for (const id of ids) {
        const d = R.doctorById(state, id);
        if (!d) continue;
        for (const iso of R.dateRange(from, to)) {
          if (!R.isWorkday(state, iso) || !days.includes(R.dow(iso)) || !R.inPost(d, iso)) continue;
          state.overrides[id] = state.overrides[id] || {};
          if (code) state.overrides[id][iso] = { code: R.canonicalCode(code), reason: reason || 'Group change', by, at: nowIso() };
          else delete state.overrides[id][iso];
          n++;
        }
      }
      if (!n) throw new Error('None of those doctors are in post on the chosen days.');
      log(state, by, 'Group change', `${ids.map((id) => docName(state, id)).join(', ')}: ${code || '(usual location)'} on ${n} day${n === 1 ? '' : 's'}, ${R.fmtUk(from)} to ${R.fmtUk(to)}${reason ? ` (${reason})` : ''}`);
      return [];
    },
    // Apply a parsed master workbook: update doctors matched by name, add new ones, set consultants, add restrictions.
    applyMaster(state, by, parsed, fileName) {
      let added = 0, updated = 0;
      const byName = (n) => state.doctors.find((d) => d.name.toLowerCase() === String(n || '').trim().toLowerCase()) || null;
      const missing = [];
      for (const x of parsed.doctors || []) {
        const fields = { name: x.name, grade: x.grade, group: x.group, start: x.start || '', end: x.end || '', endProvisional: !!x.endProvisional, plan: { A: x.plan, B: null }, placeholder: !!x.placeholder };
        if (x.email) fields.email = x.email;
        if (x.alEntitlement !== undefined) fields.alEntitlement = x.alEntitlement;
        if (x.alExtra !== undefined) fields.alExtra = x.alExtra;
        if (x.slEntitlement !== undefined) fields.slEntitlement = x.slEntitlement;
        if (x.aliases && x.aliases.length) fields.aliases = x.aliases;
        if (x.replacesName) { const prev = byName(x.replacesName); if (prev && prev.name.toLowerCase() !== x.name.toLowerCase()) fields.slot = R.slotOf(prev); else if (!prev) missing.push(`${x.name}: "${x.replacesName}" not found, so a new column was used`); }
        const existing = byName(x.name);
        if (existing) {
          if (!x.plan.some(Boolean)) delete fields.plan; // no locations in the file: keep the doctor's usual week
          Object.assign(existing, fields);
          updated++;
        } else {
          const doc = Object.assign({ id: uid('d'), aliases: [], fte: 1, email: '', slEntitlement: x.group === 'mg' ? 10 : 15 }, fields);
          if (doc.alEntitlement === undefined) doc.alEntitlement = R.alProRata(doc).days;
          state.doctors.push(doc); added++;
        }
      }
      const weeks = Object.entries(parsed.consultants || {});
      weeks.forEach(([w, n]) => { state.settings.consultantOfWeek[w] = n; });
      let restr = 0;
      for (const r of parsed.restrictions || []) {
        if (state.settings.restricted.some((x) => x.start === r.start && (x.end || x.start) === r.end && x.level === r.level)) continue;
        state.settings.restricted.push(Object.assign({ id: uid('x') }, r)); restr++;
      }
      let shifts = 0;
      const oc = parsed.oncall;
      if (oc && oc.from && oc.to) {
        const entries = (oc.entries || []).map((e) => Object.assign({}, e, { doctorId: e.doctorId || (parsed.mapping || {})[e.name] || null })).filter((e) => e.doctorId);
        for (const id of Object.keys(state.oncall)) for (const iso of Object.keys(state.oncall[id])) if (iso >= oc.from && iso <= oc.to) delete state.oncall[id][iso];
        for (const e of entries) (state.oncall[e.doctorId] = state.oncall[e.doctorId] || {})[e.date] = e.code;
        for (const [alias, id] of Object.entries(parsed.mapping || {})) { const d = R.doctorById(state, id); if (id && d && !(d.aliases || []).includes(alias)) (d.aliases = d.aliases || []).push(alias); }
        shifts = entries.length;
      }
      // Rota tab: only the cells that were changed. Applied last so it wins over the On-calls tab.
      let cells = 0;
      for (const c of (parsed.rota && parsed.rota.changes) || []) {
        if (!R.doctorById(state, c.doctorId)) continue;
        state.overrides[c.doctorId] = state.overrides[c.doctorId] || {};
        state.oncall[c.doctorId] = state.oncall[c.doctorId] || {};
        if (c.kind === 'oncall') { delete state.overrides[c.doctorId][c.date]; state.oncall[c.doctorId][c.date] = c.code; }
        else { delete state.oncall[c.doctorId][c.date]; state.overrides[c.doctorId][c.date] = { code: c.code, reason: 'Rota tab of the data file', by, at: nowIso() }; }
        cells++;
      }
      log(state, by, 'Rota data file imported', `${fileName || 'file'}: ${parsed.rota ? `${cells} rota cells changed, ` : ''}${added} doctors added, ${updated} updated, ${weeks.length} consultant weeks, ${restr} leave restrictions${oc ? `, ${shifts} on-call shifts (${R.fmtUk(oc.from)} to ${R.fmtUk(oc.to)})` : ''}${missing.length ? '. ' + missing.join('; ') : ''}`);
      return [];
    },
    // Put back an earlier copy of the whole rota (from a backup).
    restoreState(state, by, copy, label) {
      if (!copy || copy.version !== 2 || !Array.isArray(copy.doctors)) throw new Error('That is not a rota backup.');
      const audit = state.audit;
      Object.keys(state).forEach((k) => delete state[k]);
      Object.assign(state, clone(copy));
      upgrade(state);
      state.audit = audit;
      log(state, by, 'Rota restored from a backup', label || '');
      return [];
    },
    copyDoctor(state, by, fromId, fields) {
      const src = R.doctorById(state, fromId);
      if (!src) throw new Error('Choose a doctor to copy.');
      if (!String(fields.name || '').trim()) throw new Error('Type the new doctor\'s name.');
      const doc = { id: uid('d'), name: fields.name.trim(), grade: fields.grade || src.grade, group: src.group, email: fields.email || '', start: fields.start || '', end: fields.end || '',
        fte: src.fte || 1, aliases: [], plan: clone(src.plan || { A: ['', '', '', '', ''], B: null }), edtHours: src.edtHours, slEntitlement: src.slEntitlement };
      doc.alEntitlement = R.alProRata(doc).days;
      state.doctors.push(doc);
      log(state, by, 'Doctor added (copied)', `${doc.name} copied from ${src.name}: grade, group and weekly plan`);
      return [];
    },
    removeDoctor(state, by, id) {
      const d = R.doctorById(state, id);
      state.doctors = state.doctors.filter((x) => x.id !== id);
      log(state, by, 'Doctor removed', d ? d.name : id);
      return [];
    },
    setPlanDay(state, by, doctorId, week, i, code) {
      const d = R.doctorById(state, doctorId);
      d.plan = d.plan || { A: ['', '', '', '', ''], B: null };
      if (week === 'B' && !d.plan.B) d.plan.B = d.plan.A.slice();
      d.plan[week][i] = code;
      log(state, by, 'Weekly plan changed', `${d.name}, week ${week} ${R.DOW_SHORT[i]}: ${code || '(blank)'}`);
      return [];
    },
    toggleWeekB(state, by, doctorId, on) {
      const d = R.doctorById(state, doctorId);
      d.plan.B = on ? d.plan.A.slice() : null;
      if (on) d.plan.anchor = d.plan.anchor || d.start;
      log(state, by, 'Weekly plan changed', `${d.name}: alternate week B ${on ? 'on' : 'off'}`);
      return [];
    },
    applyImport(state, by, kind, payload) {
      if (kind === 'oncall') {
        const { entries, from, to, fileName } = payload;
        for (const id of Object.keys(state.oncall)) for (const iso of Object.keys(state.oncall[id])) if (iso >= from && iso <= to) delete state.oncall[id][iso];
        for (const e of entries) (state.oncall[e.doctorId] = state.oncall[e.doctorId] || {})[e.date] = e.code;
        log(state, by, 'On-call rota imported', `${fileName || 'file'}: ${entries.length} shifts, ${R.fmtUk(from)} to ${R.fmtUk(to)}`);
      } else if (kind === 'plan') {
        for (const p of payload.plans) { const d = R.doctorById(state, p.doctorId); d.plan = { A: p.A, B: p.B, anchor: p.from || (d.plan && d.plan.anchor) || d.start }; }
        log(state, by, 'Weekly plans imported', `${payload.fileName || 'file'}: ${payload.plans.length} doctors`);
      } else if (kind === 'staff') {
        let added = 0, updated = 0;
        for (const s of payload.staff) {
          const existing = state.doctors.find((d) => d.name.toLowerCase() === s.name.toLowerCase());
          if (existing) { Object.assign(existing, s, { id: existing.id, plan: existing.plan }); updated++; } else {
            const doc = Object.assign({ id: uid('d'), fte: 1, plan: { A: ['', '', '', '', ''], B: null } }, s);
            if (!doc.alEntitlement) doc.alEntitlement = R.alProRata(doc).days;
            state.doctors.push(doc); added++;
          }
        }
        log(state, by, 'Staff list imported', `${payload.fileName || 'file'}: ${added} added, ${updated} updated`);
      }
      for (const [alias, doctorId] of Object.entries(payload.newAliases || {})) {
        const d = R.doctorById(state, doctorId);
        if (d && !(d.aliases || []).includes(alias)) (d.aliases = d.aliases || []).push(alias);
      }
      return [];
    },
    setSetting(state, by, path, value, what) {
      const keys = path.split('.');
      let o = state.settings;
      for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]] = o[keys[i]] || {};
      o[keys[keys.length - 1]] = value;
      log(state, by, 'Settings changed', what || `${path}: ${JSON.stringify(value).slice(0, 120)}`);
      return [];
    },
    addRestricted(state, by, start, end, level, note) {
      if (!R.isIso(start) || (end && end < start)) throw new Error('Choose a start date and an end date on or after it.');
      state.settings.restricted.push({ id: uid('x'), start, end: end || start, level, note: note || '' });
      log(state, by, 'Leave restriction added', `${level}: ${R.fmtUk(start)} to ${R.fmtUk(end || start)}`);
      return [];
    },
    removeRestricted(state, by, id) {
      state.settings.restricted = state.settings.restricted.filter((r) => r.id !== id);
      log(state, by, 'Leave restriction removed', id);
      return [];
    },
    addChangeover(state, by, date, label) {
      if (!R.isIso(date) || !String(label || '').trim()) throw new Error('Give a date and a description for the changeover.');
      state.settings.changeovers.push({ id: uid('c'), date, label: label.trim() });
      log(state, by, 'Changeover added', `${R.fmtUk(date)}: ${label}`);
      return [];
    },
    removeChangeover(state, by, id) {
      state.settings.changeovers = state.settings.changeovers.filter((c) => c.id !== id);
      log(state, by, 'Changeover removed', id);
      return [];
    },
    startFresh(state, by) {
      const keep = { authorisers: state.settings.authorisers, authoriserEmails: state.settings.authoriserEmails, rulesText: state.settings.rulesText, rules: state.settings.rules };
      const fresh = emptyState();
      Object.assign(fresh.settings, keep);
      Object.keys(state).forEach((k) => delete state[k]);
      Object.assign(state, fresh);
      log(state, by, 'Started fresh', 'Demo data removed. Rules, authorisers and alert emails kept.');
      return [];
    }
  };

  // ---------- the store used by the screens ----------
  function createStore(opts) {
    opts = opts || {};
    const listeners = [];
    const emit = () => listeners.forEach((fn) => fn());
    const store = { mode: 'local', state: null, version: 0, me: null, hasPassword: true, emailOn: false, error: null };
    const storage = opts.storage !== undefined ? opts.storage : (() => {
      try { const ls = root.localStorage; return ls ? { get: (k) => { try { return ls.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { ls.setItem(k, v); } catch (e) { /* blocked */ } } } : null; } catch (e) { return null; }
    })();

    async function api(method, path, body) {
      const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', cache: 'no-store' });
      let data = null;
      try { data = await res.json(); } catch (e) { /* not json */ }
      if (!res.ok) { const err = new Error((data && data.error) || `The server replied ${res.status}.`); err.status = res.status; err.data = data; throw err; }
      return data;
    }
    function loadLocal() {
      let s = null;
      if (storage) { try { const raw = storage.get(LOCAL_KEY); s = raw ? JSON.parse(raw) : null; } catch (e) { s = null; } }
      store.state = s && s.version === 2 ? upgrade(s) : demoState(opts.today);
      const who = storage && storage.get(LOCAL_KEY + '-me');
      store.me = who || null;
    }
    const saveLocal = () => { if (storage) storage.set(LOCAL_KEY, JSON.stringify(store.state)); };

    Object.assign(store, {
      subscribe(fn) { listeners.push(fn); },
      isAuth() { return !!store.me; },
      async init() {
        if (opts.forceLocal) { loadLocal(); emit(); return; }
        try {
          const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          const t = ctrl ? setTimeout(() => ctrl.abort(), 6000) : null;
          const res = await fetch('/api/state', { cache: 'no-store', credentials: 'same-origin', signal: ctrl ? ctrl.signal : undefined });
          if (t) clearTimeout(t);
          const data = await res.json();
          if (!res.ok || !data || data.mode !== 'server') throw new Error('no server');
          store.mode = 'remote';
          applyServer(data);
        } catch (e) { store.mode = 'local'; loadLocal(); }
        emit();
      },
      async refresh(force) {
        if (store.mode !== 'remote') return;
        const before = store.version + '|' + store.me;
        try { applyServer(await api('GET', '/api/state')); store.error = null; } catch (e) { store.error = e.message; }
        if (force || before !== store.version + '|' + store.me) emit();
      },
      async login(name, password) {
        if (store.mode === 'local') { store.me = name; if (storage) storage.set(LOCAL_KEY + '-me', name); emit(); return; }
        await api('POST', '/api/login', { name, password });
        await store.refresh(true);
      },
      async logout() {
        if (store.mode === 'local') { store.me = null; if (storage) storage.set(LOCAL_KEY + '-me', ''); emit(); return; }
        await api('POST', '/api/logout');
        store.me = null;
        await store.refresh(true);
      },
      async setupPassword(password, setupCode, names) {
        await api('POST', '/api/setup', { password, setupCode, names });
        await store.refresh(true);
      },
      async changePassword(current, next) {
        if (store.mode === 'local') throw new Error('Passwords only apply on the hosted version.');
        await api('POST', '/api/password', { current, next });
        store.me = null;
        await store.refresh(true);
      },
      async submitLeave(payload) {
        if (store.mode === 'local') { const out = submitLeave(store.state, payload); saveLocal(); emit(); return { request: out.request, check: out.check, emailed: false }; }
        const out = await api('POST', '/api/requests', payload);
        await store.refresh();
        return out;
      },
      async withdraw(id, email) {
        if (store.mode === 'local') { withdrawLeave(store.state, id, email); saveLocal(); emit(); return; }
        await api('POST', `/api/requests/${encodeURIComponent(id)}/withdraw`, { email });
        await store.refresh();
      },
      async listBackups() {
        if (store.mode === 'local') return { backups: [], local: true };
        return api('GET', '/api/backups');
      },
      async getBackup(id) { return api('GET', `/api/backups/${encodeURIComponent(id)}`); },
      async getCsvBackup(id) {
        const res = await fetch(`/api/csv-backups/${encodeURIComponent(id)}`, { credentials: 'same-origin', cache: 'no-store' });
        if (!res.ok) { let m = `The server replied ${res.status}.`; try { m = (await res.json()).error || m; } catch (e) { /* not json */ } throw new Error(m); }
        return new Uint8Array(await res.arrayBuffer());
      },
      async myRequests(doctorId, email) {
        if (store.mode === 'local') return myRequests(store.state, doctorId, email);
        return api('POST', '/api/my-requests', { doctorId, email });
      },
      // Authoriser change: run fn on the state, then save. On a clash with another authoriser, reload and redo once.
      async act(fn) {
        if (!store.me) throw new Error('Sign in as an authoriser to make changes.');
        if (store.mode === 'local') { const emails = fn(store.state, store.me) || []; saveLocal(); emit(); return { emails, sent: 0 }; }
        for (let attempt = 0; attempt < 2; attempt++) {
          const draft = clone(store.state);
          const emails = fn(draft, store.me) || [];
          try {
            const out = await api('PUT', '/api/state', { baseVersion: store.version, state: draft, emails });
            store.state = draft; store.version = out.version; emit();
            return { emails, sent: out.sent || 0 };
          } catch (e) {
            if (e.status === 409 && attempt === 0) { applyServer(e.data); continue; }
            if (e.status === 401) { store.me = null; emit(); }
            throw e;
          }
        }
        return { emails: [], sent: 0 };
      },
      resetLocalDemo() { store.state = demoState(opts.today); saveLocal(); emit(); }
    });
    function applyServer(data) {
      store.state = upgrade(data.state); store.version = data.version; store.me = data.me || null;
      store.hasPassword = data.hasPassword !== false; store.emailOn = !!data.emailOn; store.setupCodeRequired = !!data.setupCodeRequired;
    }
    return store;
  }

  function restrictionOn(state, iso) {
    return ((state.settings && state.settings.restricted) || []).find((r) => iso >= r.start && iso <= (r.end || r.start)) || null;
  }

  const api = { createStore, demoState, emptyState, upgrade, submitLeave, withdrawLeave, myRequests, publicView, ops, restrictionOn, DEFAULT_RULES_TEXT, LOCAL_KEY };
  root.RotaStore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Import templates, import parsing (with name matching) and the roster export,
 * all built on RotaXlsx. The template layouts here are the agreed import formats. */
(function (root) {
  'use strict';
  const R = root.RotaRules || (typeof require !== 'undefined' ? require('./rules.js') : null);
  const X = root.RotaXlsx || (typeof require !== 'undefined' ? require('./xlsx.js') : null);
  const S = root.RotaStore || (typeof require !== 'undefined' ? require('./store.js') : null);

  // ---------- colours (match the department's Excel) ----------
  const FILL = { GUH: 'F28B82', RGH: '6FB1EA', NHH: '93C47D', LEAVE: 'FFE36E', ONCALL: 'FFE36E', LAB: 'F4CCCC', HEAD: 'D9E1EA', WEEKEND: '262626', GONE: '595959', OFF: 'FFFFFF', PENDING: 'FFF2B3', SICK: 'FFE36E' };
  const head = (v) => ({ v, style: { bold: true, fill: FILL.HEAD, border: true, center: true, wrap: true } });
  const note = (v) => ({ v, style: { color: '595959', wrap: true } });

  function fillFor(cell) {
    switch (cell.kind) {
      case 'site': return FILL[R.siteOf(cell.code)];
      case 'half': return FILL[R.siteOf(cell.baseCode)] || FILL.LEAVE;
      case 'lab': return FILL.LAB;
      case 'leave': return FILL.LEAVE;
      case 'sick': return FILL.SICK;
      case 'oncall': return FILL.ONCALL;
      case 'other': return FILL.ONCALL;
      case 'edt': return FILL[R.siteOf(cell.baseCode)] || FILL.LAB;
      case 'gone': return FILL.GONE;
      case 'off': return FILL.OFF;
      default: return null;
    }
  }

  // ---------- templates ----------
  const ONCALL_HELP = [
    'How to fill in the on-call import',
    '',
    'Use either sheet. "On-call (list)" has one row per shift. "On-call (grid)" has dates down the side and doctors across the top, like the roster.',
    'Dates: dd/mm/yyyy. Doctor: the name as it appears in the trust rota. The rota coordinator matches any new spelling once and it is remembered.',
    'Shift: one of the codes on the "Shift codes" sheet. Leave a cell blank when a doctor has no on-call that day.',
    'Importing replaces earlier imported on-calls for the dates covered by the file, so you can re-import a corrected week safely.',
    'On-call shifts override the weekly plan for that day. Leave authorised in the rota app is not changed by an import; any clash is highlighted.'
  ];
  const CODE_MEANINGS = {
    'LONG DAY': 'Long day on call', NIGHTS: 'Night shift', TWILIGHT: 'Twilight shift', 'EARLY TWILIGHT': 'Early twilight shift',
    'WARD COVER': 'Weekend / ward cover', 'W/E SD': 'Weekend short day', 'FLEXIBLE W/C': 'Flexible ward cover',
    'OFF PRE ON-CALL': 'Rest day before on-call', 'POST NIGHTS': 'Rest day after nights',
    GUH: 'Grange (inpatient)', 'GUH LAB': 'Lab (does not count as ward or day-unit cover)', RGH: 'RGH (counts as RGH day unit)',
    'RGH - DAY UNIT': 'RGH day unit', 'RGH MDCU': 'RGH MDCU (counts as RGH day unit)', NHH: 'NHH (counts as NHH day unit)',
    'NHH - DAY UNIT': 'NHH day unit', OFF: 'Rostered day off', TEACHING: 'Teaching', 'SpR TRAINING DAY': 'SpR training day'
  };

  function oncallTemplate(todayIso) {
    const mon = R.addDays(R.mondayOf(todayIso), 7);
    const d = (n) => ({ v: R.addDays(mon, n), date: true });
    const list = [
      [head('Date'), head('Doctor'), head('Shift'), head('Notes (optional)')],
      [d(0), 'E. Ward', 'NIGHTS', ''], [d(1), 'E. Ward', 'NIGHTS', ''], [d(2), 'E. Ward', 'NIGHTS', ''], [d(3), 'E. Ward', 'NIGHTS', ''], [d(4), 'E. Ward', 'POST NIGHTS', ''],
      [d(1), 'S. Malik', 'TWILIGHT', ''], [d(4), 'T. Hughes', 'OFF PRE ON-CALL', ''], [d(5), 'T. Hughes', 'LONG DAY', ''], [d(6), 'T. Hughes', 'LONG DAY', ''],
      [d(5), 'L. Osei', 'WARD COVER', 'Example row: delete the examples before importing']
    ];
    const names = ['E. Ward', 'P. Nair', 'T. Hughes', 'S. Malik', 'B. Carter', 'L. Osei'];
    const grid = [[head('Date'), head('Day')].concat(names.map(head))];
    for (let i = 0; i < 7; i++) {
      const iso = R.addDays(mon, i);
      const row = [{ v: iso, date: true }, R.DOW_LONG[i]].concat(names.map(() => ''));
      if (i < 4) row[2] = 'NIGHTS';
      if (i === 4) row[2] = 'POST NIGHTS';
      if (i === 1) row[5] = 'TWILIGHT';
      if (i >= 5) row[4] = 'LONG DAY';
      grid.push(row);
    }
    const codes = [[head('Shift code'), head('Meaning')]].concat(R.ONCALL_CODES.map((c) => [c, CODE_MEANINGS[c] || '']));
    return X.write([
      { name: 'On-call (list)', rows: list, widths: [14, 22, 20, 44], freeze: { row: 1 } },
      { name: 'On-call (grid)', rows: grid, widths: [14, 12].concat(names.map(() => 16)), freeze: { row: 1, col: 2 } },
      { name: 'Shift codes', rows: codes, widths: [20, 40] },
      { name: 'How to fill this in', rows: ONCALL_HELP.map((t, i) => [i === 0 ? { v: t, style: { bold: true, size: 12 } } : note(t)]), widths: [120] }
    ]);
  }

  function planTemplate(state) {
    const rows = [[head('Doctor'), head('Week (A or B)'), head('Mon'), head('Tue'), head('Wed'), head('Thu'), head('Fri'), head('Applies from (optional)')]];
    for (const d of state.doctors) {
      if (d.end && d.end < R.toIso(new Date())) continue;
      rows.push([d.name, 'A'].concat((d.plan && d.plan.A) || ['', '', '', '', '']).concat(['']));
      if (d.plan && d.plan.B) rows.push([d.name, 'B'].concat(d.plan.B).concat(['']));
    }
    const codes = [[head('Site code'), head('Meaning')]].concat(R.SITE_CODES.map((c) => [c, CODE_MEANINGS[c] || '']));
    const help = [
      'How to fill in the weekly plan',
      '',
      'One row per doctor with their usual place on each weekday. Use the codes on the "Site codes" sheet.',
      'Alternating weeks: add a second row for the same doctor with Week = B. Week A starts on the "Applies from" date (or the doctor\'s start date).',
      'On-calls imported from the trust rota and authorised leave sit on top of this plan, so do not enter them here.'
    ];
    return X.write([
      { name: 'Weekly plan', rows, widths: [22, 14, 18, 18, 18, 18, 18, 22], freeze: { row: 1, col: 1 } },
      { name: 'Site codes', rows: codes, widths: [20, 50] },
      { name: 'How to fill this in', rows: help.map((t, i) => [i === 0 ? { v: t, style: { bold: true, size: 12 } } : note(t)]), widths: [120] }
    ]);
  }

  function staffTemplate(state) {
    const rows = [[head('Name'), head('Grade'), head('Group (Resident or Senior doctor)'), head('Email'), head('In post from'), head('In post to'), head('Annual leave days'), head('Study leave days'), head('Other spellings in the on-call sheet (comma separated)')]];
    for (const d of state.doctors) {
      rows.push([d.name, d.grade, d.group === 'mg' ? 'Senior doctor' : 'Resident', d.email || '', d.start ? { v: d.start, date: true } : '', d.end ? { v: d.end, date: true } : '', d.alEntitlement, d.slEntitlement, (d.aliases || []).join(', ')]);
    }
    return X.write([{ name: 'Staff', rows, widths: [20, 18, 18, 30, 14, 14, 12, 12, 40], freeze: { row: 1, col: 1 } }]);
  }

  // ---------- import parsing ----------
  function cellText(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'object' && v.date) return v.date;
    return String(v).trim();
  }
  function parseDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'object' && v.date) return v.date;
    if (typeof v === 'number' && v > 20000 && v < 80000) return X.serialToIso(v);
    const s = String(v).trim();
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/.exec(s);
    if (m) {
      const y = m[3].length === 2 ? '20' + m[3] : m[3];
      const iso = `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      return isNaN(R.toDate(iso)) ? null : iso;
    }
    return null;
  }
  const tokens = (s) => String(s).toLowerCase().replace(/\(.*?\)/g, ' ').replace(/\bdr\b\.?/g, ' ').split(/[^a-z']+/).filter(Boolean);

  // Match a name from a file to a doctor: exact, known alias, or surname + initial.
  function matchDoctor(state, raw) {
    const name = String(raw || '').trim();
    if (!name) return null;
    const low = name.toLowerCase();
    let hit = state.doctors.find((d) => d.name.toLowerCase() === low || (d.aliases || []).some((a) => a.toLowerCase() === low));
    if (hit) return hit;
    const t = tokens(name);
    const cands = state.doctors.filter((d) => {
      const dt = tokens(d.name);
      return dt.length && dt.every((x) => (x.length === 1 ? t.some((y) => y[0] === x) : t.includes(x)));
    });
    return cands.length === 1 ? cands[0] : null;
  }

  function findHeaderRow(rows) {
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      if ((rows[i] || []).some((v) => /^date$/i.test(cellText(v)) || /^doctor$|^name$/i.test(cellText(v)))) return i;
    }
    return 0;
  }

  // Returns {entries, unknownNames:{raw:count}, badCodes:[...], badDates:n, from, to, format}
  function parseOncall(state, sheets) {
    const sheet = sheets.find((s) => /on-?call/i.test(s.name) && s.rows.some((r) => r && r.some((v) => v !== null && v !== undefined && v !== ''))) || sheets[0];
    const rows = sheet.rows;
    const h = findHeaderRow(rows);
    const header = (rows[h] || []).map((v) => cellText(v).toLowerCase());
    const iDate = header.findIndex((x) => x.startsWith('date'));
    const iDoc = header.findIndex((x) => x === 'doctor' || x === 'name');
    const iShift = header.findIndex((x) => x.startsWith('shift') || x === 'code');
    const raw = [];
    let format;
    if (iDoc >= 0 && iShift >= 0) {
      format = 'list';
      for (let r = h + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        if (!row.some((v) => cellText(v))) continue;
        raw.push({ row: r + 1, date: row[iDate], name: cellText(row[iDoc]), code: cellText(row[iShift]) });
      }
    } else {
      format = 'grid';
      const skip = /^(date|day|consultant|notes?|column\d*|leave restriction)$/;
      const cols = header.map((x, i) => ({ i, name: cellText((rows[h] || [])[i]) })).filter((c) => c.name && !skip.test(c.name.toLowerCase()) && c.i !== iDate);
      for (let r = h + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        for (const c of cols) {
          const code = cellText(row[c.i]);
          if (code) raw.push({ row: r + 1, date: row[iDate < 0 ? 0 : iDate], name: c.name.replace(/\s*\n\s*/g, ' '), code });
        }
      }
    }
    const entries = [], unknownNames = {}, badCodes = [], skipped = [];
    let badDates = 0;
    for (const x of raw) {
      const date = parseDate(x.date);
      if (!date) { badDates++; continue; }
      const code = R.canonicalCode(x.code);
      const kind = R.kindOf(code);
      if (kind === 'other' || kind === 'none') { badCodes.push({ row: x.row, code: x.code }); continue; }
      if (kind !== 'oncall' && kind !== 'off' && kind !== 'leave') { skipped.push({ row: x.row, code: x.code }); continue; }
      const doc = matchDoctor(state, x.name);
      if (!doc) { unknownNames[x.name] = (unknownNames[x.name] || 0) + 1; entries.push({ name: x.name, date, code }); continue; }
      entries.push({ doctorId: doc.id, name: x.name, date, code });
    }
    const dates = entries.map((e) => e.date).sort();
    return { format, sheet: sheet.name, entries, unknownNames, badCodes, skipped, badDates, from: dates[0] || null, to: dates[dates.length - 1] || null };
  }

  function parsePlans(state, sheets) {
    const sheet = sheets.find((s) => /plan/i.test(s.name)) || sheets[0];
    const rows = sheet.rows;
    const h = findHeaderRow(rows);
    const header = (rows[h] || []).map((v) => cellText(v).toLowerCase());
    const idx = (re) => header.findIndex((x) => re.test(x));
    const iDoc = idx(/^(doctor|name)/), iWeek = idx(/^week/), iFrom = idx(/^applies|^from/);
    const iDays = ['mon', 'tue', 'wed', 'thu', 'fri'].map((d) => idx(new RegExp('^' + d)));
    const byDoc = {}, unknownNames = {}, badCodes = [];
    for (let r = h + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const name = cellText(row[iDoc]);
      if (!name) continue;
      const codes = iDays.map((i) => (i >= 0 ? R.canonicalCode(cellText(row[i])) : ''));
      codes.forEach((c) => { if (c && !['site', 'lab', 'off', 'leave'].includes(R.kindOf(c))) badCodes.push({ row: r + 1, code: c }); });
      const doc = matchDoctor(state, name);
      const key = doc ? doc.id : 'name:' + name;
      if (!doc) unknownNames[name] = (unknownNames[name] || 0) + 1;
      byDoc[key] = byDoc[key] || { doctorId: doc ? doc.id : null, name, A: null, B: null, from: null };
      const week = /b/i.test(cellText(row[iWeek])) ? 'B' : 'A';
      byDoc[key][week] = codes;
      const from = parseDate(row[iFrom]);
      if (from) byDoc[key].from = from;
    }
    const plans = Object.values(byDoc).map((p) => Object.assign(p, { A: p.A || ['', '', '', '', ''] }));
    return { plans, unknownNames, badCodes };
  }

  function parseStaff(state, sheets) {
    const rows = sheets[0].rows;
    const h = findHeaderRow(rows);
    const header = (rows[h] || []).map((v) => cellText(v).toLowerCase());
    const idx = (re) => header.findIndex((x) => re.test(x));
    const c = { name: idx(/^name/), grade: idx(/^grade/), group: idx(/^group/), email: idx(/^email/), from: idx(/from/), to: idx(/post to|^to/), al: idx(/annual/), sl: idx(/study/), alias: idx(/spelling|alias/) };
    const staff = [], problems = [];
    for (let r = h + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const name = cellText(row[c.name]);
      if (!name) continue;
      const groupTxt = cellText(row[c.group]).toLowerCase();
      const grade = cellText(row[c.grade]);
      const group = /senior|middle|registrar|spr|sas|mg|specialty|specialist|\bst[3-9]/.test(groupTxt + ' ' + grade.toLowerCase()) && !/resident/.test(groupTxt) ? 'mg' : 'res';
      const num = (v) => { const n = Number(cellText(v)); return isFinite(n) ? n : 0; };
      staff.push({
        name, grade, group, email: cellText(row[c.email]), start: parseDate(row[c.from]) || '', end: parseDate(row[c.to]) || '',
        alEntitlement: num(row[c.al]), slEntitlement: num(row[c.sl]),
        aliases: cellText(row[c.alias]).split(',').map((s) => s.trim()).filter(Boolean)
      });
      if (!grade) problems.push(`Row ${r + 1}: no grade for ${name}`);
    }
    return { staff, problems };
  }


  // ---------- master workbook (doctors + consultant of the week + leave restrictions) ----------
  const MASTER_COLS = ['Name', 'Grade', 'Category (Resident or Senior)', 'Starts', 'Finishes', 'Finish date confirmed (Yes/No)', 'Takes over the column of (name)', 'NHS email', 'Annual leave days', 'Carried over / extra days', 'Study leave days', 'Other spellings (comma separated)'];
  const MASTER_HELP = [
    'How to fill in the rota master workbook',
    '',
    'This one file sets up the rota. Fill in the tabs you need and upload it under Set up → Data file. You can import it again at any time: doctors are matched by name and updated, new ones are added. Nobody is deleted by an import.',
    '',

    '  • Only cells you change are imported. Blank cells, leave and NOT IN POST are left as they are: leave is added through leave requests, and to clear a day type OFF.',

    '  • Annual leave days: left blank, the Wales default for the grade and time in post is used. Carried over / extra: accrued or carried-over days.',
    '',

    '',
    'This one file is also the backup: Set up → Backups downloads the same file with extra read-only tabs (leave, changes, EDT/SDT, change log).',
    'CSV files cannot have tabs, so a CSV holds one tab only (for example the Rota tab or the Doctors tab). The Excel file is the one file that holds everything.'
  ];
  const yesNo = (b) => (b ? 'Yes' : 'No');
  function doctorRows(state) {
    const rows = [MASTER_COLS.map(head)];
    const cols = R.columns(state, '1900-01-01', '2999-12-31');
    const order = [];
    for (const g of ['res', 'mg']) for (const c of cols) if (c.docs[0].group === g) order.push(...c.docs);
    for (const d of order) {
      const prev = R.predecessorOf(state, d);
      rows.push([d.name, d.grade, d.group === 'mg' ? 'Senior' : 'Resident', d.start ? { v: d.start, date: true } : '', d.end ? { v: d.end, date: true } : '',
        d.end ? yesNo(!d.endProvisional) : '', prev ? prev.name : ''].concat([d.email || '', d.alEntitlement === undefined ? '' : d.alEntitlement, d.alExtra || '', d.slEntitlement === undefined ? '' : d.slEntitlement, (d.aliases || []).join(', ')]));
    }
    return rows;
  }
  function consultantRows(state, todayIso) {
    const map = (state.settings && state.settings.consultantOfWeek) || {};
    const rows = [[head('Week commencing (Monday)'), head('Consultant')]];
    const keys = Object.keys(map).sort();
    let w = R.mondayOf((state.settings && state.settings.rotation && state.settings.rotation.start) || todayIso);
    if (keys.length && keys[0] < w) w = keys[0];
    let last = R.addDays(R.mondayOf(todayIso), 7 * 26);
    if (keys.length && keys[keys.length - 1] > last) last = keys[keys.length - 1];
    for (; w <= last; w = R.addDays(w, 7)) rows.push([{ v: w, date: true }, map[w] || '']);
    return rows;
  }
  function oncallRows(state, fromIso) {
    const docName = (id) => (R.doctorById(state, id) || { name: id }).name;
    const list = [];
    Object.entries(state.oncall || {}).forEach(([id, m]) => Object.entries(m).forEach(([d, code]) => { if (!fromIso || d >= fromIso) list.push([d, docName(id), code]); }));
    list.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : 1));
    return [[head('Date'), head('Doctor'), head('Shift')]].concat(list.map(([d, n, c]) => [{ v: d, date: true }, n, c]));
  }
  function restrictionRows(state) {
    return [[head('From'), head('To'), head('Level (NO AL or AVOID)'), head('Note')]].concat(((state.settings && state.settings.restricted) || []).slice().sort((a, b) => (a.start < b.start ? -1 : 1))
      .map((r) => [{ v: r.start, date: true }, { v: r.end || r.start, date: true }, r.level, r.note || '']));
  }
  function rotationRows(todayIso, years) {
    const rows = [[head('Programme'), head('Rotation starts'), head('Day before the next start'), head('Rule')]];
    const from = R.addMonths(todayIso, -6);
    for (const [k, p] of Object.entries(R.PROGRAMMES)) {
      const starts = R.programmeStarts(k, from, (years || 5) * p.months.length + 1);
      for (let i = 0; i < starts.length - 1; i++) rows.push([p.label, { v: starts[i], date: true }, { v: R.addDays(starts[i + 1], -1), date: true }, i === 0 ? p.note : '']);
    }
    return rows;
  }
  function codesRows() {
    const rows = [[head('Location code (Rota tab)'), head('Meaning')]].concat(R.SITE_CODES.map((c) => [c, CODE_MEANINGS[c] || '']));
    rows.push(['', ''], [head('On-call shift code (Rota or On-calls tab)'), head('Meaning')]);
    R.ONCALL_CODES.forEach((c) => rows.push([c, CODE_MEANINGS[c] || '']));
    rows.push(['', ''], [head('Grades'), head('Category')]);
    ['F1', 'F2', 'IMT1', 'IMT2', 'IMT3', 'JCF'].forEach((g) => rows.push([g, 'Resident']));
    ['Registrar ST3', 'Registrar ST4', 'Registrar ST5', 'Registrar ST6', 'Registrar ST7', 'Registrar ST8', 'Specialty doctor', 'Specialist grade', 'Senior clinical fellow'].forEach((g) => rows.push([g, 'Senior']));
    return rows;
  }
  const helpSheet = (lines) => ({ name: 'How to use', rows: lines.map((t, i) => [i === 0 ? { v: t, style: { bold: true, size: 12 } } : note(t)]), widths: [130] });
  const MASTER_WIDTHS = [20, 20, 14, 13, 13, 13, 22, 30, 10, 10, 10, 30];

  // ---------- Rota tab: the whole rota as a grid, like the rota view ----------
  const rotaRange = (state, todayIso) => ({ from: R.addDays(todayIso, -14), to: R.addMonths(todayIso, 6) < R.rotaHorizon(state, todayIso) ? R.addMonths(todayIso, 6) : R.rotaHorizon(state, todayIso) });
  const colHead = (d) => `${d.grade}\n${d.name}`;
  function rotaRows(state, from, to) {
    const cols = [];
    for (const g of ['res', 'mg']) for (const c of R.columns(state, from, to)) if (c.group === g) cols.push(c);
    const base = { border: true, center: true, wrap: true };
    const rows = [[head('Date'), head('Day'), head('Consultant')].concat(cols.map((c) => head(colHead(R.holderOn(c, from)))))];
    let prev = null;
    for (const iso of R.dateRange(from, to)) {
      const holders = cols.map((c) => R.holderOn(c, iso));
      if (prev && holders.some((d, i) => d !== prev[i] && R.inPost(d, iso))) {
        rows.push([{ v: 'Changeover', style: Object.assign({ bold: true, fill: FILL.HEAD }, base) }, { v: R.fmtUk(iso), style: Object.assign({ fill: FILL.HEAD }, base) }, { v: '', style: { fill: FILL.HEAD } }]
          .concat(holders.map((d, i) => ({ v: colHead(d), style: Object.assign({ bold: d !== prev[i], fill: FILL.HEAD }, base) }))));
      }
      prev = holders;
      const wk = R.isWeekend(iso);
      const dark = wk ? { fill: FILL.WEEKEND, color: 'FFFFFF' } : {};
      const row = [{ v: iso, date: true, style: Object.assign({}, base, dark) }, { v: R.DOW_SHORT[R.dow(iso)], style: Object.assign({}, base, dark) },
        { v: wk ? '' : ((state.settings.consultantOfWeek || {})[R.mondayOf(iso)] || ''), style: Object.assign({}, base, dark) }];
      for (const d of holders) {
        const cell = R.resolveCell(state, d, iso);
        const fill = fillFor(cell) || (wk ? FILL.WEEKEND : null);
        row.push({ v: cell.code, style: Object.assign({}, base, fill ? { fill } : {}, cell.kind === 'gone' || (wk && !fill) ? { color: 'FFFFFF' } : {}) });
      }
      rows.push(row);
    }
    return { rows, widths: [12, 6, 14].concat(cols.map(() => 15)) };
  }
  function rotaSheet(state, todayIso) {
    const r = rotaRange(state, todayIso);
    const x = rotaRows(state, r.from, r.to);
    return { name: 'Rota', rows: x.rows, widths: x.widths, freeze: { row: 1, col: 2 }, heights: { 0: 42 } };
  }
  const rotaCsv = (state, todayIso) => { const r = rotaRange(state, todayIso); return toCsv(rotaRows(state, r.from, r.to).rows.map((row) => row.map((v) => (v && typeof v.v === 'string' ? Object.assign({}, v, { v: v.v.replace(/\n/g, ' ') }) : v)))); };

  // Reads a Rota tab. Only cells that differ from the rota now are returned. Leave, NOT IN POST and blanks are left alone.
  function parseRota(state, sh, h, colIndex) {
    const out = { from: '', to: '', changes: [], ignored: [], unmatched: [], columns: 0 };
    const all = R.columns(state, '1900-01-01', '2999-12-31');
    const named = [];
    for (const c of all) for (const d of c.docs) named.push({ name: d.name.toLowerCase(), col: c });
    named.sort((a, b) => b.name.length - a.name.length);
    const header = sh.rows[h] || [];
    const map = [];
    header.forEach((v, i) => {
      if (i === colIndex.date || i === colIndex.day || i === colIndex.cons) return;
      const t = cellText(v).toLowerCase();
      if (!t) return;
      const hit = named.find((n) => t.includes(n.name));
      if (hit) { map.push({ i, col: hit.col }); out.columns++; } else out.unmatched.push(cellText(v).replace(/\s+/g, ' '));
    });
    for (let r = h + 1; r < sh.rows.length; r++) {
      const row = sh.rows[r] || [];
      const iso = parseDate(row[colIndex.date]);
      if (!iso) continue;
      if (!out.from || iso < out.from) out.from = iso;
      if (!out.to || iso > out.to) out.to = iso;
      for (const { i, col } of map) {
        const raw = cellText(row[i]);
        if (!raw) continue;
        const doc = R.holderOn(col, iso);
        if (!R.inPost(doc, iso)) continue;
        const code = R.canonicalCode(raw);
        const cell = R.resolveCell(state, doc, iso);
        if (code === R.canonicalCode(cell.code || '')) continue;
        const kind = R.kindOf(code);
        if (cell.leave) { out.ignored.push(`${doc.name}, ${R.fmtUk(iso)}: has approved leave, so "${raw}" was not used. Change leave through the request.`); continue; }
        if (kind === 'oncall') out.changes.push({ doctorId: doc.id, name: doc.name, date: iso, code, kind });
        else if (['site', 'lab', 'off', 'bh'].includes(kind) || code === 'TEACHING' || code === 'INDUCTION' || code === 'SPR TRAINING DAY') out.changes.push({ doctorId: doc.id, name: doc.name, date: iso, code, kind: 'site' });
        else if (kind === 'gone') continue;
        else out.ignored.push(`${doc.name}, ${R.fmtUk(iso)}: "${raw}" is not a location or on-call code${kind === 'leave' || kind === 'sick' ? ' (leave is added through leave requests)' : ''}.`);
      }
    }
    return out;
  }

  function masterTemplate(state, todayIso) {
    return X.write([
      helpSheet(MASTER_HELP),
      rotaSheet(state, todayIso),
      { name: 'Doctors', rows: doctorRows(state), widths: MASTER_WIDTHS, freeze: { row: 1, col: 1 }, heights: { 0: 42 } },
      { name: 'Consultant of the week', rows: consultantRows(state, todayIso), widths: [24, 30], freeze: { row: 1 } },
      { name: 'Leave restrictions', rows: restrictionRows(state), widths: [13, 13, 20, 50], freeze: { row: 1 } },
      { name: 'On-calls', rows: oncallRows(state, R.addDays(todayIso, -14)), widths: [12, 22, 20], freeze: { row: 1 } },
      { name: 'Rotation dates', rows: rotationRows(todayIso, 5), widths: [28, 18, 22, 70], freeze: { row: 1 } },
      { name: 'Codes', rows: codesRows(), widths: [34, 50] }
    ]);
  }

  // CSV (one sheet only). Dates are written dd/mm/yyyy.
  const csvCell = (v) => {
    let t = v === null || v === undefined ? '' : typeof v === 'object' ? (v.date ? R.fmtUk(v.v) : String(v.v === undefined ? '' : v.v)) : String(v);
    if (/^[=+\-@]/.test(t)) t = "'" + t; // keep spreadsheet formulas from running
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const toCsv = (rows) => '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  function parseCsv(text) {
    const t = String(text).replace(/^﻿/, '');
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; continue; }
      if (ch === '"') q = true;
      else if (ch === ',' || ch === ';' && !t.includes(',')) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.map((r) => r.map((c) => c.replace(/^'(?=[=+\-@])/, '')));
  }
  const doctorsCsvTemplate = (state) => toCsv(doctorRows(state));

  // Reads a master workbook (or a CSV of one of its tabs). Returns what would change; nothing is applied here.
  function parseMaster(state, sheets) {
    const out = { doctors: [], consultants: {}, restrictions: [], problems: [], found: [] };
    const headerOf = (sh) => { const h = findHeaderRowAny(sh.rows); return { h, cols: (sh.rows[h] || []).map((v) => cellText(v).toLowerCase()) }; };
    for (const sh of sheets) {
      const { h, cols } = headerOf(sh);
      const idx = (re) => cols.findIndex((x) => re.test(x));
      if (idx(/^date/) >= 0 && idx(/^day$/) >= 0 && !(/on-?call|change/i.test(sh.name || ''))) {
        if (out.rota) continue;
        const rota = parseRota(state, sh, h, { date: idx(/^date/), day: idx(/^day$/), cons: idx(/^consultant/) });
        if (!rota.columns) continue;
        out.found.push(sh.name || 'Rota');
        out.rota = rota;
        if (rota.unmatched.length) out.problems.push(`Rota tab: column${rota.unmatched.length > 1 ? 's' : ''} not matched to a doctor (skipped): ${rota.unmatched.slice(0, 6).join(', ')}. Add the doctor on the Doctors tab first.`);
      } else if (idx(/^name$|^name\b/) >= 0 && idx(/^grade/) >= 0) {
        out.found.push(sh.name || 'Doctors');
        const c = { name: idx(/^name/), grade: idx(/^grade/), cat: idx(/^categ|^group/), start: idx(/^start/), end: idx(/^finish(es)?$|^finishes|^end/), conf: idx(/confirm/), rep: idx(/takes over|replac/),
          email: idx(/email/), al: idx(/^annual/), extra: idx(/carried|extra/), sl: idx(/^study/), alias: idx(/spelling|alias/), days: ['mon', 'tue', 'wed', 'thu', 'fri'].map((d) => idx(new RegExp('^' + d))) };
        for (let r = h + 1; r < sh.rows.length; r++) {
          const row = sh.rows[r] || [];
          const name = cellText(row[c.name]);
          if (!name) continue;
          const grade = cellText(row[c.grade]);
          if (!grade) { out.problems.push(`Doctors row ${r + 1}: no grade for ${name}; skipped.`); continue; }
          const catTxt = cellText(row[c.cat]).toLowerCase();
          const prog = R.programmeOf(grade);
          const group = /senior|middle|\bmg\b/.test(catTxt) ? 'mg' : /resident|junior/.test(catTxt) ? 'res'
            : (prog === 'registrar' || /specialty|specialist|senior|registrar|\bsas\b|\bst[3-9]/i.test(grade)) ? 'mg' : 'res';
          let start = parseDate(row[c.start]) || '', end = parseDate(row[c.end]) || '';
          if ((cellText(row[c.start]) && !start) || (cellText(row[c.end]) && !end)) out.problems.push(`Doctors row ${r + 1}: could not read a date for ${name}. Use dd/mm/yyyy.`);
          let suggested = false;
          if (!start && prog !== 'other') { const sug = R.suggestDates(grade, R.toIso(new Date())); start = sug.start; end = end || sug.end; suggested = true; }
          const plan = c.days.map((i) => (i >= 0 ? R.canonicalCode(cellText(row[i])) : ''));
          plan.forEach((code, k) => { if (code && !['site', 'lab', 'off', 'leave'].includes(R.kindOf(code))) out.problems.push(`Doctors row ${r + 1}: "${cellText(row[c.days[k]])}" is not a location code (${name}, ${R.DOW_SHORT[k]}).`); });
          const num = (v) => { const t = cellText(v); if (t === '') return undefined; const n = Number(t); return isFinite(n) ? n : undefined; };
          const conf = cellText(row[c.conf]).toLowerCase();
          out.doctors.push({ row: r + 1, name, grade, group, start, end, endProvisional: conf ? /^n/.test(conf) : prog !== 'foundation' && !!end && suggested,
            replacesName: cellText(row[c.rep]), plan, email: cellText(row[c.email]), alEntitlement: num(row[c.al]), alExtra: num(row[c.extra]), slEntitlement: num(row[c.sl]),
            aliases: cellText(row[c.alias]).split(',').map((x) => x.trim()).filter(Boolean), placeholder: /^new\b|\btbc\b/i.test(name), suggested });
        }
      } else if (idx(/week/) >= 0 && idx(/consultant/) >= 0) {
        out.found.push(sh.name || 'Consultant of the week');
        const iw = idx(/week/), ic = idx(/consultant/);
        for (let r = h + 1; r < sh.rows.length; r++) {
          const row = sh.rows[r] || [];
          const d = parseDate(row[iw]);
          const who = cellText(row[ic]);
          if (!d) { if (cellText(row[iw])) out.problems.push(`Consultant row ${r + 1}: could not read the date.`); continue; }
          if (who) out.consultants[R.mondayOf(d)] = who;
        }
      } else if (/on-?call/i.test(sh.name || '') || (idx(/^date/) >= 0 && (idx(/^shift|^code/) >= 0))) {
        if (out.oncall || !sh.rows.slice(h + 1).some((r) => r && r.some((v) => cellText(v)))) continue;
        out.found.push(sh.name || 'On-calls');
        out.oncall = parseOncall(state, [sh]);
      } else if (idx(/^level/) >= 0 && idx(/^from/) >= 0) {
        out.found.push(sh.name || 'Leave restrictions');
        const ia = idx(/^from/), ib = idx(/^to/), il = idx(/^level/), inote = idx(/^note/);
        for (let r = h + 1; r < sh.rows.length; r++) {
          const row = sh.rows[r] || [];
          const a = parseDate(row[ia]);
          if (!a) continue;
          const b = parseDate(row[ib]) || a;
          const level = /avoid/i.test(cellText(row[il])) ? 'AVOID' : 'NO AL';
          out.restrictions.push({ start: a, end: b < a ? a : b, level, note: cellText(row[inote]) });
        }
      }
    }
    if (!out.found.length) out.problems.push('No Rota, Doctors, Consultant of the week, Leave restrictions or On-calls tab was found. Use the rota data file template.');
    return out;
  }
  function findHeaderRowAny(rows) {
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      if ((rows[i] || []).some((v) => /^(name|grade|week|from|date|doctor)/i.test(cellText(v)))) return i;
    }
    return 0;
  }

  // Full backup: the master tabs (re-importable) plus everything else, read-only. Shared by the Excel and CSV backups.
  function backupTables(state, todayIso) {
    const docName = (id) => (R.doctorById(state, id) || { name: id }).name;
    const changes = [[head('Date'), head('Doctor'), head('Changed to'), head('Reason'), head('By')]];
    Object.entries(state.overrides || {}).forEach(([id, m]) => Object.entries(m).forEach(([d, o]) => changes.push([{ v: d, date: true }, docName(id), o.code, o.reason || '', o.by || ''])));
    changes.splice(1, changes.length, ...changes.slice(1).sort((a, b) => (a[0].v < b[0].v ? -1 : a[0].v > b[0].v ? 1 : 0)));
    const leave = [[head('Doctor'), head('Type'), head('From'), head('To'), head('Part'), head('Working days'), head('Status'), head('Days not approved'), head('Decided by'), head('Sent')]].concat(state.requests.map((r) => [docName(r.doctorId), r.type === 'SICK' ? 'Unavailable' : (R.LEAVE_TYPES[r.type] || R.LEAVE_TYPES.OTHER).label, { v: r.start, date: true }, { v: r.end, date: true }, r.part, r.days, r.status, (r.excludedDates || []).map(R.fmtUk).join(', '), r.decidedBy || '', (r.submittedAt || '').slice(0, 10)]));
    const edt = [[head('Date'), head('Session'), head('Doctor'), head('Type'), head('Booked by')]].concat((state.edt || []).map((e) => [{ v: e.date, date: true }, e.session, docName(e.doctorId), e.type, e.bookedBy || '']));
    const audit = [[head('When'), head('Who'), head('What'), head('Details')]].concat((state.audit || []).map((a) => [a.at.slice(0, 16).replace('T', ' '), a.by, a.action, a.detail]));
    const r = rotaRange(state, todayIso);
    const rota = rotaRows(state, R.addDays(todayIso, -90), r.to);
    return [
      { name: 'Rota', file: 'rota', rows: rota.rows, widths: rota.widths, freeze: { row: 1, col: 2 }, heights: { 0: 42 } },
      { name: 'Doctors', file: 'doctors', rows: doctorRows(state), widths: MASTER_WIDTHS, freeze: { row: 1, col: 1 }, heights: { 0: 42 } },
      { name: 'Consultant of the week', file: 'consultant-of-the-week', rows: consultantRows(state, todayIso), widths: [24, 30], freeze: { row: 1 } },
      { name: 'Leave restrictions', file: 'leave-restrictions', rows: restrictionRows(state), widths: [13, 13, 20, 50], freeze: { row: 1 } },
      { name: 'On-calls', file: 'on-calls', rows: oncallRows(state), widths: [12, 22, 20], freeze: { row: 1 } },
      { name: 'Leave', file: 'leave-requests', rows: leave, widths: [18, 22, 12, 12, 7, 8, 11, 30, 14, 12], freeze: { row: 1 } },
      { name: 'Rota changes', file: 'rota-changes', rows: changes, widths: [12, 20, 20, 40, 14], freeze: { row: 1 } },
      { name: 'EDT SDT', file: 'edt-sdt', rows: edt, widths: [12, 8, 20, 8, 14], freeze: { row: 1 } },
      { name: 'Change log', file: 'change-log', rows: audit, widths: [17, 18, 26, 90], freeze: { row: 1 } }
    ];
  }
  function backupWorkbook(state, todayIso) {
    return X.write([
      helpSheet([`Haematology rota data file and backup, ${R.fmtLong(todayIso)}`, '', 'This is the same file as Set up → Data file. The Rota, Doctors, Consultant of the week, Leave restrictions and On-calls tabs can be uploaded again there.', 'The other tabs (Leave, Rota changes, EDT SDT, Change log) are a read-only record.', 'For an exact restore of everything, use Set up → Backups on the website.'])
    ].concat(backupTables(state, todayIso)));
  }
  // CSV backup: one CSV per table, in a zip. Opens in Excel; rota.csv and doctors.csv can be uploaded again under Data file.
  function csvBackupZip(state, todayIso) {
    const te = new TextEncoder();
    const flat = (rows) => rows.map((row) => row.map((v) => (v && typeof v.v === 'string' && !v.date ? Object.assign({}, v, { v: v.v.replace(/\n/g, ' ') }) : v)));
    const files = backupTables(state, todayIso).map((t) => ({ name: `${t.file}.csv`, data: te.encode(toCsv(flat(t.rows))) }));
    files.unshift({ name: 'READ ME.txt', data: te.encode([`Haematology rota CSV backup, ${R.fmtLong(todayIso)}`, '',
      'One CSV per table. They open in Excel.', 'rota.csv (the whole rota) and doctors.csv can be uploaded again under Set up → Data file.',
      'The other files are a read-only record. For an exact restore of everything, use the JSON copies under Set up → Backups.'].join('\r\n')) });
    return X.zip(files);
  }

  // ---------- roster export ----------
  function rosterWorkbook(state, from, to) {
    const docs = state.doctors.filter((d) => R.dateRange(from, to).some((iso) => R.inPost(d, iso) || (d.start && d.start <= to)))
      .sort((a, b) => (a.group === b.group ? 0 : a.group === 'res' ? -1 : 1));
    const header = [head('Date'), head('Day'), head('Consultant'), head('Leave restriction')]
      .concat(docs.map((d) => head(`${d.grade}\n${d.name}`)))
      .concat([head('Residents (GUH · RGH · NHH)'), head('Senior doctors (GUH ward · RGH DU · NHH DU)')]);
    const rows = [header];
    for (const iso of R.dateRange(from, to)) {
      const wk = R.isWeekend(iso);
      const base = { border: true, center: true, wrap: true };
      const dark = wk ? { fill: FILL.WEEKEND, color: 'FFFFFF' } : {};
      const restr = S.restrictionOn(state, iso);
      const row = [
        { v: iso, date: true, style: Object.assign({}, base, dark, restr && !wk ? { fill: restr.level === 'NO AL' ? 'C00000' : '7030A0', color: 'FFFFFF', bold: true } : {}) },
        { v: R.DOW_LONG[R.dow(iso)], style: Object.assign({}, base, dark) },
        { v: wk ? '' : (state.settings.consultantOfWeek[R.mondayOf(iso)] || ''), style: Object.assign({}, base, dark) },
        { v: restr ? restr.level : '', style: Object.assign({}, base, dark) }
      ];
      for (const d of docs) {
        const cell = R.resolveCell(state, d, iso);
        let v = cell.code;
        if (cell.pending && cell.kind !== 'leave') v = (v ? v + '\n' : '') + `(${(R.LEAVE_TYPES[cell.pending.type] || R.LEAVE_TYPES.OTHER).label} requested)`;
        const fill = fillFor(cell) || (wk ? FILL.WEEKEND : null);
        row.push({ v, style: Object.assign({}, base, fill ? { fill } : {}, cell.kind === 'gone' || (wk && !fill) ? { color: 'FFFFFF' } : {}) });
      }
      const cover = R.coverWithRisk(state, iso);
      const txt = (group) => cover ? cover.rules.filter((r) => r.rule.group === group).map((r) => `${r.rule.short} ${({ ok: 'OK', gap: 'GAP', exception: 'resident only', risk: 'AT RISK', na: 'n/a' })[r.status]}`).join(' · ') : '';
      const bad = (group) => cover && cover.rules.some((r) => r.rule.group === group && (r.status === 'gap' || r.status === 'risk'));
      row.push({ v: txt('res'), style: Object.assign({}, base, dark, bad('res') ? { color: 'C00000', bold: true } : {}) });
      row.push({ v: txt('mg'), style: Object.assign({}, base, dark, bad('mg') ? { color: 'C00000', bold: true } : {}) });
      rows.push(row);
    }
    const log = [[head('Submitted'), head('Doctor'), head('Type'), head('From'), head('To'), head('Part'), head('Working days'), head('Status'), head('Decided by'), head('Decided at'), head('Cover'), head('Reason / note')]];
    for (const r of state.requests.slice().sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1))) {
      const d = R.doctorById(state, r.doctorId);
      log.push([(r.submittedAt || '').slice(0, 16).replace('T', ' '), d ? d.name : r.doctorId, r.type === 'SICK' || r.type === 'UNAVAIL' ? 'Unavailable' : (R.LEAVE_TYPES[r.type] || R.LEAVE_TYPES.OTHER).label, { v: r.start, date: true }, { v: r.end, date: true }, r.part, r.days, r.status, r.decidedBy || '', (r.decidedAt || '').slice(0, 16).replace('T', ' '), (r.cover || []).map((c) => c.text).join('; '), r.type === 'SICK' ? '' : (r.message || r.note || '')]);
    }
    const audit = [[head('When'), head('Who'), head('What'), head('Details')]].concat(state.audit.map((a) => [a.at.slice(0, 16).replace('T', ' '), a.by, a.action, a.detail]));
    return X.write([
      { name: 'Roster', rows, widths: [12, 11, 14, 11].concat(docs.map(() => 15)).concat([30, 40]), freeze: { row: 1, col: 2 }, heights: { 0: 42 } },
      { name: 'Leave log', rows: log, widths: [17, 16, 22, 12, 12, 7, 8, 11, 14, 17, 40, 40], freeze: { row: 1 } },
      { name: 'Change log', rows: audit, widths: [17, 18, 26, 90], freeze: { row: 1 } },
      { name: 'About', rows: [['Exported from the Haematology Rota website. This copy is read-only: make changes in the app and export again.'], [`Dates ${R.fmtUk(from)} to ${R.fmtUk(to)}.`]], widths: [110] }
    ]);
  }

  const api = { oncallTemplate, planTemplate, staffTemplate, parseOncall, parsePlans, parseStaff, matchDoctor, parseDate, rosterWorkbook, FILL,
    masterTemplate, doctorsCsvTemplate, rotaCsv, parseMaster, parseCsv, toCsv, backupWorkbook, csvBackupZip };
  root.RotaExcel = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Screens and interactions for the Haematology Rota website. */
(function () {
  'use strict';

    view: 'rota', start: TODAY, end: R.addDays(R.addMonths(TODAY, 2), -1), scrollToIso: null, days: [], layout: 'grid', group: 'both', hi: 'all', q: '', hideWeekends: false,
    editing: null, form: null, submitted: null, mine: { doctorId: '', email: '', result: null }, reqSel: null, reqFilter: 'open',
    edt: { doctorId: '', date: '', session: 'AM', reason: '' }, setupTab: 'import', nd: null, consExtra: 0, bulk: null, importPreview: null, confirm: null, logQ: '',
    rulesDraft: null, dialog: null, busy: false, scrollToToday: true, copyFrom: ''

  try { const v = sessionStorage.getItem('haem-rota-view'); if (v) ui.view = v; } catch (e) { /* storage blocked */ }
  try { const m = JSON.parse(localStorage.getItem('haem-rota-mine') || 'null'); if (m) Object.assign(ui.mine, { doctorId: m.doctorId || '', email: m.email || '' }); } catch (e) { /* storage blocked */ }

  // ---------- helpers ----------

  const docsSorted = () => st().doctors.slice().sort((a, b) => (a.group === b.group ? a.name.localeCompare(b.name) : a.group === 'res' ? -1 : 1));
  const GRADES = { res: ['F1', 'F2', 'IMT1', 'IMT2', 'IMT3', 'JCF'], mg: ['Registrar ST3', 'Registrar ST4', 'Registrar ST5', 'Registrar ST6', 'Registrar ST7', 'Registrar ST8', 'Specialty doctor', 'Specialist grade', 'Senior clinical fellow'] };
  const GRADE_LABEL = { JCF: 'JCF (junior clinical fellow)' };
